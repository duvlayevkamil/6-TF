ispersiya (oq yorning ranglarga ajralishi)","To'g'ri tarqalish","Muvozanat","Yonma-yon qaytish"],0,"Yomg'ir tomchilari prizma kabi ishlaydi."],["Suvdan havoga chiqqan nurning sinish burchagi tushish burchagidan qanday?",["Katta","Nolga teng","Teng","Kichik"],0,"Optiki zich muhitdan siyrak muhitga o'tganda burchak ortadi."]],"slideQuiz":[["Baliqchini suv ostidagi baliqqa nayza otganda nima hisobga olishi kerak?",["Suv to'siq bo'ladi","Ovoz kech eshitiladi","Tasvir haqiqiy joydan yuqoriroq ko'rinadi","Rang o'zgaradi"],2,"Sinish tufayli tasvir ko'tarilib ko'rinadi — pastroq nishon olish kerak."],["Qaysi rang linzada eng kuchli sinadi?",["Binafsha","Sariq","Qizil","Yashil"],0,"To'lqin uzunligi qisqa bo'lsa, sinish kuchli."]],"game":[["Hodisani qurilma bilan moslashting: lupa",["Botiq linza","Yassi ko'zgu","Prizma","Yig'uvchi linza"],3,"Qavariq linza tasvirni kattalashtiradi."],["Qaysida nur normaldan chetlashadi?",["Suvdan havoga o'tganda","Vakuumda","Havodan suvga","Havodan shishaga"],0,"Siyrak muhitga o'tishda burchak ortadi."],["Prizmadan chiqqan oq yorug'lik — nima bo'ladi?",["Orqaga qaytadi","Yanada oq bo'ladi","To'liq yutiladi","Ranglar spektriga ajraladi"],3,"Har bir rang boshqacha sinadi — dispersiya."]],"gameQuiz":[["Hodisani qurilma bilan moslashting: lupa",["Botiq linza","Yassi ko'zgu","Prizma","Yig'uvchi linza"],3,"Qavariq linza tasvirni kattalashtiradi."],["Qaysida nur normaldan chetlashadi?",["Suvdan havoga o'tganda","Vakuumda","Havodan suvga","Havodan shishaga"],0,"Siyrak muhitga o'tishda burchak ortadi."],["Prizmadan chiqqan oq yorug'lik — nima bo'ladi?",["Orqaga qaytadi","Yanada oq bo'ladi","To'liq yutiladi","Ranglar spektriga ajraladi"],3,"Har bir rang boshqacha sinadi — dispersiya."]],"task":{"q":"Suvga solingan qolomning sinishini o'lchang: stakan yonidan qog'ozga chizilgan chiziqni qo'yib, sinish burchaklarini transportir bilan aniqlang va «tasvir ko'tarilib ko'rinadi» xulosasini chizma bilan asoslang.","a":"Havo→suv o'tishida burchak kichrayadi, suv→havo chiqishda ortadi. Qolom suv yuzasida «sinib» ko'rinadi; chizmadan tasvirning haqiqiydan yuqorida ekanini ko'rsatish mumkin.","why":"Chizma va o'lchovni birga ishlatish — optikani tushuntirishning eng ishonchli usuli; xulosani faqat «shunday ko'rinadi» deb emas, burchaklar bilan asoslaysiz.","steps":["Stakan oldiga chizilgan chiziqni qo'ying va bir chetdan qarab chiziqning «siljishini» belgilang","Qolomni suvga soling va 3 holatni chizing (havo, suv, qo'shma)","Transportir bilan tushish va sinish burchaklarini o'lchang","Normalni chizing va burchaklarni aniq yozib oling","Xulosa: qaysi muhitda burchak kichik? Nega tasvir ko'tariladi?"],"jihoz":["Shaffof stakan, suv","Qolom yoki somon naycha","Transportir, qog'oz, chizg'ich","Chizma uchun floaster"],"xavfsizlik":["Shishani ushlashda ehtiyot bo'ling","Suvni stolga to'kmang — elektron qurilmalardan uzoq tuting"]},"act":{"type":"lab","name":"yoruglik","mode":"sinish"},"kitob":{"bobNomi":"Yorug‘likning tarqalishi","bet":98,"oralig":"98–108","kod":"8.2","amaliyIsh":{"kod":"8.2","nomi":"Yorug‘likning sinishiga doir qiziqarli tajriba","bet":90},"boshqotirma":91,"bilimlarXaritasi":92,"takrorlash":93,"mustahkamlash":95},"urinish":{"savollar":["Yorug‘lik bir muhitdan ikkinchi muhitga o‘tganda nima sodir bo‘ladi?"],"qism_mavzular":[],"konikmalar":["o‘rganilayotgan obyektlarni kuzatish natijalariga asoslanib tasniflash;","tadqiqot natijalaridagi qonuniyatni bayon etish hamda kutilmagan natijalarni aniqlash;","tadqiqotni yaxshilash yuzasidan taklif berish va uni izohlash;","ishonchli natijalar olish uchun o‘lchashlarni takrorlash zarurligi yuzasidan qaror qabul qilish;","ilmiy hodisani tasvirlash va izohlashda modeldan foydalanish;","ilmiy savol qo‘yish va unga javob topishga yordam beradigan eng yaxshi tadqiqot metodini tanlash;","turli tadqiqot metodlarining o‘ziga xos xususiyatlarini anglash;","nazorat qilinadigan tajriba rejasini tuzish va uch xil o‘zgaruvchini aniqlash."],"tatbiq":["tabiiy fanlar yutuqlaridan kundalik hayotda foydalanilishini bayon etish;","tabiiy fanlarning muayyan sohasida faoliyat yurituvchi kasb egalarini aniqlash va ularning faoliyatini tavsiflash;","fan va texnologiya yutuqlaridan foydalanishning atrof-muhitga ijobiy va salbiy ta’sirini muhokama qilish."]}},{"d":9,"c":1,"kod":"9.1","t":"Elektr zanjir sxemalari","chorak":3,"lab":"elektr","labMode":"sxema","labTitle":"Zanjir va shartli belgilar","theory":"Elektr zanjiri — tok oqishi uchun zarur to'rt element: manba (batareya), o'tkazgich simlar, iste'molchi (lampa, motor) va kalit. Bular yopiq iz hosil qilgandagina tok oqadi.\n\nZanjirni chizishda shartli belgilar ishlatiladi — bu xalqaro «til»: batareya — uzun (musbat) va qisqa (manfiy) chiziqlar; lampa — aylana ichida xoch; kalit — uzilgan chiziq va ko'tarilgan chiziqcha; o'tkazgich — to'g'ri chiziq. Chizma real buyumlardan ancha sodda va hamma uchun tushunarli.\n\nO'tkazgich — tokni yaxshi o'tkazuvchi material: mis, alyuminiy, temir, uglerod (grafit), tuzli suv. Izolyator — o'tkazmaydigan material: rezina, plastmassa, shisha, quruq yog'och, havo. Shu ikki xossani birga ishlatish xavfsizlikning asosi: simning ichi metall, tashqi qatlam rezina.\n\nZanjir elementlarini ulashning ikki turi bor — ketma-ket va parallel. Ular bilan keyingi mavzuda ishlaymiz; hozircha sxemani to'g'ri chizish va o'qish muhim: sxema bo'yicha yig'ilgan zanjir bilan real zanjir bir xil ishlashi kerak.\n\nXavfsizlik: uy tarmog'i (220 V) hayot uchun xavfli — maktabda va uydagi tajribalarda faqat batareya (1,5–9 V) bilan ishlanadi. Qisqa tutashuv (manba qutblarini to'g'ridan-to'g'ri ulash) simni qizdiradi va yong'in keltirib chiqarishi mumkin.","formulas":["Yopiq zanjir = manba + o'tkazgich + iste'molchi + kalit","O'tkazgich: metallar, grafit, tuzli suv","Izolyator: rezina, plastmassa, shisha, quruq yog'och","Chizmada: uzun chiziq — musbat qutb, qisqa — manfiy","Tok kuchi I — amper (A); kuchlanish U — volt (V)","Qarshilik R — om (Ω)"],"vocab":[{"w":"Elektr zanjiri","m":"tok oqadigan yopiq iz"},{"w":"Manba","m":"zanjirga kuchlanish beruvchi qurilma (batareya, generator)"},{"w":"Iste'molchi","m":"elektr energiyasini ishga aylantiruvchi element"},{"w":"O'tkazgich","m":"tokni yaxshi o'tkazuvchi material"},{"w":"Izolyator","m":"tokni o'tkazmaydigan material"},{"w":"Shartli belgi","m":"elementni ifodalovchi standart chizma belgisi"}],"quiz":[["Zanjirda tok oqishi uchun nima shart?",["Zanjir yopiq bo'lishi kerak","Lampa katta bo'lishi kerak","Ikki batareya kerak","Kalit ochiq bo'lishi kerak"],0,"Uzuq izda zarryadlar harakati to'xtaydi."],["Qaysi material — izolyator?",["Rezina","Tuzli suv","Mis","Grafit"],0,"Rezina tokni deyarli o'tkazmaydi."],["Zanjir sxemasida uzun va qisqa parallel chiziqlar nimani bildiradi?",["Kalit holati","Batareya qutblari","Lampa","Sim uzunligi"],1,"Uzun — musbat, qisqa — manfiy qutb."],["Sxemani o'qish va chizish nega muhim?",["Chizma bo'yicha zanjirni yig'ish va xatoni topish uchun","Rasm chiroyli bo'lishi uchun","Vaqt tejash uchun","Material narxini bilish uchun"],0,"Sxema — zanjirni boshqalarga ham aniq tushuntirishning standart usuli."],["Maktab tajribasida qaysi manba bilan ishlash to'g'ri?",["Uy rozetkasi bilan","Tarmoq bloki bilan","Generatordan","Batareya bilan"],3,"220 V xavfli; 3–4,5 V xavfsiz chegarada."]],"slideQuiz":[["Sim nega metall ichi va rezina qoplamadan iborat?",["Rezina tokni kuchaytiradi","Qoplama arzonroq","Metall sovishi kerak","Biri tokni o'tkazadi, ikkinchisi himoya qiladi"],3,"Ikkita xossa birga ishlaydi: o'tkazuvchanlik + izolyatsiya."],["Kalit qanday «boshqaradi»?",["Tokni o'lchaydi","Qarshilikni kamaytiradi","Zanjirni ochib-yopib tokni uzadi yoki o'tkazadi","Kuchlanishni oshiradi"],2,"Kalit — zanjirning boshqariladigan uzilish joyi."]],"game":[["Elementni vazifasi bilan moslang: lampa",["Iste'molchi","Izolyator","Manba","Kalit"],0,"Lampa energiyani yorug'likka aylantiradi."],["Belgini nomiga moslang: aylana ichida xoch",["Ampermetr","Batareya","Lampa","Kalit"],2,"Bu — lampaning standart shartli belgisi."],["Qaysi biri zanjirning majburiy elementi?",["Transportir","Manba","Termometr","Mikroskop"],1,"Kuchlanish manbasiz tok oqmaydi."],["Zanjir yig'ilib, lampa yonmayapti. Birinchi nima tekshiriladi?",["Iz yopiqmi, ulanishlar mahkammu","Sim uzunligi","Lampa og'irligi","Batareya rangi"],0,"Eng ko'p uchraydigan sabab — uzilgan yoki bo'sh ulanish."]],"gameQuiz":[["Elementni vazifasi bilan moslang: lampa",["Iste'molchi","Izolyator","Manba","Kalit"],0,"Lampa energiyani yorug'likka aylantiradi."],["Belgini nomiga moslang: aylana ichida xoch",["Ampermetr","Batareya","Lampa","Kalit"],2,"Bu — lampaning standart shartli belgisi."],["Qaysi biri zanjirning majburiy elementi?",["Transportir","Manba","Termometr","Mikroskop"],1,"Kuchlanish manbasiz tok oqmaydi."],["Zanjir yig'ilib, lampa yonmayapti. Birinchi nima tekshiriladi?",["Iz yopiqmi, ulanishlar mahkammu","Sim uzunligi","Lampa og'irligi","Batareya rangi"],0,"Eng ko'p uchraydigan sabab — uzilgan yoki bo'sh ulanish."]],"task":{"q":"«Elektr zanjir sxemalari» — batareya, lampa va kalit bilan zanjir yig'ing, uni (1) rasmga tushiring, (2) shartli belgilar sxemasiga aylantiring; so'ng sxemangizni qo'shningizga bering — u xatosiz yig'a oldimi?","a":"Zanjir yopiq bo'lsa lampa yonadi; kalit ochilsa — yonmaydi. Sxema to'g'ri bo'lsa, qo'shningiz qurilmalarni shu tartibda ulanganda lampa yonadi.","why":"Sxemani o'qish va chizish — muhandislik muloqotining asosi: bitta xato (uzilgan iz, noto'g'ri qutb) butun zanjirni ishlamaydigan qiladi.","steps":["Zanjirni ulang va lampa yonishini tekshiring","Real ko'rinishini rasmga tushiring","Shartli belgilar bilan sxema chizing","Kalitli va kalitsiz holatni alohida chizing","Sxemalarni qo'shningiz bilan almashtiring va natijani yozing"],"jihoz":["Batareya (3–4,5 V) va patronli lampa","Kalit, 2–3 ulagich sim (krokodilli)","Qog'oz, chizg'ich, qalam"],"xavfsizlik":["Faqat batareya bilan ishlang — uy rozetkasiga ulamang","Qisqa tutashuvga yo'l qo'ymang (qutblarni to'g'ridan-to'g'ri ulamang)","Sim va lampa isishi mumkin — uzoq ushlamang"]},"act":{"type":"lab","name":"elektr","mode":"sxema"},"kitob":{"bobNomi":"Elektr zanjirlar","bet":109,"oralig":"109–119","kod":"9.1","amaliyIsh":{"kod":"9.1","nomi":"Elektr zanjir sxemalari","bet":97},"boshqotirma":102,"bilimlarXaritasi":103,"takrorlash":104,"mustahkamlash":107},"urinish":{"savollar":["Elektr zanjir sxemasi deganda nimani tushunamiz?"],"qism_mavzular":[],"konikmalar":["tadqiqot uchun kerakli jihozlarni tanlash va ulardan to‘g‘ri foydalanish;","amaliy ishni bajarish davomida xavfsizlik qoidalariga rioya qilish;","ilmiy tushunchani anglashda modelning ahamiyatini bayon etish;","ilmiy tushunchani tasvirlash va izohlashda modeldan foydalanish;","egallangan bilimlarni qo‘llab tadqiqot natijalarini bashorat qilish;","tadqiqot natijalariga asoslanib bashoratning aniqligini bayon etish;","tadqiqot natijalaridagi qonuniyatni bayon etish hamda kutilmagan natijalarni aniqlash."],"tatbiq":["bahs-munozarada o‘z nuqtayi nazarini ilmiy dalillardan foydalanib asoslash;","fan va texnologiya yutuqlaridan foydalanishning atrof-muhitga ijobiy ta’sirini muhokama qilish."]}},{"d":9,"c":2,"kod":"9.2","t":"Elektr zanjir turlari","chorak":3,"lab":"elektr","labMode":"qiyos","labTitle":"Ketma-ket va parallel zanjir","theory":"Ikki lampani bitta iz bo'ylab ulang — ketma-ket zanjir. Unda tokning yagona yo'li bor, shu sabab tok kuchi hamma qismda bir xil (I = I₁ = I₂), kuchlanish esa lampalar bo'ylab bo'linadi (U = U₁ + U₂).\n\nKetma-ket zanjirning zaif joyi — uzilish: bitta lampa ishdan chiqsa yoki olib tashlansa, butun zanjir to'xtaydi va ikkinchi lampa yonmaydi. Umumiy qarshilik ortadi (R = R₁ + R₂), shu sabab lampalar so'nuqroq yonadi.\n\nParallel ulanishda har lampa o'z tarmog'i orqali manbaga ulanadi: kuchlanish har tarmoqda bir xil (U = U₁ = U₂), umumiy tok esa tarmoq toklarining yig'indisiga teng (I = I₁ + I₂).\n\nParallel zanjirning ustunligi — mustaqillik: bitta lampa o'chsa yoki olib tashlansa, qolganlari yonaveradi. Shu sabab uydagi chiroqlar, rozetkalar va asboblar parallel ulanadi — har biri o'z kaliti bilan boshqariladi.\n\nAmmo parallel ulanishda tarmoq soni ortsa umumiy tok ham ortadi — sim qiziydi. Shu sabab tarmoqda himoya avtomati bor: haddan tashqari tokda u izni uzadi. «Qaysi zanjir kerak?» degan savol shu ikki tomondan yechiladi: yorqinlik va mustaqillik kerak bo'lsa — parallel; tokni bir xil saqlaydigan oddiy zanjir kerak bo'lsa — ketma-ket.","formulas":["Ketma-ket: I = I₁ = I₂; U = U₁ + U₂; R = R₁ + R₂","Ketma-ket: bitta uzilish — hammasi to'xtaydi","Parallel: U = U₁ = U₂; I = I₁ + I₂","Parallel: 1/R = 1/R₁ + 1/R₂ (umumiy R kamayadi)","Lampa yorqinligi: parallel > ketma-ket","Uy tarmog'i = parallel ulanish + himoya avtomati"],"vocab":[{"w":"Ketma-ket ulanish","m":"elementlarning bitta iz bo'ylab ulanishi"},{"w":"Parallel ulanish","m":"elementlarning alohida tarmoqlar orqali ulanishi"},{"w":"Tarmoq","m":"zanjirning bir iste'molchi o'tadigan qismi"},{"w":"Yorqinlik","m":"lampaga yetib boradigan quvvatga bog'liq ko'rsatkich"},{"w":"Himoya avtomati","m":"haddan tashqari tokda izni uzuvchi qurilma"}],"quiz":[["Ketma-ket zanjirda tok kuchi qanday bo'ladi?",["Taqsimlanib kamayadi","Birinchi lampada ko'p","Oxirgisida ko'p","Hamma qismda bir xil"],3,"Tokning bitta yo'li bor — shu sabab hamma joyda bir xil."],["2 ta lampani ketma-ket ulanganda ular qanday yonadi?",["Bittasi yonadi","Umuman yonmaydi","Ikkalasi ham to'liq yorqin","Har biriga kamroq kuchlanish — so'nuqroq"],3,"U = U₁ + U₂ bo'linadi; har lampa kuchsizroq ishlaydi."],["Parallel zanjirda bitta lampani olsangiz nima bo'ladi?",["Qolgani o'chadi","Qolgani yorqinroq","Qolgani avvalgidek yonadi","Batareya buziladi"],2,"Tarmoqlar mustaqil — kuchlanish o'zgarmaydi."],["Uydagi chiroqlar qanday ulangan?",["Ulanish tartibi yo'q","Parallel","Ketma-ket","Aralash"],1,"Mustaqillik va har asbobga bir xil kuchlanish talabi shuni taqozo qiladi."],["Ko'p asbobni bir bagetkaga ulash xavfi nimada?",["Umumiy tok ortadi, sim qiziydi","Lampalar yorqinroq yonadi","Tok to'xtaydi","Kuchlanish ortadi"],0,"Shu sabab avtomat tok chegarasidan chiqqanda izni uzadi."]],"slideQuiz":[["Qaysi zanjirda lampa yorqinroq yonadi (bitta batareya, 2 lampa)?",["Hech qaysida","Parallelda","Ketma-ketda","Ikkalasi bir xil"],1,"Parallelda har lampaga to'liq kuchlanish yetib boradi."],["Yilinma chiroqlarida bittasi yonmasa qolganlari ham o'chdi — qanday ulanish?",["Ketma-ket","Parallel","Sxemada xato yo'q","Aralash"],0,"Bitta uzilish butun izni to'xtatadi — bu ketma-ket belgisi."]],"game":[["Xossani ulanish turi bilan moslang: bitta uzilish — hammasi to'xtaydi",["Ikkalasi","Hech qaysi","Parallel","Ketma-ket"],3,"Yagona yo'l bo'lsa — uzilish hal qiluvchi."],["Parallel zanjirda I₁ = 0,3 A, I₂ = 0,5 A. Umumiy tok qancha?",["0,2 A","1,5 A","0,8 A","0,15 A"],2,"I = I₁ + I₂ = 0,8 A."],["Qaysi zanjir uy tarmog'i uchun to'g'ri?",["Faqat bitta iste'molchi bilan","Parallel","Farqi yo'q","Ketma-ket"],1,"Har asbob mustaqil ishlaydi va 220 V oladi."],["Ketma-ket zanjirga uchinchi lampa qo'shilsa nima bo'ladi?",["Hammasi yorqinroq","Batareya kuchsizlanmaydi","Hammasi so'nuqroq","O'zgarmaydi"],2,"Qarshilik ortadi → tok kamayadi."]],"gameQuiz":[["Xossani ulanish turi bilan moslang: bitta uzilish — hammasi to'xtaydi",["Ikkalasi","Hech qaysi","Parallel","Ketma-ket"],3,"Yagona yo'l bo'lsa — uzilish hal qiluvchi."],["Parallel zanjirda I₁ = 0,3 A, I₂ = 0,5 A. Umumiy tok qancha?",["0,2 A","1,5 A","0,8 A","0,15 A"],2,"I = I₁ + I₂ = 0,8 A."],["Qaysi zanjir uy tarmog'i uchun to'g'ri?",["Faqat bitta iste'molchi bilan","Parallel","Farqi yo'q","Ketma-ket"],1,"Har asbob mustaqil ishlaydi va 220 V oladi."],["Ketma-ket zanjirga uchinchi lampa qo'shilsa nima bo'ladi?",["Hammasi yorqinroq","Batareya kuchsizlanmaydi","Hammasi so'nuqroq","O'zgarmaydi"],2,"Qarshilik ortadi → tok kamayadi."]],"task":{"q":"«Chiroqni yoqing» va «Qaysi turdagi elektr zanjirdan foydalanish kerak?» — 2 lampa, batareya va kalit bilan ikki xil zanjir yig'ing, yorqinlikni solishtiring, bitta lampani olib qolgani kuzating. So'ng maktab xonasini yoritish uchun qaysi zanjirni tavsiya qilishni asoslang.","a":"Ketma-ketda lampalar so'nuqroq, bittasini olsangiz hammasi o'chadi. Parallelda yorqinlik bir xil va lampalar mustaqil yonadi — xonani yoritish uchun parallel tanlanadi (kamchiligi: umumiy tok ortadi, sim isiydi).","why":"Bu amaliy ishda zanjir turini tanlash haqiqiy muhandislik qaroridir: yorqinlik, mustaqillik va simga tushadigan yuk birga hisobga olinadi.","steps":["Ikki lampani ketma-ket ulang, yorqinlikni 1–5 shkalada baho lang","Bitta lampani oling — ikkinchisi yonadimi?","Endi parallel ulang, yorqinlikni qayta baho lang","Parallel holatda ham bitta lampani olib kuzatuv yozing","Xulosa: xona yoritish uchun qaysi tur va nima uchun?"],"jihoz":["Batareya bloki (3–4,5 V)","2 patronli lampa (2,5 V)","Kalit, 5–6 ulagich sim (krokodilli)","Ixtiyoriy: ampermetr (multimetr)"],"xavfsizlik":["Faqat batareya bilan ishlang — rozetkaga yaqin bermang","Zanjirni uzoq vaqt ulangab qoldirmang: sim va lampa qiziydi","Qisqa tutashuv bo'lsa darhol zanjirni oching"]},"act":{"type":"lab","name":"elektr","mode":"qiyos"},"kitob":{"bobNomi":"Elektr zanjirlar","bet":109,"oralig":"109–119","kod":"9.2","amaliyIsh":{"kod":"9.2","nomi":"Chiroqni yoqing","bet":98},"boshqotirma":102,"bilimlarXaritasi":103,"takrorlash":104,"mustahkamlash":107},"urinish":{"savollar":["Qaysi elektr zanjirdagi chiroqlar yorqinroq yonadi?"],"qism_mavzular":["Elementlari ketma-ket ulangan elektr zanjir","Elementlari parallel ulangan elektr zanjir"],"konikmalar":["tadqiqot uchun kerakli jihozlarni tanlash va ulardan to‘g‘ri foydalanish;","amaliy ishni bajarish davomida xavfsizlik qoidalariga rioya qilish;","ilmiy tushunchani anglashda modelning ahamiyatini bayon etish;","ilmiy tushunchani tasvirlash va izohlashda modeldan foydalanish;","egallangan bilimlarni qo‘llab tadqiqot natijalarini bashorat qilish;","tadqiqot natijalariga asoslanib bashoratning aniqligini bayon etish;","tadqiqot natijalaridagi qonuniyatni bayon etish hamda kutilmagan natijalarni aniqlash."],"tatbiq":["bahs-munozarada o‘z nuqtayi nazarini ilmiy dalillardan foydalanib asoslash;","fan va texnologiya yutuqlaridan foydalanishning atrof-muhitga ijobiy ta’sirini muhokama qilish."]}},{"d":10,"c":1,"kod":"10.1","t":"Tog‘ jinslarining turlari","chorak":4,"lab":"jins","labMode":"turlar","labTitle":"","theory":"Tog' jinslari — Yer po'stini tashkil qiluvchi tabiiy agregatlar. Ular hosil bo'lishiga qarab uch guruhga bo'linadi: magmatik, o'tqazuvchi (cho'kindi) va metamorfik.\n\nMagmatik jinslar — erigan magma soviganda hosil bo'ladi. Sekin sovigan (yer ostida) kristallari yirik bo'ladi: granite. Tez soviganida (lava oqimida) kristallari mayda yoki shishasimon bo'ladi: bazalt, pemza.\n\nCho'kindi (o'tqazuvchi) jinslar — egilgan jinslar va mineral zarralari, organik qoldiqlar suv yoki shamol tubiga cho'kishidan qatlamlab hosil bo'ladi. Qumtosh, gil, ohak toshi, mergel shunga misol. Ular ko'pincha qatlamlarga bo'linadi va ichida qoldiqlar saqlanadi.\n\nMetamorfik jinslar — mavjud jinslar yuqori harorat va bosim ostida o'zgarishidan paydo bo'ladi. Metamorfik jinslarga marmar, kvartsit, slanets va gneys kiradi. Marmar — ohak toshining, slanets — gilning «o'zgargan» holati.\n\nJinslarni ajratishda tuzilishga (dona, qatlam, kristall), qattiqlik (Mohs shkalasi), zichlik va kislota bilan reaksiyaga (ohak toshida ko'pik chiqadi) qarashadi.","formulas":["3 guruh: magmatik · cho'kindi · metamorfik","Magmatik: magma soviydi (sekin → yirik kristall)","Cho'kindi: zarralar qatlamlab cho'kti","Metamorfik: harorat + bosim → qayta kristallanish","Ohak toshi + sirka → CO₂ (ko'pik)","Mohs shkalasi: 1 talk … 10 olmos"],"vocab":[{"w":"Magma","m":"yer ostidagi erigan silikat massasi"},{"w":"Lava","m":"yer yuzasiga chiqqan magma"},{"w":"Cho'kindi jins","m":"zarralar yoki qoldiqlar qatlamlanib yig'ilishidan hosil bo'lgan jins"},{"w":"Metamorfizm","m":"jinsning harorat va bosim ta'sirida qayta o'zgarishi"},{"w":"Mineral","m":"tabiiy bir jinsli kimyoviy modda (kvarc, dala shpati, kalsit)"},{"w":"Qattiqlik","m":"jinsning tirnalishga qarshiligi"}],"quiz":[["Granit qaysi guruhga kiradi?",["Cho'kindi","Magmatik","Organik","Metamorfik"],1,"Magma sekin soviganda yirik kristalli granite hosil bo'ladi."],["Pemza suvda suzadi, chunki...",["Suv uni tortadi","Ichida gaz pufakchalari ko'p, umumiy zichlik kichik","U magmatik emas","Yengil materialdan"],1,"Tez sovigan lavada gaz qolgan — shu «g'ovak» tuzilish."],["Marmar qanday hosil bo'ladi?",["Ohak toshi harorat va bosim ta'sirida o'zgaradi","Gil quriydi","Qum cho'kadi","Magma soviydi"],0,"Bu metamorfik qayta kristallanish."],["Jinsda qatlamlilik va qoldiqlar bor — qaysi guruh?",["Tuproq","Metamorfik","Cho'kindi","Magmatik"],2,"Qatlam va qoldiqlar — cho'kindi jinslarning belgisi."],["Ohak toshini aniqlashning oddiy usuli — nima?",["Magnit bilan tortish","Og'irligini solishtirish","Suvda eritish","Sirka tomchilatib, ko'pik chiqishini kuzatish"],3,"Kaltsiy karbonat kislota bilan CO₂ chiqaradi."]],"slideQuiz":[["Nega granite kristallari yirik, bazaltta esa mayda?",["Granit yengil","Bazalt suv bilan aralashgan","Kristallar o'sib ulgurmaydi — chunki kislorod kam","Granit sekin, bazalt tez soviydi"],3,"Sovish tezligi kristall o'lchamini belgilaydi."],["Gil → slanets. Bu qanday o'zgarish?",["Metamorfik","Cho'kish","Eritish","O'chirish"],0,"Bosim va harorat ostida qayta kristallanish."]],"game":[["Jinsni guruhi bilan moslashting: qumtosh",["Sun'iy","Cho'kindi","Magmatik","Metamorfik"],1,"Qum donalari sementlanib qatlam hosil qilgan."],["Qaysi xossa jinslarni ajratishda yordam bermaydi?",["Qattiqligi","Harorati (xona sharoitida)","Tuzilishi","Rangi"],1,"Barcha namunalar xona haroratida — bu farqlovchi belgi emas."],["Metamorfik jinsga misol — qaysi?",["Kvartsit","Tuz","Qum","Bazalt"],0,"Kvartsit — qumtoshning metamorfik holati."]],"gameQuiz":[["Jinsni guruhi bilan moslashting: qumtosh",["Sun'iy","Cho'kindi","Magmatik","Metamorfik"],1,"Qum donalari sementlanib qatlam hosil qilgan."],["Qaysi xossa jinslarni ajratishda yordam bermaydi?",["Qattiqligi","Harorati (xona sharoitida)","Tuzilishi","Rangi"],1,"Barcha namunalar xona haroratida — bu farqlovchi belgi emas."],["Metamorfik jinsga misol — qaysi?",["Kvartsit","Tuz","Qum","Bazalt"],0,"Kvartsit — qumtoshning metamorfik holati."]],"task":{"q":"«Tog' jinslari kolleksiyasi» — 6 namunani (granite, bazalt, pemza, qumtosh, gil, marmar/ohak toshi) tuzilishi, rangi, qattiqligi va sirka bilan sinovi bo'yicha taqqoslang. 3×6 taqqoslash jadvali tuzing va har namunani guruhi bilan asoslang.","a":"Granite — yirik kristalli, magmatik; bazalt — maydonali, magmatik; pemza — g'ovak, magmatik; qumtosh — donali, cho'kindi; gil — plastik, cho'kindi; marmar — kristalli, metamorfik (ohak toshi esa sirkada ko'pik chiqaradi).","why":"Taqqoslash jadvali belgilarni ajratadi va xulosani subyektiv fikrdan ob'ektiv mezonlarga asoslaydi — geologik tasnifning haqiqiy usuli.","steps":["Har namuna uchun o'lcham va nom yozilgan katalog varag'i tayyorlang","Kuzatuvlarni yozing: rang, dona o'lchami, qatlam, g'ovak","Qattiqlik sinovi: tirnoq, mis tanga, stilo bilan tirnang","Sirka sinovi (har tomchidan keyin yuving)","Guruhini aniqlab, asosini bir jumlada yozing"],"jihoz":["6 ta jins namunasi","Kichik qo'rg'oshin","Osh sodasi yoki sirka (tomchilatish uchun)","Lupa, oq qog'oz (chiziq rangi uchun)","Katalog varag'i"],"xavfsizlik":["Namunalarni qo'lqop bilan ushlang, changini yutmang","Sirka bilan ishlashda ko'zni himoya qiling","Sinovdan keyin qo'llarni yuving; namunani og'izga olmang"]},"act":{"type":"lab","name":"jins","mode":"turlar"},"kitob":{"bobNomi":"Tog‘ jinslari","bet":120,"oralig":"120–131","kod":"10.1","amaliyIsh":{"kod":"10.1","nomi":"Tog‘ jinslarining turlarini aniqlash","bet":110},"boshqotirma":114,"bilimlarXaritasi":115,"takrorlash":116,"mustahkamlash":118},"urinish":{"savollar":[],"qism_mavzular":["Magmatik tog‘ jinslari","Cho‘kindi tog‘ jinslari","Metamorfik tog‘ jinslari"],"konikmalar":["jismlarni kuzatish natijalariga asoslanib tasniflash;","kuzatish natijalarini taqdim etish uchun jadval tuzish;","aniqlashtirish va tasniflash metodidan qanday foydalanishni anglash;","o‘rganilayotgan obyektlarda kuzatiladigan farqlarga asoslanib kalit-aniqlagich tuzish;","ilmiy hodisani tasvirlash va izohlashda modeldan foydalanish;","tadqiqot natijalariga asoslanib ilmiy xulosa chiqarish."],"tatbiq":["tabiiy fanlarning muayyan sohasida faoliyat yurituvchi kasb egalarini aniqlash va ularning faoliyatini tavsiflash;","ilmiy bilimlar vaqt o‘tishi bilan o‘zgarishini ko‘rsatish uchun to‘plangan dalillardan foydalanish;","fan va texnologiya yutuqlaridan foydalanishning atrof-muhitga salbiy ta’sirini muhokama qilish;","bahs-munozarada o‘z nuqtayi nazarini ilmiy dalillardan foydalanib asoslash."]}},{"d":10,"c":2,"kod":"10.2","t":"Tog‘ jinslarining o‘zgarishi","chorak":4,"lab":"jins","labMode":"qoldiq","labTitle":"Buzilish va toshqotgan qoldiqlar modeli","theory":"Jinslarning buzilishi va o'zgarishi — atmosfera, suv, harorat va tirik organizmlar ta'sirida kechadigan jarayon. Uning ikki turi: fizik maydalash va kimyoviy o'zgarish.\n\nFizik maydalash — jins parchalanadi, lekin tarkibi o'zgarmaydi. Eng yaqqol misol: suv jins yoriqlariga kirib, muzlab kengayadi va toshni yoradi (muz orqali maydalash). Haroratning kundalik kechinmasi ham shu tarzda ishlaydi: tashqi qatlam qiziydi-soviydi va ajraladi.\n\nKimyoviy o'zgarishda suv va erigan gazlar (ayniqsa CO₂ bilan karbonat angidridli kislota) jins mineralarini eritadi, oksidlaydi (temir zanglashi) yoki gidratlaydi — yangi moddalar hosil bo'ladi.\n\nBiotik ta'sir: o'simlik ildizlari yoriqlarni kengaytiradi; tuproqda yashovchi qurtlar va hasharot lichinkalari toshni yemaydi, ammo qatlamni yumshatadi; organik kislotalar mineralarni parchalaydi.\n\nBuzilish mahsuloti — qum, gil, shag'al va tuproq. Shu sabab jinslarning o'zgarishi tuproq hosil bo'lishining birinchi bosqichi: maydalangan material keyinchalik tirik organizmlar bilan birga tuproqqa aylanadi.\n\nBuzilish sekin kechadi: 1 mm qatlam hosil bo'lishi uchun yuzlab yillar kerak bo'lishi mumkin. Shu sabab buzilgan relyef (kanon, qoya) tarixni o'qish uchun ochiq «sahifa».\n\nToshqotgan qoldiqlar (fossiliyalar) — jinslar ichida saqlanib qolgan qadimgi organizm qoldiqlari yoki izlari: suyak, chig'anoq, barg, iz. Ular asosan cho'kindi jinslarda uchraydi, chunki qoldiq parchalanib ketmasligi uchun tez qoplanishi — loy yoki qum ostida qolishi kerak.\n\nQoldiq bir necha yo'l bilan saqlanadi: qattiq qism mineralga almashadi; bo'shliq qolip ko'rinishida qotadi; ba'zan faqat iz (yurish izi, tiriq) qoladi. Yumshoq to'qimalar deyarli saqlanmaydi, shu sabab qoldiq to'plami har doim to'liq emas.\n\nQoldiqlar — Yer tarixini o'qish dalili: pastdagi qatlam eskiroq, yuqordagisi yangiroq (jinslar buzilmagan bo'lsa); qaysi qatlamda qanday qoldiq borligi esa o'sha davr muhitini — dengiz, ko'l yoki quruqlik ekanini aytadi. Tog' cho'qqisidan dengiz chig'anog'i topilsa, bu yer bir paytlar suv ostida bo'lganiga dalil bo'ladi.","formulas":["Fizik maydalash → o'lcham kichrayadi, tarkibi o'zgarmaydi","Kimyoviy → yangi moddalar (erish, oksidlanish)","Muz + suv = yoriq kengayadi (muz sinishi)","CO₂ + suv → kislota → ohak toshi eriydi","Biotik: ildiz, organizmlar, organik kislotalar","Buzilish mahsuloti: qum, gil, shag'al → tuproq","Qoldiq: cho'kindi jinsda saqlanadi; pastki qatlam — eskiroq"],"vocab":[{"w":"Maydalash","m":"jinsning mayda bo'laklarga ajralishi"},{"w":"Fizik buzilish","m":"tarkibi o'zgarmagan parchalanish"},{"w":"Kimyoviy buzilish","m":"mineral tarkibi o'zgaradigan jarayon"},{"w":"Oksidlanish","m":"kislorod bilan reaksiya (masalan, zanglash)"},{"w":"Yoriq","m":"jinsdagi mayda bo'shliq, suv va havo kiradigan iz"},{"w":"Toshqotgan qoldiq (fossiliya)","m":"jinslarda saqlangan qadimgi organizm qoldig'i yoki izi"},{"w":"Qolip","m":"organizm o'rnida qotib qolgan bo'shliq yoki mineral quyma"}],"quiz":[["Muzning jinsni yorishida nima ishlaydi?",["Harorat ortadi","Shamol tortadi","Suv muzlaganda kengayadi","Suv qisqaradi"],2,"Muz hajmi ~9% katta — yoriqni bosim bilan yoradi."],["Kimyoviy buzilishga misol — qaysi?",["Shag'alning cho'kishi","Temirli mineralning zanglashi","Suvning bug'lanishi","Toshning sinishi"],1,"Oksidlanishda yangi modda hosil bo'ladi."],["Fizik maydalashda nima o'zgarmaydi?",["Ko'rinishi","Bo'lak o'lchami","Sirt yuzasi","Mineral tarkibi"],3,"Faqat o'lcham va shakl o'zgaradi."],["Toshqotgan qoldiqlar asosan qaysi jinslarda uchraydi?",["Magmatik jinslarda","Tuproqda uchramaydi","Cho'kindi jinslarda","Metamorfik jinslarda"],2,"Qoldiqning saqlanishi uchun tez qoplanish — cho'kish jarayoni kerak."],["Pastki qatlamda baliq, ustki qatlamda o't o'rniga tog' qoldig'i bo'lsa, nima deyiladi?",["Pastki qatlam eskiroq va u yerda bir payt suv bo'lgan","Ustki qatlam eskiroq","Qatlamlar yoshi aniqlanmaydi","Ikkalasi bir xil yoshda"],0,"Cho'kish tartibi va qoldiq turi — yosh va muhitni aniqlash mezoni."]],"slideQuiz":[["Qoyaning ichida qatlam qatlamlari ko'rinsa — bu nimani ko'rsatadi?",["Buzilish kimyoviy emas","Tosh sun'iy","Suv faqat kishida ishlaydi","Jarayon muddat davomida takrorlangan"],3,"Qatlamlar — vaqt va takrorlanish belgisi."],["Toshni qizdirib sovuq suvga solish tajribasi nimani ko'rsatadi?",["Tosh eriydi","Kimyoviy reaksiya boradi","Harorat keskin o'zgarishi fizik maydalashni tezlashtiradi","Suv bug'lanadi"],2,"Issiq kengayadi, sovuq qisqaradi — shu kuch bilan po'stloq ajraladi."],["Bir tog' cho'qqisidan dengiz chig'anog'i qoldig'i topildi. Bu nimani anglatadi?",["Tosh sun'iy qo'yilgan","Bu yer bir paytlar dengiz tubi bo'lgan","Tuproq ko'chirilgan","Chig'anog'ni qush olib chiqqan"],1,"Qoldiq qaysi jinsda topilgani qadimgi muhitni ko'rsatadi."]],"game":[["Jarayonni turi bilan moslashting: suv toshni eritib, yangi modda hosil qilishi",["Fizik maydalash","Yonish","Cho'kish","Kimyoviy buzilish"],3,"Yangi modda — kimyoviy jarayon."],["Qaysi iqlimda muz maydalashi kuchli?",["Doimiy issiqda","Quruq cho'lda","Tunayu kunduz muzlash-bo'zadigan tog'li iqlimda","Doimiy muzda"],2,"Takroriy muzlash-bo'zish — eng faol mexanik kuch."],["Katta tosh → mayda shag'al. Bu yerda o'zgargan narsa — ...",["Zichlik","Sirt yuzasi ortadi","Rang ham, tarkib ham","Mineral tarkibi"],1,"Maydalash sirt yuzasini oshiradi — kimyoviy ta'sir kuchayadi."],["Qoldiqning saqlanish yo'lini tanlang: suyak mineralga aylangan",["Almashinuv qoldig'i","Chirindi","Iz qoldig'i","Qolip"],0,"Qattiq qism asta-sekin mineralga almashadi."]],"gameQuiz":[["Jarayonni turi bilan moslashting: suv toshni eritib, yangi modda hosil qilishi",["Fizik maydalash","Yonish","Cho'kish","Kimyoviy buzilish"],3,"Yangi modda — kimyoviy jarayon."],["Qaysi iqlimda muz maydalashi kuchli?",["Doimiy issiqda","Quruq cho'lda","Tunayu kunduz muzlash-bo'zadigan tog'li iqlimda","Doimiy muzda"],2,"Takroriy muzlash-bo'zish — eng faol mexanik kuch."],["Katta tosh → mayda shag'al. Bu yerda o'zgargan narsa — ...",["Zichlik","Sirt yuzasi ortadi","Rang ham, tarkib ham","Mineral tarkibi"],1,"Maydalash sirt yuzasini oshiradi — kimyoviy ta'sir kuchayadi."],["Qoldiqning saqlanish yo'lini tanlang: suyak mineralga aylangan",["Almashinuv qoldig'i","Chirindi","Iz qoldig'i","Qolip"],0,"Qattiq qism asta-sekin mineralga almashadi."]],"task":{"q":"Asosiy amaliy ish: 3 ta bir xil shag'al yoki g'ishtni 3 holatda saqlang — (1) quruq idish, (2) suvda (24 soat), (3) qizdirib sovuq suvga solish (5 marta, ustoz nazoratida). Har holatdan tushgan maydalarni yig'ib solishtiring. Qo'shimcha amaliy ish (10.3): gil va gips bilan toshqotgan qoldiq modeli — bargni bosib qolip oling.","a":"Eng ko'p mayda (uchunt, chang) harorat keskin o'zgargan va suvda bo'lgan holatda; quruq namunada o'zgarish deyarli yo'q. Modelda esa barg chirigach qatlamda uning qolipi (bo'shliq) qoladi — pastdagi qatlam eskiroq, yuqordagisi yangi.","why":"Uch holatni bir xil sharoitda solishtirish qaysi omil buzilishni tezlashtirishini aniq ko'rsatadi; qolip modeli esa paleontologlar qanday ishlaydigi — hodisani takrorlab bo'lmaydigan vaqtda modellashtirish usulini o'rgatadi.","steps":["Uch idishga bir xil o'lchamli toshlarni soling va massasini yozing","Har 24 soatda idishni silkiting, tushgan maydalarni qog'ozga to'plang","Uchinchi holatda qizdirib-sovutish siklini takrorlang (faqat ustoz bilan)","Maydalarni quruq qog'ozda solishtiring: o'lchami va miqdori","Qo'shimcha ish: gil qatlamiga barg bosib, ustiga gips quying, quritib qolipni oling va qatlam tartibini asoslang"],"jihoz":["3 shaffof plastik idish qopqog'i bilan","3 ta bir xil o'lchamli shag'al yoki g'isht bo'laklari","Suv, iliq suvli idish yoki qizdirgich (ustoz nazoratida)","Qog'oz sochiq, lupa, tarozi (0,1 g)","Qo'shimcha: gil, gips, 2 barg"],"xavfsizlik":["Qizdirilgan toshni faqat qisqich bilan oling","Sovuq suvga solganda mayda bo'laklar sachrashi mumkin — himoya ko'zoynagi","Ishni taglikda, ochiq joyda yoki deraza oldida bajaring; gips qotganda qo'llarni sovunlab yuving"]},"act":{"type":"lab","name":"jins","mode":"qoldiq"},"kitob":{"bobNomi":"Tog‘ jinslari","bet":120,"oralig":"120–131","kod":"10.2","amaliyIsh":{"kod":"10.2","nomi":"Tog‘ jinslarining o‘zgarishi","bet":111},"boshqotirma":114,"bilimlarXaritasi":115,"takrorlash":116,"mustahkamlash":118},"urinish":{"savollar":[],"qism_mavzular":["Tog‘ jinslarining o‘zgarishi","Toshqotgan qoldiqlar"],"konikmalar":["jismlarni kuzatish natijalariga asoslanib tasniflash;","kuzatish natijalarini taqdim etish uchun jadval tuzish;","aniqlashtirish va tasniflash metodidan qanday foydalanishni anglash;","o‘rganilayotgan obyektlarda kuzatiladigan farqlarga asoslanib kalit-aniqlagich tuzish;","ilmiy hodisani tasvirlash va izohlashda modeldan foydalanish;","tadqiqot natijalariga asoslanib ilmiy xulosa chiqarish."],"tatbiq":["tabiiy fanlarning muayyan sohasida faoliyat yurituvchi kasb egalarini aniqlash va ularning faoliyatini tavsiflash;","ilmiy bilimlar vaqt o‘tishi bilan o‘zgarishini ko‘rsatish uchun to‘plangan dalillardan foydalanish;","fan va texnologiya yutuqlaridan foydalanishning atrof-muhitga salbiy ta’sirini muhokama qilish;","bahs-munozarada o‘z nuqtayi nazarini ilmiy dalillardan foydalanib asoslash."]}},{"d":11,"c":1,"kod":"11.1","t":"Tuproq turlari","chorak":4,"lab":"tuproq","labMode":"turlar","labTitle":"","theory":"Tuproq — Yer po'stining hayot beruvchi yumshoq qatlami. U jinslarning maydalangan materialidan, chirindidan (gumus), suv, havo va tirik organizmlardan tashkil topadi.\n\nChirindi (gumus) — o'simlik va hayvonlar qoldiqlarining mikroorganizmlar ta'sirida parchalanib hosil qiladigan qora, unumdor modda. Tuproqning asosiy xossasi — unumdorlik — aynan gumusga bog'liq.\n\nTuproq kesimi (profil) — qatlamlar tizimi: yuqoridagi chirindili g'o'ra qatlam, unda mineral qatlam, pastda ona jins. Har bir qatlam rangi, zichligi va tarkibi bilan farq qiladi.\n\nAsosiy tuproq turlari: qora tuproq (cho'r, eng unumdor, ko'p gumusli), jimp (o'rmonli, kamroq gumusli, kislotali), qumli tuproq (suv va moddalarni tez o'tkazadi, unumdorligi past), shor (tuzli) tuproq — sug'orishdan tuz ko'tarilib zararkunanda bo'ladi, va allyuvial (daryo bo'yi) tuproq — daryo olib kelgan cho'kindilardan hosil bo'lib unumdor bo'ladi.\n\nTuproq — qayta tiklanadigan, ammo juda sekin tiklanadigan resurs: 1 sm unumdor qatlam uchun o'rtacha 100–400 yil kerak.","formulas":["Tuproq = mineral qism + gumus + suv + havo + organizmlar","Gumus = parchalangan organik qoldiqlar","Unumdorlik ↑ gumus ↑","Profil: g'o'ra qatlam → mineral qatlam → ona jins","Qora tuproq > jimp > qumli (unumdorlik bo'yicha)","1 sm tuproq ≈ 100–400 yil"],"vocab":[{"w":"Tuproq","m":"Yer po'stining unumdorlikka ega yumshoq qatlami"},{"w":"Gumus (chirindi)","m":"organik qoldiqlardan hosil bo'lgan qora, unumdor modda"},{"w":"Unumdorlik","m":"tuproqning hosil yetishtirish qobiliyati"},{"w":"Tuproq profili","m":"yuqoridan ona jinsgacha bo'lgan qatlamlar tizimi"},{"w":"Ona jins","m":"tuproq hosil bo'lgan asosiy tog' jinsi"},{"w":"Shorlanish","m":"tuproqda tuz to'planib qolishi"}],"quiz":[["Tuproqning eng muhim xossasi — qaysi?",["Unumdorlik","Rangi","Harorati","Hajmi"],0,"Unumdorlik — tuproqni tuproq qiluvchi xossa."],["Gumus nima?",["Qum donasi","Mineral tuz","Organik qoldiqlardan hosil bo'lgan unumdor qora modda","Suv qatlami"],2,"Gumus tarkibida azot, fosfor, kaliy va uglerod bor."],["Qaysi tuproq eng unumdor?",["Qumli tuproq","Toshli yer","Qora tuproq","Shor tuproq"],2,"Qora tuproqda gumus miqdori eng yuqori."],["Shorlanish qachon kuchayadi?",["Qor yog'ganda","Ko'p sug'orib, suvi bug'langanda tuz yuqoriga ko'tarilsa","Shamol kuchayganda","Yomg'ir yog'ganda"],1,"Bug'lanish tuzni sirtda qoldiradi."],["Nega tuproq «sekin tiklanadigan» resurs deyiladi?",["Faqat issiqxona","1 sm uchun 100–400 yil kerak","1 oyda tiklanadi","Hech qachon tiklanmaydi"],1,"Eroziya bilan yo'qolgan qatlam inson umrida tiklanmaydi."]],"slideQuiz":[["Daryo bo'yidagi yerlar unumdor bo'ladi — nega?",["Quyosh kuchli","Suv mayda cho'kindilarni olib kelib qo'yadi","Yomg'ir ko'p","Shamol kam"],1,"Allyuvial tuproq — suv keltirgan materialdan hosil bo'ladi."],["Jimp tuproqda qanday kamchilik bor?",["Gumus kam va kislotali","Suv umuman o'tmaydi","Havo yo'q","Juda ko'p tuz"],0,"O'rmon tuprog'i yuvilgan, kislotali va yupqa bo'ladi."]],"game":[["Tuproq komponentini roli bilan moslashting: gumus",["Havoni yo'q qiladi","Suv o'tkazadi","Unumdorlikni beradi","Zichlikni oshiradi"],2,"Oziqa moddalari va tuproq tuzilishi shu bilan yaxshilanadi."],["Qaysi tuproq suvni tez o'tkazadi va qurg'oqchil?",["Bataqlik","Loyli","Qora","Qumli"],3,"Katta donalar orasidan suv tez oqib ketadi."],["Tuproq profilida eng pastda nima joylashadi?",["Ona jins","O'simlik qoldig'i","Suv ko'li","Chirindi qatlami"],0,"Yuqoridan pastga: chirindi → mineral → ona jins."]],"gameQuiz":[["Tuproq komponentini roli bilan moslashting: gumus",["Havoni yo'q qiladi","Suv o'tkazadi","Unumdorlikni beradi","Zichlikni oshiradi"],2,"Oziqa moddalari va tuproq tuzilishi shu bilan yaxshilanadi."],["Qaysi tuproq suvni tez o'tkazadi va qurg'oqchil?",["Bataqlik","Loyli","Qora","Qumli"],3,"Katta donalar orasidan suv tez oqib ketadi."],["Tuproq profilida eng pastda nima joylashadi?",["Ona jins","O'simlik qoldig'i","Suv ko'li","Chirindi qatlami"],0,"Yuqoridan pastga: chirindi → mineral → ona jins."]],"task":{"q":"Maktab bog'i va dala chekkasidan olgan 2 tuproq namunangizni solishtiring: rang, hido, zarrachalar tarkibi, suv o'tkazish va pH (lakmus qog'ozi) bo'yicha. Turi va unumdorligini baholang.","a":"Bog' tuprog'i qoraroq, yumshoq va hido ko'p (gumus), dala chekkasi ochroq va mayda toshli. Suv bog' tuprog'idan sekinroq, ammo tengroq o'tadi; kislotalilik deyarli bir xil.","why":"Namuna olish joyi tuproq tarkibini belgilaydi — shu sabab solishtirish tuproqdan foydalanish (sug'orish, urug'lantirish) bo'yicha qarorga asos bo'ladi.","steps":["Har joydan 2 stakan tuproq oling (yuza 5 cm chuqurlikdan)","Rang va hidni yozing; qo'lda uvalab tuzilishini tekshiring","Har stakanga 100 ml suv quying — o'tish vaqtini belgilang","Lakmus qog'ozini 30 soniya bosib turing, rangni shkalaga solishtiring","Xulosa: qaysi tuproq unumdor? Sababi nima?"],"jihoz":["2 shaffof stakan/pet-shisha","100 ml suv uchun o'lchagich (silindr)","Lakmus qog'ozi yoki universal indikator","Qo'lqop va bog' ketmoni","Lupa"],"xavfsizlik":["Tuproqni qo'lqop bilan oling, shisha/temir bo'laklarini tekshiring","Tajribadan keyin qo'llarni sovunlab yuving","Indikator qog'ozini og'izga olmang"]},"act":{"type":"lab","name":"tuproq","mode":"turlar"},"kitob":{"bobNomi":"Tuproq","bet":132,"oralig":"132–142","kod":"11.1","amaliyIsh":{"kod":"11.1","nomi":"Qaysi tuproq o‘zida ko‘proq namlikni saqlab tura oladi?","bet":120},"boshqotirma":124,"bilimlarXaritasi":125,"takrorlash":126,"mustahkamlash":128},"urinish":{"savollar":["Tuproqning qanday turlari bor?"],"qism_mavzular":[],"konikmalar":["amaliy ishni bajarish davomida xavfsizlik qoidalariga rioya qilish;","kuzatish natijalarini taqdim etish uchun jadval tuzish;","kuzatish natijalarini rasm orqali ifodalash;","jismlarni kuzatish natijalariga asoslanib tasniflash;","o‘lchash ishlarini to‘g‘ri va aniq bajarish;","o‘rganilayotgan obyektlarda kuzatiladigan farqlarga asoslanib kalit-aniqlagich tuzish;","amaliy ishni bajarish davomida yuzaga kelishi mumkin bo‘lgan xavflarni hamda ularni kamaytirish yo‘llarini bayon etish;","ilmiy hodisani tasvirlash va izohlashda modeldan foydalanish;","tadqiqot uchun kerakli jihozlarni tanlash va ulardan to‘g‘ri foydalanish;","ilmiy hodisani tushunishda modelning ahamiyatini bayon etish;","turli tadqiqot metodlarining o‘ziga xos xususiyatlarini anglash;","tadqiqot natijalariga asoslanib ilmiy xulosa chiqarish;","tadqiqotni yaxshilash yuzasidan taklif berish va uni izohlash."],"tatbiq":["tabiiy fanlarning muayyan sohasida faoliyat yurituvchi kasb egalarini aniqlash va ularning faoliyatini tavsiflash;","tabiiy fanlar yutuqlaridan kundalik hayotda foydalanilishini bayon etish."]}},{"d":11,"c":2,"kod":"11.2","t":"Tuproq tarkibi va o‘simliklarning o‘sishi","chorak":4,"lab":"tuproq","labMode":"singdirish","labTitle":"","theory":"Tuproqning suv singdirishi (suzish) — tuproq suvni o'ziga olish va ichidan o'tkazish qobiliyati. U donalar o'lchami, tuzilish va organik moddalar miqdoriga bog'liq.\n\nQumli tuproq — katta donalar, katta bo'shliq: suv tez o'tadi, lekin uzoq saqlanmaydi. Loyli (gil) tuproq — mayda donalar, suv sekin singadi, ustida ko'lmak qoladi va qotib yoriladi. Qora tuproq — agregatli tuzilish va gumus tufayli suvni ham yaxshi oladi, ham saqlaydi.\n\nTuproq erosiyasi — unumdor qatlamning suv yoki shamol olib ketishi. Sabablari: yalang'och qolgan yer, o'rmonsiz yon bag'ir, suvni ko'p oqizib sug'orish, yer qatlamini buzuvchi noto'g'ri haydash.\n\nHimoya choralari: o't va daraxt ekish (ildiz tuproqni ushlaydi), gorizontal (gorizontal) haydash va yon bag'irda zinapoyali yerlar, sharbon (daryo bo'yida) sug'orish, yopib o'tirish (mulcha), yon bag'irga ekin qatorini ko'ndalang ekish.\n\nAmaliy ahamiyati: sug'orish me'yori tuproq turiga qarab belgilanadi. Qumli tuproqni kam-kam, lekin tez-tez; loyli tuproqda esa ko'p suv kerak emas — u singmay, oqib ketadi.","formulas":["Singdirish = suvning tuproqqa kirish tezligi (ml/min)","Qumli: o'tkazish ↑, saqlash ↓","Loyli: o'tkazish ↓, saqlash ↑, yorilish xavfi","Qora tuproq: o'tkazish va saqlash muvozanati yaxshi","Eroziya = suv/shamol olib ketishi","Himoya: ildiz + gorizontal haydash + yopish (mulcha)"],"vocab":[{"w":"Singdirish (infiltratsiya)","m":"suvning tuproqqa kirish qobiliyati"},{"w":"Suzuvchanlik","m":"suvning tuproq bo'ylab pastga harakatlanishi"},{"w":"Agregat","m":"tuproq donalarining birikkan bo'lagi"},{"w":"Eroziya","m":"tuproqning suv yoki shamol bilan olib ketilishi"},{"w":"Mulcha","m":"tuproq yuzasini yopuvchi qoplama (pichan, po'lop, qog'oz)"},{"w":"Yon bag'ir","m":"qiyalikdagi yer; suv tez oqib, tuproqni yuvadi"}],"quiz":[["Suv eng tez qaysi tuproqdan o'tadi?",["Loyli","Qumli","Muzlagan","Qora"],1,"Yirik donalar orasida katta bo'shliq bor."],["Loyli tuproqning kamchiligi — nima?",["Havo yo'q","Tuz ko'p","Suv umuman o'tmaydi","Suv sekin singadi, qatlam qotib yoriladi"],3,"Mayda donalar suvni ushlab, sirtni qotiradi."],["Yon bag'irda tuproqni himoya qilishning eng samarali usuli — qaysi?",["Ko'proq sug'orish","Yerni qotirish","Bir yo'nalishda uzun haydash","O't va daraxt ekish, gorizontal haydash"],3,"Ildiz mustahkamlaydi, gorizontal iz esa suvning oqib ketishini to'sadi."],["Mulchaning vazifasi nima?",["O'g'it vazifasi bajaradi","Zararkunandalarni ko'paytiradi","Suvning bug'lanishini kamaytiradi, yuzani himoya qiladi","Haroratni oshiradi"],2,"Yopqich namlikni saqlaydi va yomg'ir urib tuproqni uchirishini kamaytiradi."],["Qaysi amaliyot tuproq erosiyasini kuchaytiradi?",["Gorizontal haydash","Yalang'och yerda suvni tez oqizish","Daraxt ekish","Yopib turish"],1,"Tez oqim yuza qatlamni yuvib olib chiqadi."]],"slideQuiz":[["Tajribada 100 ml suv qumli tuproqqa 20 sekundda, loyliga 90 sekundda kirdi. Xulosa?",["Suv qizigan","Ikkalasi bir xil","Qumli suvni tez singdiradi, ammo saqlamaydi","Loyli yaxshiroq"],2,"Tezlik va saqlash — ikki xil ko'rsatkich."],["Nega sug'orish me'yori tuproq turiga qarab belgilanadi?",["Qonun shuni talab qiladi","Urug' turi uchun","Suv narxi","Tuproqning singdirish va saqlash qobiliyati har xil"],3,"Noto'g'ri sug'orish suvni ham, tuproqni ham isrof qiladi."]],"game":[["Tuproq turini xossasi bilan moslashting: loyli tuproq",["Umuman suv olmaydi","Suvni sekin singdiradi, qotadi","Faqat qumdan iborat","Suvni tez o'tkazadi"],1,"Mayda donalar — suv kirish qiyin."],["Himoya chorasini maqsadi bilan bog'lang: gorizontal haydash",["Zichlikni oshiradi","Gumusni kamaytiradi","Haroratni oshiradi","Suvning oqib ketishini to'sadi"],3,"Qiyalik bo'ylab iz suv uchun «to'siq» bo'ladi."],["Eroziya eng kuchli qachon boshlanadi?",["Yuz yalang'och va o'simlik yo'q bo'lganda","Daraxtlar bo'lganda","Yopib o'tirilganda","Qor yog'ganda"],0,"O'simlik tuproqni ushlaydi — undan ayrilsa, yuvilish boshlanadi."]],"gameQuiz":[["Tuproq turini xossasi bilan moslashting: loyli tuproq",["Umuman suv olmaydi","Suvni sekin singdiradi, qotadi","Faqat qumdan iborat","Suvni tez o'tkazadi"],1,"Mayda donalar — suv kirish qiyin."],["Himoya chorasini maqsadi bilan bog'lang: gorizontal haydash",["Zichlikni oshiradi","Gumusni kamaytiradi","Haroratni oshiradi","Suvning oqib ketishini to'sadi"],3,"Qiyalik bo'ylab iz suv uchun «to'siq» bo'ladi."],["Eroziya eng kuchli qachon boshlanadi?",["Yuz yalang'och va o'simlik yo'q bo'lganda","Daraxtlar bo'lganda","Yopib o'tirilganda","Qor yog'ganda"],0,"O'simlik tuproqni ushlaydi — undan ayrilsa, yuvilish boshlanadi."]],"task":{"q":"«Tuproq suv singdirish tajribasi» — 3 ta plastik shishaning tubini kesib, tagiga gazmol soling va bir xil massadagi qumli, loyli va bog' tuprog'ini soling. Har biriga 100 ml suv quying: o'tgan vaqt va hajmni o'lchang. Himoya bo'yicha taklif yozing.","a":"Suv eng tez qumli tuproqdan o'tadi (o'lchangan hajm katta, vaqt kichik), loyli tuproqda sekin va oz o'tadi; bog' tuprog'i ikkisining o'rtasida. Shu asosda sug'orish rejasi tuziladi.","why":"Tuproq turlarining suv o'tkazishini bir xil sharoitda solishtirish — qishloq xo'jaligidagi sug'orish qarorining ilmiy asosi.","steps":["Uch shishani kesib, tagiga bir xil qalinlikda gazmol yoki paxta soling","Har biriga 150 g tuproq soling va sirtini tekislang","Shishani stakan ustiga qo'ying, 100 ml suvni bir maromda quying","Sekundomer bilan vaqt va stakanga tushgan hajmni yozing","Diagramma chizing va qaysi tuproqqa qancha suv kerakligini asoslang"],"jihoz":["3 plastik shisha (1,5 l)","Gazmol yoki paxta","Qumli, loyli, bog' tuprog'i (150 g dan)","100 ml o'lchagich/siringa","Sekundomer, stakanlar, tarozi"],"xavfsizlik":["Plastikni kesganda pichoq ehtiyotkorlik bilan — chetlari o'tkir","Suvni stolga to'kmang; tizzadan pastda ishlash qulay","Tuproq bilan ishlagan qo'llarni yuving"]},"act":{"type":"lab","name":"tuproq","mode":"singdirish"},"kitob":{"bobNomi":"Tuproq","bet":132,"oralig":"132–142","kod":"11.2","amaliyIsh":{"kod":"11.2","nomi":"O‘simlik yaxshi o‘sishi uchun qanday tuproq zarur?","bet":122},"boshqotirma":124,"bilimlarXaritasi":125,"takrorlash":126,"mustahkamlash":128},"urinish":{"savollar":["Tuproq tarkibi o‘simlik o‘sishiga qanday ta’sir qiladi?"],"qism_mavzular":[],"konikmalar":["amaliy ishni bajarish davomida xavfsizlik qoidalariga rioya qilish;","kuzatish natijalarini taqdim etish uchun jadval tuzish;","kuzatish natijalarini rasm orqali ifodalash;","jismlarni kuzatish natijalariga asoslanib tasniflash;","o‘lchash ishlarini to‘g‘ri va aniq bajarish;","o‘rganilayotgan obyektlarda kuzatiladigan farqlarga asoslanib kalit-aniqlagich tuzish;","amaliy ishni bajarish davomida yuzaga kelishi mumkin bo‘lgan xavflarni hamda ularni kamaytirish yo‘llarini bayon etish;","ilmiy hodisani tasvirlash va izohlashda modeldan foydalanish;","tadqiqot uchun kerakli jihozlarni tanlash va ulardan to‘g‘ri foydalanish;","ilmiy hodisani tushunishda modelning ahamiyatini bayon etish;","turli tadqiqot metodlarining o‘ziga xos xususiyatlarini anglash;","tadqiqot natijalariga asoslanib ilmiy xulosa chiqarish;","tadqiqotni yaxshilash yuzasidan taklif berish va uni izohlash."],"tatbiq":["tabiiy fanlarning muayyan sohasida faoliyat yurituvchi kasb egalarini aniqlash va ularning faoliyatini tavsiflash;","tabiiy fanlar yutuqlaridan kundalik hayotda foydalanilishini bayon etish."]}},{"d":12,"c":1,"kod":"12.1","t":"Quyosh sistemasi","chorak":4,"lab":"astronomiya","labMode":"sistema","labTitle":"","theory":"Quyosh sistemasi — Quyosh va unga tortishish kuchi bilan bog'langan jismlar: 8 ta sayyora, ularning yo'ldoshlari, mitti sayyoralar, asteroidlar, kometalar va meteoroidlar.\n\nQuyosh — sistemadagi yagona yulduz: o'z energiyasini yadroviy reaksiyalarda hosil qiladi va yorug'lik taratadi. Sayyora esa Quyosh atrofini aylanadi, o'z nuri yo'q — u faqat qaytaradi.\n\nIchki sayyoralar (Merkuriy, Venera, Yer, Mars) — kichik, zich, toshli. Tashqi sayyoralar (Yupiter, Saturn, Uran, Neptun) — ulkan, asosan gaz va muzdan iborat, halqali va ko'p yo'ldoshli.\n\nTartib: Merkuriy → Venera → Yer → Mars → asteroidlar kamari → Yupiter → Saturn → Uran → Neptun. «Qo'shni» deganda eng yaqin orbita tushuniladi.\n\nSistemada masofalar juda katta: Yerdan Quyoshgacha bo'lgan o'rtacha masofa 1 astronomik birlik (a.b.) = 150 mln km deb olingan. Yupiter ~5,2 a.b., Neptun ~30 a.b. uzoqlikda. Yorug'lik ham Quyoshdan Yerga 8 daqiqada yetib boradi — «bugungi Quyosh» bizga 8 daqiqa oldingi holatida ko'rinadi.","formulas":["1 a.b. = 150 mln km (Yer–Quyosh o'rtacha masofasi)","Ichki: Merkuriy, Venera, Yer, Mars — toshli","Tashqi: Yupiter, Saturn, Uran, Neptun — gaz giantlari","Asteroidlar kamari — Mars va Yupiter orasida","Yorug'lik Quyosh→Yer ≈ 8 daqiqa","Sayyora nur qaytaradi, yulduz nur chiqaradi"],"vocab":[{"w":"Quyosh sistemasi","m":"Quyosh va unga tortishish bilan bog'langan jismlar"},{"w":"Sayyora","m":"yulduz atrofini aylanuvchi, o'z nuri yo'q jism"},{"w":"Yo'ldosh","m":"sayyora atrofini aylanuvchi tabiiy jism"},{"w":"Asteroid","m":"asosan kamarda harakatlanuvchi kichik toshli jism"},{"w":"Kometa","m":"muz va changdan iborat, quyoshga yaqinlashganda dumi paydo bo'ladigan jism"},{"w":"Astronomik birlik (a.b.)","m":"Yer bilan Quyosh orasidagi o'rtacha masofa"}],"quiz":[["Quyosh sistemasidagi yagona yulduz — kim?",["Oy","Venera","Quyosh","Mars"],2,"Faqat yulduz o'z energiyasi bilan nur chiqaradi."],["Qaysi sayyoralar guruhi «toshli» hisoblanadi?",["Mitti sayyoralar","Ichki (Merkuriy–Mars)","Barcha sayyoralar","Tashqi (Yupiter–Neptun)"],1,"Ichki sayyoralar zich va qattiq yuzaga ega."],["Asteroidlar kamari qayerda joylashgan?",["Saturn halqasida","Neptundan keyin","Yer va Oy orasida","Mars va Yupiter orasida"],3,"Bu ikki sayyora orbitasi orasidagi kamarda 1 mln dan ortiq jism bor."],["Nega sayyora yulduz emas?",["Sovuq","Juda katta","Aylanmaydi","O'z nuri yo'q, yulduz nurini qaytaradi"],3,"Yulduz — termonuklear manba; sayyora — qaytirgich."],["Yorug'lik Quyoshdan Yerga qancha vaqtda yetadi?",["≈1 soat","≈1 soniya","≈8 daqiqa","≈1 yil"],2,"150 mln km ÷ 300 000 km/s ≈ 500 s ≈ 8 min."]],"slideQuiz":[["Qaysi sayyora eng ko'p yo'ldoshga ega?",["Venera","Merkuriy","Yupiter va Saturn (mingga yaqin birgalikda)","Yer"],2,"Ichki sayyoralarda yo'ldosh deyarli yo'q (Merkuriy, Venera — 0 ta)."],["Kometaning dumi qachon paydo bo'ladi?",["Har doim","Yerdan uzoqlashganda","Tun paytida","Quyoshga yaqinlashganda muz bug'lanadi"],3,"Issish va quyosh shamoli gaz-chang quyrog'ini hosil qiladi."]],"game":[["Jismni turi bilan moslashting: Oy",["Kometa","Yer tabiiy yo'ldoshi","Sayyora","Mitti sayyora"],1,"Oy — Yerning doimiy yo'ldoshi."],["Qaysi sayyorani «qizil sayyora» deyishadi?",["Merkuriy","Yupiter","Mars","Venera"],2,"Tuproqida temir oksidi ko'p — shu rangni beradi."],["Tartibni to'g'rilang: Yer, Venera, Mars, Merkuriy",["Venera, Merkuriy, Yer, Mars","Mars, Yer, Venera, Merkuriy","Yer, Venera, Merkuriy, Mars","Merkuriy, Venera, Yer, Mars"],3,"Quyoshdan uzoqlik bo'yicha ichki to'rtlik shu tartibda."]],"gameQuiz":[["Jismni turi bilan moslashting: Oy",["Kometa","Yer tabiiy yo'ldoshi","Sayyora","Mitti sayyora"],1,"Oy — Yerning doimiy yo'ldoshi."],["Qaysi sayyorani «qizil sayyora» deyishadi?",["Merkuriy","Yupiter","Mars","Venera"],2,"Tuproqida temir oksidi ko'p — shu rangni beradi."],["Tartibni to'g'rilang: Yer, Venera, Mars, Merkuriy",["Venera, Merkuriy, Yer, Mars","Mars, Yer, Venera, Merkuriy","Yer, Venera, Merkuriy, Mars","Merkuriy, Venera, Yer, Mars"],3,"Quyoshdan uzoqlik bo'yicha ichki to'rtlik shu tartibda."]],"task":{"q":"«Masshtabli model» — Quyosh va sayyoralarni kartoshka, no'xat, murch, kichik shar kabi tanlangan buyumlar bilan masshtabga soling (Quyosh diametri = 10 sm bo'lsa, Yer qancha bo'ladi?) va maktab hovlisida masofalarni 1 m = 15 mln km shkalasida chizing.","a":"Diametrlar: Quyosh 10 sm → Yer ≈0,9 mm (mayda don), Yupiter ≈1 sm. Masofa: Yer 10 m, Neptun ≈300 m. Model «sayyoralar yaqin» tasavvurini rad etadi.","why":"Masshtabda ishlash — astronomik miqyoslarni his qilishning yagona yo'li; ko'pchilik sayyoralar orasini kitob rasmlaridagidan ming marta katta deb biladi.","steps":["Quyosh va 8 sayyora diametrlarini (km) jadvalga yozing","Masshtabni belgilang: Quyosh = 10 sm; nisbatni toping","Har sayyora diametrini shu masshtabda hisoblang","Masofalarni 1 m = 15 mln km shkalasida hisoblang","Hovlida chizing/olasiz va suratga oling; xulosa: qaysi o'lcham hayratlantdirdi?"],"jihoz":["Kalkulyator","Uzunlik o'lchagich (rulon 10 m yoki arqon)","Markalash uchun bo'yoq/ko'cha chiziqlari (oleg)","Sayyora diametrlari jadvali"],"xavfsizlik":["Hovlida chizishda avto yo'lidan uzoq bo'ling","Quyoshga modelga qarab ham optik asboblar bilan to'g'ridan-to'g'ri qaramang"]},"act":{"type":"lab","name":"astronomiya","mode":"sistema"},"kitob":{"bobNomi":"Quyosh sistemasi","bet":143,"oralig":"143–","kod":"12.1","amaliyIsh":{"kod":"12.1","nomi":"Quyosh, sayyoralar va Oy","bet":130},"boshqotirma":132,"bilimlarXaritasi":133,"takrorlash":134,"mustahkamlash":137},"urinish":{"savollar":["Oy qanday harakatlanadi?"],"qism_mavzular":["Sayyoralarning Quyoshga nisbatan joylashishi va harakati"],"konikmalar":["ilmiy hodisani tasvirlash va izohlashda modeldan foydalanish;","ilmiy hodisani tushunishda modelning ahamiyatini bayon etish;","turli ma’lumot manbalaridan olingan dalillardan foydalanib savollarga javob berish;","jadvaldan foydalanib tadqiqot natijalarini izohlash;","tadqiqot natijalaridagi qonuniyatni bayon etish hamda kutilmagan natijalarni aniqlash;","turli tadqiqot metodlarining o‘ziga xos xususiyatlarini anglash;","kuzatish natijalarini rasm orqali ifodalash;","egallangan bilimlarni qo‘llab tadqiqot natijalarini bashorat qilish;","ilmiy savol qo‘yish va unga javob topishga yordam beradigan eng yaxshi tadqiqot metodini tanlash."],"tatbiq":["ilmiy bilimlar vaqt o‘tishi bilan o‘zgarishini ko‘rsatish uchun to‘plangan dalillardan foydalanish."]}},{"d":12,"c":2,"kod":"12.2","t":"Oyning fazalari","chorak":4,"lab":"astronomiya","labMode":"fazalar","labTitle":"","theory":"Yer o'z o'qi atrofida bir marta 24 soatda aylanadi — bu kun va tun almashinuvini beradi. Quyosh ufqdan ko'tarilib, botgandek ko'rinadi: aslida bizning sayyoramiz aylanmoqda.\n\nYer Quyosh atrofini 365,25 kunda aylanadi. Aylanish paytida o'q qiyaligi (≈23,5°) saqlanib qoladi — shuning uchun yil bo'ylab Quyosh nuri turli burchak ostida tushadi va fasllar almashinadi.\n\nFasllarning sababi — masofa emas, burchak: yozda nurlar tikroq tushadi, siyrakroq maydonga tarqaladi va yer yaxshiroq isiydi. Qishda burchak yonbosh — energiya katta maydonga bo'linadi.\n\nOy fazalari — Oyning Yer va Quyosh orasidagi holatiga qarab ko'rinadigan qismining o'zgarishi: yangi Oy → birinchi chorak → to'lin → oxirgi chorak → yangi Oy (≈29,5 kun). Oy o'z nuri yo'q; biz Quyosh yoritgan qismini ko'ramiz.\n\nQuyosh tutilishi — Oy Quyosh bilan Yer orasiga kelganda; Oy tutilishi — Yer soyasi Oyga tushganda. Tutilishlar har oyda kuzatilmaydi, chunki Oy orbitasi Yer orbitasiga nisbatan ~5° qiyalangan.","formulas":["O'z o'qi atrofini aylanish: 24 soat → kun/tun","Quyosh atrofini aylanish: 365,25 kun → yil","O'q qiyaligi ≈ 23,5° → fasllar","Fasllar sababi — nur burchagi, masofa emas","Oy fazalari davri ≈ 29,5 kun","Tutilishlar: Oy orbitasi qiyaligi ≈5° — shu sabab kam kuzatiladi"],"vocab":[{"w":"Aylanish (rotatsiya)","m":"sayyoraning o'z o'qi atrofidagi harakati"},{"w":"Orbital harakat","m":"sayyoraning yulduz atrofidagi harakati"},{"w":"O'q qiyaligi","m":"aylanish o'qining orbital tekislikka nisbatan og'ishi"},{"w":"Fasal","m":"nur burchagi bilan belgilanadigan iqlim davri"},{"w":"Faza","m":"Oyning ko'rinadigan qismining shakli"},{"w":"Tutilish","m":"bir jismning soyasi ikkinchisiga tushishi"}],"quiz":[["Kun va tun almashinuvi nimadan bo'ladi?",["Quyosh Yer atrofini aylanadi","Yer o'z o'qi atrofini aylanadi","Yer harakatsiz qoladi","Yer to'xtab turadi"],1,"Bir sutka = 24 soatlik aylanish."],["Fasllar almashinuvi asosan nimaga bog'liq?",["Shamolga","Yer o'qining qiyaligiga","Quyoshgacha bo'lgan masofaga","Oy fazasiga"],1,"Qiyalik sabab nur burchagi yil bo'ylab o'zgaradi."],["Oyning yorug' qismi qanday hosil bo'ladi?",["Bulutlar yorug' beradi","Quyosh nuri Oy yuzasidan qaytadi","Yer nuri yoritadi","Oy o'zi nur chiqaradi"],1,"Oy — yaltiroq tosh, o'z nuriga ega emas."],["To'lin Oy qachon ko'rinadi?",["Har kuni","Yangi oy holatida","Oy Quyosh ortida bo'lganda","Yer Oyni yonidan ko'rgan, Oy–Yer–Quyosh tekisligida"],3,"Oy Quyoshga nisbatan Yerning ortida bo'lsa — butun yuzasi yoritilgan holda ko'rinadi."],["Quyosh tutilishi qachon bo'ladi?",["Bulutlar qopganda","Oy Yer bilan Quyosh orasiga kelganda","Oy to'lin bo'lganda","Yer Oy soyasiga tushganda"],1,"Oy soyasi Yerning tor chizig'iga tushadi."]],"slideQuiz":[["Marsda ham fasllar bormi?",["Yo'q, chunki orbitasi katta","Yo'q, chunki u sovuq","Faqat yoz va qish bor","Bor, u ham qiyalangan o'qga ega (≈25°)"],3,"Fasllar qiyalik natijasi — boshqa sayyoralarda ham kuzatiladi."],["Nega har oyda tutilish bo'lmaydi?",["Oy juda katta","Yer aylanmaydi","Oy orbitasi Yer orbitasiga nisbatan qiyalangan","Quyosh yorug' bermaydi"],2,"Tugun nuqtalari yaqin bo'lgandagina tutilish bo'ladi."]],"game":[["Hodisani sababi bilan moslashting: qish sovuq",["Quyosh soviydi","Nur yonbosh tushadi, katta maydonga tarqaladi","Oy yo'q","Yer Quyoshdan uzoqlashadi (asosiy sabab)"],1,"Burchak — energiya zichligini o'zgartiradi."],["Fazani tartibi bilan aniqlang: to'lin Oydan keyin keladigan faza",["Birinchi chorak","Yangi Oy","To'lin bo'lib qoladi","Oxirgi chorak (kamayib boruvchi)"],3,"To'lin → kamayish → oxirgi chorak → yangi Oy."],["Yer o'qi qiyaligi qancha?",["≈23,5°","≈45°","≈90°","≈66,5°"],0,"Bu qiymat fasllarni belgilovchi asosiy son."]],"gameQuiz":[["Hodisani sababi bilan moslashting: qish sovuq",["Quyosh soviydi","Nur yonbosh tushadi, katta maydonga tarqaladi","Oy yo'q","Yer Quyoshdan uzoqlashadi (asosiy sabab)"],1,"Burchak — energiya zichligini o'zgartiradi."],["Fazani tartibi bilan aniqlang: to'lin Oydan keyin keladigan faza",["Birinchi chorak","Yangi Oy","To'lin bo'lib qoladi","Oxirgi chorak (kamayib boruvchi)"],3,"To'lin → kamayish → oxirgi chorak → yangi Oy."],["Yer o'qi qiyaligi qancha?",["≈23,5°","≈45°","≈90°","≈66,5°"],0,"Bu qiymat fasllarni belgilovchi asosiy son."]],"task":{"q":"«Fazalar kuzatuvi» — 1 hafta davomida har kecha Oyning ko'rinishini chizib, soatini va ob-havoni yozing. Hafta oxirida fazalar ketma-ketligini aniqlang va keyingi 10 kun uchun prognoz tuzing.","a":"Oyning yorug' qismi har kuni o'zgaradi (masalan, birinchi chorakdan to'linga qarab ortadi); ketma-ketlik 29,5 kunlik siklga mos keladi va prognoz keyingi kuzatuvda tasdiqlanadi.","why":"Kuzatuv + bashorat qilish — astronomiyaning asosiy usuli: osmon hodisasini takrorlab bo'lmaydi, lekin qonuniyatni topib prognoz qilish mumkin.","steps":["Kuzatuv varag'i: sana, vaqt, ob-havo, Oy chizmasi","Har kecha bir xil vaqtda (masalan 21:00) chiqing","Oyning yorug' qismini foizda baholang (50%, 75%, 100%)","Ketma-ketlikni grafiga chizing: kun — yorug'lik foizi","10 kunlik prognoz yozing va keyingi hafta tekshiring"],"jihoz":["Kuzatuv varag'i va qalam","Soat/telefon","Ixtiyoriy: ikiteleskop yoki qo'l chirog'i (xavfsizlik uchun)"],"xavfsizlik":["Kechasi ko'chaga chiqishda ota-ona yoki ustoz bilan boring","Yorug'lik yetishmaydigan joyda siljiydigan narsalarga e'tibor bering","Durbin/teleshkop bilan Quyoshga qaramang"]},"act":{"type":"lab","name":"astronomiya","mode":"fazalar"},"kitob":{"bobNomi":"Quyosh sistemasi","bet":143,"oralig":"143–","kod":"12.2","amaliyIsh":{"kod":"12.2","nomi":"Oy fazalarini modellashtirish","bet":131},"boshqotirma":132,"bilimlarXaritasi":133,"takrorlash":134,"mustahkamlash":137},"urinish":{"savollar":["Oyning qanday fazalari bor?"],"qism_mavzular":[],"konikmalar":["ilmiy hodisani tasvirlash va izohlashda modeldan foydalanish;","ilmiy hodisani tushunishda modelning ahamiyatini bayon etish;","turli ma’lumot manbalaridan olingan dalillardan foydalanib savollarga javob berish;","jadvaldan foydalanib tadqiqot natijalarini izohlash;","tadqiqot natijalaridagi qonuniyatni bayon etish hamda kutilmagan natijalarni aniqlash;","turli tadqiqot metodlarining o‘ziga xos xususiyatlarini anglash;","kuzatish natijalarini rasm orqali ifodalash;","egallangan bilimlarni qo‘llab tadqiqot natijalarini bashorat qilish;","ilmiy savol qo‘yish va unga javob topishga yordam beradigan eng yaxshi tadqiqot metodini tanlash."],"tatbiq":["ilmiy bilimlar vaqt o‘tishi bilan o‘zgarishini ko‘rsatish uchun to‘plangan dalillardan foydalanish."]}}]}
    </script>
    <script>
      /* 6-sinf Tabiiy fan — simulyatorlar (har mavzuning "lab" maydoni shu yerda)
 * API: LABS.mount(host, topic, api)  ->  {destroy()}
 * api: {state, render, save, toast, nf, el, note}
 * Har lab: {init, controls[], readouts[], compute(state)->{}, svg(state,r)->string, after?, note?}
 */
window.LABS = (function () {
  "use strict";

  /* ---------- yordamchilar ---------- */
  const s = (v, a, b) => Math.max(a, Math.min(b, v));
  const nf = (x, d = 1) => {
    if (!isFinite(x)) return "—";
    const p = Math.pow(10, d);
    return String(Math.round(x * p) / p).replace(".", ",");
  };
  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  const svgBox = (inner, vb) =>
    `<svg viewBox="${vb || "0 0 640 380"}" preserveAspectRatio="xMidYMid meet" role="img">${inner}</svg>`;
  const txt = (x, y, t, o = {}) =>
    `<text x="${x}" y="${y}" fill="${o.fill || "#cfe0ff"}" font-size="${o.size || 13}" ${o.anchor ? `text-anchor="${o.anchor}"` : ""} ${o.weight ? `font-weight="${o.weight}"` : ""} font-family="Georgia,serif">${t}</text>`;
  const rect = (x, y, w, h, o = {}) =>
    `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.r || 3}" fill="${o.fill || "none"}" stroke="${o.stroke || "#33507f"}" stroke-width="${o.sw || 1.4}" ${o.opacity ? `opacity="${o.opacity}"` : ""} ${o.dash ? `stroke-dasharray="${o.dash}"` : ""}/>`;
  const line = (x1, y1, x2, y2, o = {}) =>
    `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.stroke || "#5fd9d0"}" stroke-width="${o.sw || 2}" ${o.dash ? `stroke-dasharray="${o.dash}"` : ""} stroke-linecap="round"/>`;
  const circle = (cx, cy, r, o = {}) =>
    `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${o.fill || "none"}" stroke="${o.stroke || "#5fd9d0"}" stroke-width="${o.sw || 1.6}" ${o.opacity ? `opacity="${o.opacity}"` : ""}/>`;
  const path = (d, o = {}) =>
    `<path d="${d}" fill="${o.fill || "none"}" stroke="${o.stroke || "#5fd9d0"}" stroke-width="${o.sw || 2}" stroke-linecap="round" stroke-linejoin="round" ${o.opacity ? `opacity="${o.opacity}"` : ""}/>`;
  const arrow = (x1, y1, x2, y2, o = {}) => {
    const a = Math.atan2(y2 - y1, x2 - x1), L = o.head || 8;
    return (
      line(x1, y1, x2, y2, o) +
      path(
        `M${x2},${y2} L${x2 - L * Math.cos(a - 0.4)},${y2 - L * Math.sin(a - 0.4)} M${x2},${y2} L${x2 - L * Math.cos(a + 0.4)},${y2 - L * Math.sin(a + 0.4)}`,
        { stroke: o.stroke || "#5fd9d0", sw: o.sw || 2 }
      )
    );
  };
  const barChart = (items, o = {}) => {
    const W = o.w || 300, H = o.h || 150, x0 = o.x || 40, y0 = o.y || 200;
    const max = Math.max(0.001, ...items.map((i) => Math.abs(i.v))) * 1.15;
    const bw = (W - 20) / items.length;
    let out = line(x0 - 6, y0, x0 + W, y0, { stroke: "#33507f", sw: 1.2 });
    items.forEach((it, i) => {
      const h = (Math.abs(it.v) / max) * (H - 12);
      const x = x0 + i * bw + 6;
      out += rect(x, y0 - (it.v < 0 ? 0 : h), bw - 12, h, { fill: it.color || "#ffb347", stroke: "none", r: 2, opacity: .92 });
      out += txt(x + (bw - 12) / 2, y0 + 14, it.k, { size: 10.5, anchor: "middle", fill: "#93a4c4" });
      out += txt(x + (bw - 12) / 2, y0 - h - 4, it.label || nf(it.v, 1), { size: 11, anchor: "middle", fill: "#e8eefc" });
    });
    return out;
  };
  const gauge = (cx, cy, r, val, o = {}) => {
    const a0 = Math.PI, a1 = 0;
    const ang = a0 + (a1 - a0) * val;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    const x1 = cx + r * Math.cos(ang), y1 = cy + r * Math.sin(ang);
    const arc = path(`M${x0},${y0} A${r},${r} 0 0 1 ${x1},${y1}`, { stroke: o.color || "#ffb347", sw: 8 });
    return arc + line(cx, cy, cx + (r - 8) * Math.cos(ang), cy + (r - 8) * Math.sin(ang), { stroke: "#e8eefc", sw: 2 }) + circle(cx, cy, 3.5, { fill: "#e8eefc", stroke: "none" });
  };

  /* ---------- 1. Ratsion / tarviya ---------- */
  const ratsion = {
    title: "Kunlik ratsionni tuzish",
    hint: "Uch guruh oziqni gramm bilan bering — energiya va 1:1:4 nisbati avtomatik hisoblanadi.",
    init: { oq: 70, yog: 55, ugl: 260, faol: 2 },
    controls: [
      { k: "oq", label: "Oqsil (go‘sht, sut, don)", min: 0, max: 250, step: 5, unit: "g" },
      { k: "yog", label: "Yog‘lar (moy, yong‘oq)", min: 0, max: 180, step: 5, unit: "g" },
      { k: "ugl", label: "Uglevodlar (non, guruch, kartoshka)", min: 0, max: 600, step: 10, unit: "g" },
      { k: "faol", label: "Harakatchanlik (1–4)", min: 1, max: 4, step: 1, unit: "" },
    ],
    readouts: [
      { k: "energiya", label: "Energiya", unit: "kJ" },
      { k: "nisbat", label: "Nisbat 1:1:4" },
      { k: "sarf", label: "Kerak", unit: "kJ" },
      { k: "baho", label: "Xulosa" },
    ],
    compute(st) {
      const e = st.oq * 17 + st.yog * 39 + st.ugl * 17;
      const sarf = { 1: 8400, 2: 10000, 3: 11700, 4: 13400 }[st.faol];
      const min = Math.min(st.oq, st.yog) || 0.001;
      const nisbat = `1 : ${nf(st.yog / min, 1)} : ${nf(st.ugl / min, 1)}`;
      let baho = "Muvozanat yaqin";
      if (e < sarf * 0.85) baho = "Energiya kam";
      else if (e > sarf * 1.15) baho = "Energiya ortiqcha";
      else if (st.ugl / (st.oq || 1) < 2) baho = "Uglevod kam";
      else if (st.yog / (st.oq || 1) > 1.6) baho = "Yog‘ ko‘p";
      const plate = st.oq + st.yog + st.ugl || 1;
      return { energiya: Math.round(e), sarf, nisbat, baho, pa: (st.oq / plate) * 100, py: (st.yog / plate) * 100, pu: (st.ugl / plate) * 100 };
    },
    svg(st, r) {
      const cx = 170, cy = 190, R = 105;
      let a = -Math.PI / 2;
      const seg = (share, color) => {
        const a2 = a + share * Math.PI * 2;
        const big = share > 0.5 ? 1 : 0;
        const d = `M${cx},${cy} L${cx + R * Math.cos(a)},${cy + R * Math.sin(a)} A${R},${R} 0 ${big} 1 ${cx + R * Math.cos(a2)},${cy + R * Math.sin(a2)} Z`;
        a = a2;
        return path(d, { fill: color, stroke: "#0a1424", sw: 2 });
      };
      const bars = barChart(
        [{ k: "oqsil", v: st.oq, color: "#ff9a76" }, { k: "yog‘", v: st.yog, color: "#ffb347" }, { k: "uglevod", v: st.ugl, color: "#5fd9d0" }],
        { x: 330, y: 60, w: 280, h: 170 }
      );
      return svgBox(
        circle(cx, cy, R + 8, { stroke: "#33507f", sw: 2 }) +
        seg(r.pa / 100, "#ff9a76") + seg(r.py / 100, "#ffb347") + seg(r.pu / 100, "#5fd9d0") +
        txt(cx, 330, "Taroq: oqsil " + nf(r.pa, 0) + "% · yog‘ " + nf(r.py, 0) + "% · uglevod " + nf(r.pu, 0) + "%", { anchor: "middle", size: 12, fill: "#93a4c4" }) +
        bars +
        txt(330, 262, "Tavsiya: " + r.sarf + " kJ  ·  sizda: " + r.energiya + " kJ", { fill: "#e8eefc", size: 13, weight: "bold" }) +
        txt(330, 284, r.baho, { fill: r.baho === "Muvozanat yaqin" ? "#6fe39a" : "#ffb347", size: 14, weight: "bold" })
      );
    },
  };

  /* ---------- 2. Hazm / oqim ---------- */
  const HAZM = [
    { k: "Og‘iz", d: 0.06, chem: "kraxmal → qand" },
    { k: "Qizilo‘ngach", d: 0.05, chem: "" },
    { k: "Oshqozon", d: 0.2, chem: "oqsil → aminokislota" },
    { k: "On ikki barmoq", d: 0.07, chem: "yog‘ → moy kislotalari" },
    { k: "Ingichak", d: 0.4, chem: "villin orqali so‘rilish" },
    { k: "Qalin ichak", d: 0.16, chem: "suv so‘riladi" },
    { k: "To‘g‘i ichak", d: 0.06, chem: "qoldiq" },
  ];
  const hazm = {
    title: "Hazm yo‘li bo‘ylab sayohat",
    hint: "Bo‘lakni oziqlantirish tezligi va shiralar bilan yuboring: kimyoviy hazm qayerda bo‘lishi chiziqda ko‘rinadi.",
    init: { t: 0.15, tezlik: 1, ferments: 1 },
    controls: [
      { k: "tezlik", label: "Harakat tezligi", min: 0.2, max: 3, step: 0.1, unit: "×" },
      { k: "ferments", label: "Fermentlar ishtiroki (0/1)", min: 0, max: 1, step: 1, unit: "" },
    ],
    readouts: [
      { k: "joy", label: "Hozirgi bo‘lim" },
      { k: "hazm", label: "Hazm bo‘lgan", unit: "%" },
      { k: "sorilish", label: "So‘rilish", unit: "%" },
    ],
    compute(st) {
      let acc = 0, joy = HAZM[0].k, idx = 0;
      for (let i = 0; i < HAZM.length; i++) {
        acc += HAZM[i].d;
        if (st.t <= acc) { joy = HAZM[i].k; idx = i; break; }
      }
      const chem = st.ferments ? (HAZM[idx].chem ? 1 : 0) : 0;
      const hazm = s(40 * st.t + chem * 55 * st.t, 0, 100);
      const sorilish = idx >= 4 ? Math.round(s((st.t - 0.66) / 0.34, 0, 1) * 92) : 0;
      return { joy, idx, hazm: Math.round(hazm), sorilish, chem };
    },
    svg(st, r) {
      let x = 40, out = "";
      const y = 200, H = 42;
      HAZM.forEach((h, i) => {
        const w = Math.max(34, 560 * h.d);
        const on = i === r.idx;
        out += rect(x, y - H / 2 + (i % 2 ? 12 : -12), w - 4, H, { fill: on ? "#ffb347" : h.chem ? "#1c3a55" : "#16273f", stroke: on ? "#fff" : "#33507f", r: 8, opacity: on ? 1 : 0.9 });
        out += txt(x + (w - 4) / 2, y + (i % 2 ? 40 : 16), h.k, { size: 10.5, anchor: "middle", fill: on ? "#26160a" : "#93a4c4", weight: on ? "bold" : "" });
        if (h.chem && st.ferments) out += txt(x + (w - 4) / 2, y - 34, "⚗", { size: 13, anchor: "middle", fill: "#5fd9d0" });
        if (i < HAZM.length - 1) out += arrow(x + w - 4, y + (i % 2 ? 6 : -6), x + w + 6, y + ((i + 1) % 2 ? 6 : -6), { stroke: "#33507f", sw: 1.6 });
        x += w;
      });
      const bx = 40 + 560 * st.t;
      out += circle(bx, y - 12, 9, { fill: "#6fe39a", stroke: "#0a1424", sw: 2 });
      out += txt(320, 60, r.joy + (r.chem ? "  ·  kimyoviy hazm: " + (HAZM[r.idx].chem || "—") : "  ·  kimyoviy hazm yo‘q"), { anchor: "middle", size: 14, fill: "#ffb347", weight: "bold" });
      out += txt(320, 82, "Hazm darajasi " + r.hazm + "%  ·  so‘rilish " + r.sorilish + "%", { anchor: "middle", size: 12, fill: "#93a4c4" });
      return svgBox(out, "0 0 640 320");
    },
    after(host, st, r, api) {
      if (api.timer) clearInterval(api.timer);
      api.timer = setInterval(() => {
        if (!document.body.contains(host)) return clearInterval(api.timer);
        if (!api.running) return;
        st.t = s(st.t + 0.004 * st.tezlik, 0, 1);
        if (st.t >= 1) { st.t = 1; api.running = false; }
        api.render();
      }, 60);
    },
    controlsExtra: [{ type: "playpause" }],
  };

  /* ---------- 3. Nafas / diaphragma ---------- */
  const nafas = {
    title: "Nafas olish modeli",
    hint: "Diaphragma holatini suring: o‘pka hajmi va bosim qanday o‘zgarishini kuzating.",
    init: { d: 0.5, tosiq: 0 },
    controls: [
      { k: "d", label: "Diaphragma (0 = yuqorida, 1 = pastda)", min: 0, max: 1, step: 0.01 },
      { k: "tosiq", label: "Nafas yo‘lini qisman to‘sish (0/1)", min: 0, max: 1, step: 1 },
    ],
    readouts: [
      { k: "hajm", label: "O‘pka hajmi", unit: "L" },
      { k: "bosim", label: "Bosim", unit: "kPa" },
      { k: "ola", label: "Jarayon" },
    ],
    compute(st) {
      const hajm = 1.6 + 2.6 * st.d;
      const bosim = 101.3 - 6 * st.d + (st.tosiq ? 1.5 : 0);
      return { hajm, bosim, ola: st.d > 0.55 ? "Nafas olish (havo kiradi)" : st.d < 0.45 ? "Nafas chiqarish (havo chiqadi)" : "O‘tish holati" };

  /* ---------- 5. Mikrob / tarqalish va spreu ---------- */

    title: "Tomchilar qanchalik uzoqqa yetadi?",

      reach = s(reach, 0, 100);
      const havoda = s(100 - reach + (st.yopiq ? 15 : -10), 0, 100);
      const xavf = reach > 55 ? "Yuqori" : reach > 25 ? "O‘rta" : "Past";

    svg(st, r) {
      const x0 = 120, y0 = 190;

        line(20, 262, 620, 262, { stroke: "#33507f", sw: 1.4 }) +
        person(x0, "Manba") + mask + person(x0 + L, "Sog‘lom") + drops +
        arrow(x0 + 30, 120, x0 + 30 + L, 120, { stroke: "#ffb347", sw: 1.6, dash: "6 5" }) +

      const baho = n < st.boshlangich * 0.02 ? "Organizm mikrobni bartaraf etdi" : n > st.boshlangich * 0.5 ? "Himoya yetarli emas — kasallik xavfi" : "Qisman himoya ishlayapti";

      for (let i = 0; i < 60 && cnt < 60; i++) {
        const alive = i < Math.round(s((n / st.boshlangich) * 60, 0, 60));
        cnt++;

      return {
        steps,
        energiya: st.buzish ? 0 : e,
        sahifalar: tan.length,
        holat: st.buzish ? st.buzish + "-bo‘g‘in uzilgan — oziq zanjiri ishlamaydi" : ok ? "Zanjir to‘g‘ri tuzilgan" : "Chiruvchi zanjir oxirida bo‘lishi kerak",

      });
