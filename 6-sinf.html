<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>6-sinf · Tabiiy fan — interaktiv platforma</title>
    <meta name="description" content="6-sinf Tabiiy fan: 12 bob, 26 mavzu — nazariya, simulyator, o'yin, test va amaliy topshiriq bitta faylda." />
    <style>
      /* 6-sinf Tabiiy fan platformasi — uslublar (7-sinf arxitekturasiga asoslangan) */
:root {
  --bg: #0c1220;
  --bg-2: #121a2b;
  --panel: #16203450;
  --line: #26344d;
  --text: #e8eefc;
  --muted: #93a4c4;
  --amber: #ffb347;
  --amber-dark: #cc7a00;
  --cyan: #5fd9d0;
  --cyan-dark: #1f6f68;
  --green: #6fe39a;
  --red: #ff7a7a;
  --purple: #b18cff;
  --sb: 268px;
  --radius: 12px;
  --font-brand: Georgia, "Times New Roman", serif;
  --font-body: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(1100px 700px at 85% -10%, #1b2b4a 0%, var(--bg) 60%);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
}
body.no-scroll { overflow: hidden; }
a { color: var(--cyan); }
button { font: inherit; cursor: pointer; }
::selection { background: #ffb34755; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #29395a; border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- Layout ---------- */
#layout { display: flex; min-height: 100vh; }
#sidebar {
  width: var(--sb); flex: 0 0 var(--sb); border-right: 1px solid var(--line);
  background: linear-gradient(180deg, #101a2c, #0b1220); padding: 14px 12px;
  display: flex; flex-direction: column; gap: 10px; position: sticky; top: 0; height: 100vh; overflow: hidden;
}
#brand h1 { font-family: var(--font-brand); font-size: 20px; margin: 0; color: var(--amber); letter-spacing: .3px; }
#brand p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
#search {
  width: 100%; background: #0b1526; color: var(--text); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 9px; font-size: 13px;
}
#search:focus { outline: 1px solid var(--cyan); }
#bob-list { overflow-y: auto; flex: 1; margin: 0 -6px; padding: 0 6px; }
.bob-group { margin-bottom: 8px; }
.bob-title {
  font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
  padding: 7px 8px 5px; display: flex; align-items: center; gap: 7px; border-bottom: 1px dashed #23324d;
}
.bob-title .n { font-family: var(--font-brand); color: #dfe8ff; font-size: 13.5px; letter-spacing: 0; text-transform: none; }
.bob-title .b { margin-left: auto; font-size: 10px; border: 1px solid var(--amber); color: var(--amber); border-radius: 20px; padding: 0 6px; }
.topic-item {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  background: transparent; border: 0; border-left: 3px solid transparent; color: #cfdcf6;
  padding: 7px 8px; border-radius: 7px; font-size: 13px;
}
.topic-item:hover { background: #1b2740; }
.topic-item.active { background: #22314f; border-left-color: var(--amber); color: #fff; }
.topic-item .kod { font-variant-numeric: tabular-nums; color: var(--cyan); font-size: 12px; min-width: 28px; }
.topic-item .tick { margin-left: auto; color: var(--green); font-size: 12px; }

#main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#topbar {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  border-bottom: 1px solid var(--line); background: #0e1626cc; backdrop-filter: blur(8px);
  position: sticky; top: 0; z-index: 30;
}
#burger { display: none; background: #17233b; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
#crumb { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#crumb b { color: var(--text); font-weight: 600; }
#tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.tab-btn {
  background: #17233b; color: #c8d6f0; border: 1px solid var(--line); border-radius: 20px;
  padding: 5px 12px; font-size: 12.5px; white-space: nowrap;
}
.tab-btn:hover { border-color: var(--cyan); }
.tab-btn.active { background: var(--amber); color: #26160a; border-color: var(--amber); font-weight: 600; }
#content { padding: 18px 22px 70px; max-width: 1080px; }

/* ---------- Cards / general ---------- */
.card {
  background: linear-gradient(180deg, #16223a, #121b2e); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px;
}
.card h2 { margin: 0 0 10px; font-family: var(--font-brand); font-size: 21px; color: var(--amber); }
.card h3 { margin: 14px 0 6px; font-size: 15.5px; color: var(--cyan); }
.card p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.grid { display: grid; gap: 12px; }
.grid.cols-2 { grid-template-columns: 1fr 1fr; }
.grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  background: #0f1a2e; border: 1px solid var(--line); border-radius: 20px; padding: 3px 10px; font-size: 12px; color: #cfe0ff;
}
.chip.amber { border-color: var(--amber); color: var(--amber); }
.chip.cyan { border-color: var(--cyan); color: var(--cyan); }
.btn {
  background: #1a2942; color: var(--text); border: 1px solid var(--line); border-radius: 9px;
  padding: 8px 14px; font-size: 13.5px;
}
.btn:hover { border-color: var(--cyan); }
.btn.primary { background: var(--amber); color: #2b1a07; border-color: var(--amber); font-weight: 600; }
.btn.ghost { background: transparent; }
.btn.small { padding: 4px 9px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }

/* Nazariya */
.theory p { margin: 0 0 11px; }
.theory p:first-letter { color: inherit; }
.formula-list { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.formula {
  background: #0e1930; border: 1px solid var(--line); border-left: 3px solid var(--cyan);
  border-radius: 9px; padding: 9px 11px; font-family: var(--font-brand); font-size: 15px;
}
.vocab-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.vocab-table th, .vocab-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #1f2b45; }
.vocab-table th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: .5px; }
.vocab-table td:first-child { color: var(--amber); white-space: nowrap; }
.kitob-box { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.quote { border-left: 3px solid var(--amber); padding: 6px 0 6px 12px; color: #dbe6fb; font-style: italic; }

/* Amaliy topshiriq */
.task-block { display: grid; gap: 10px; }
.task-list { margin: 0; padding-left: 20px; }
.task-list li { margin-bottom: 4px; }
.check-row { display: flex; gap: 9px; align-items: flex-start; padding: 6px 8px; border: 1px solid var(--line); border-radius: 9px; background: #0f1a2e; }
.check-row input { margin-top: 3px; accent-color: var(--amber); }
.check-row.done { border-color: var(--green); background: #10241d; }
.safety { background: #2a1520; border: 1px solid #6b2a3c; border-left: 4px solid var(--red); border-radius: 10px; padding: 10px 12px; }
.safety h3 { margin-top: 0; color: #ff9d9d; }
.notebook {
  width: 100%; min-height: 140px; background: #0b1526; color: var(--text); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 14px; resize: vertical;
}
.mezon-chip {
  display: inline-flex; align-items: center; gap: 5px; background: #14243c; border: 1px dashed var(--purple);
  color: #cdbcff; border-radius: 20px; padding: 3px 10px; font-size: 12px;
}
.mezon-chip.biox { border-color: var(--cyan); color: var(--cyan); }

/* ---------- Test ---------- */
.test-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.q-item { border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; margin-bottom: 10px; background: #101a2d; }
.q-item .q-text { font-weight: 600; margin-bottom: 8px; }
.opt-row { display: flex; gap: 8px; align-items: center; padding: 6px 9px; border: 1px solid #223049; border-radius: 8px; margin-bottom: 5px; }
.opt-row:hover { border-color: var(--cyan); }
.opt-row input { accent-color: var(--cyan); }
.opt-row.correct { border-color: var(--green); background: #112a1e; }
.opt-row.wrong { border-color: var(--red); background: #2b1518; }
.why { margin-top: 8px; font-size: 13px; color: #cfe0ff; border-left: 3px solid var(--amber); padding-left: 10px; }
.score-bar { display: flex; align-items: center; gap: 12px; }
.score-bar .bar { flex: 1; height: 9px; background: #1b2740; border-radius: 9px; overflow: hidden; }
.score-bar .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--amber)); }
.chip-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.chip-num {
  width: 27px; height: 27px; border-radius: 7px; border: 1px solid var(--line); background: #0f1a2e;
  color: #cfe0ff; font-size: 12px; display: inline-flex; align-items: center; justify-content: center;
}
.chip-num.ok { border-color: var(--green); color: var(--green); }
.chip-num.no { border-color: var(--red); color: #ffb4b4; }
.chip-num.cur { border-color: var(--amber); color: var(--amber); }

/* ---------- Simulator ---------- */
.lab-wrap { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(220px, .65fr); gap: 14px; }
.lab-stage {
  background: #0a1424; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px;
  min-height: 340px; display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.lab-stage svg { width: 100%; height: auto; display: block; }
.lab-panel { display: grid; gap: 10px; align-content: start; }
.field { background: #0f1a2e; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.field input[type=range] { width: 100%; accent-color: var(--amber); }
.field .val { font-family: var(--font-brand); font-size: 16px; color: var(--amber); }
.readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 8px; }
.readout .cell { background: #0b1526; border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; }
.readout .cell b { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
.readout .cell span { font-family: var(--font-brand); font-size: 17px; color: var(--cyan); }
.seg { display: flex; gap: 5px; flex-wrap: wrap; }
.seg button { background: #0f1a2e; border: 1px solid var(--line); color: #cfe0ff; border-radius: 8px; padding: 5px 10px; font-size: 12.5px; }
.seg button.on { border-color: var(--amber); color: var(--amber); background: #1d2436; }
.hint { font-size: 12.5px; color: var(--muted); }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th, .data-table td { border-bottom: 1px solid #1f2b45; padding: 5px 7px; text-align: left; }
.data-table th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }

/* ---------- O'yin ---------- */
.game-card { max-width: 720px; }
.game-q { font-size: 17px; font-family: var(--font-brand); color: var(--amber); margin-bottom: 12px; }
.game-opts { display: grid; gap: 8px; }
.game-opt {
  text-align: left; background: #101c33; border: 1px solid var(--line); color: var(--text);
  border-radius: 10px; padding: 10px 13px; font-size: 14.5px; transition: transform .1s;
}
.game-opt:hover { transform: translateX(3px); border-color: var(--cyan); }
.game-opt.right { border-color: var(--green); background: #112a1e; }
.game-opt.bad { border-color: var(--red); background: #2b1518; }
.game-meter { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.game-meter .track { flex: 1; height: 8px; background: #1b2740; border-radius: 8px; overflow: hidden; }
.game-meter .track > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--green), var(--amber)); transition: width .3s; }

/* ---------- Dashboard ---------- */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 14px; }
.stat { background: #111d33; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.stat b { display: block; font-family: var(--font-brand); font-size: 27px; color: var(--amber); }
.stat span { font-size: 12px; color: var(--muted); }
.bob-progress { display: grid; gap: 6px; }
.bp-row { display: grid; grid-template-columns: 34px 1fr 46px; gap: 10px; align-items: center; font-size: 12.5px; }
.bp-row .name { color: #cfe0ff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bp-bar { height: 8px; background: #1b2740; border-radius: 8px; overflow: hidden; }
.bp-bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--amber)); }

/* ---------- Slides overlay ---------- */
#slides {
  position: fixed; inset: 0; z-index: 90; display: none; flex-direction: column;
  background: #05080f; padding: 14px 18px 10px;
}
#slides.on { display: flex; }
#slides-head { display: flex; align-items: center; gap: 10px; }
#slides-head .title { font-family: var(--font-brand); color: var(--amber); font-size: 17px; }
#slides-head .spacer { flex: 1; }
#slides-stage {
  flex: 1; min-height: 0; margin: 12px auto; width: min(1180px, 100%);
  display: grid; gap: 14px; place-items: center;
}
.slide-sheet {
  width: 100%; background: #fff; color: #16233a; border-radius: 14px; padding: 26px 30px;
  box-shadow: 0 20px 60px #000a; display: grid; gap: 14px; align-content: start;
  min-height: 62vh; font-family: var(--font-body);
}
.slide-sheet .hd { font-family: var(--font-brand); font-size: clamp(21px, 3.1vw, 34px); color: #12324f; margin: 0; }
.slide-sheet .sub { font-size: 12.5px; color: #5b6b85; text-transform: uppercase; letter-spacing: 1px; }
.slide-sheet .body { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; font-size: clamp(14px, 1.35vw, 17px); }
.slide-sheet .body.one { grid-template-columns: 1fr; }
.slide-sheet .foot { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; color: #5b6b85; }
.slide-sheet .fbox { border: 2px solid #1f8fb0; background: #eef9fc; border-radius: 10px; padding: 10px 12px; }
.slide-sheet .qbox { border: 2px dashed #cc7a00; background: #fff8ee; border-radius: 10px; padding: 12px; }
.slide-sheet ol, .slide-sheet ul { margin: 6px 0 0; padding-left: 22px; }
.slide-sheet .kvs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
#slides-foot { display: flex; align-items: center; gap: 10px; justify-content: center; }

/* ---------- Modal (print center) ---------- */
#modal-overlay { position: fixed; inset: 0; z-index: 95; display: none; background: #05080fcc; align-items: center; justify-content: center; padding: 20px; }
#modal-overlay.on { display: flex; }
#modal {
  background: linear-gradient(180deg, #17233c, #101a2d); border: 1px solid var(--line); border-radius: 14px;
  width: min(920px, 100%); max-height: 88vh; overflow: auto; padding: 18px 20px;
}
#modal h2 { margin: 0 0 12px; font-family: var(--font-brand); color: var(--amber); }
.print-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.print-tile {
  border: 1px solid var(--line); border-radius: 10px; padding: 9px; background: #0f1a2e; font-size: 12.5px;
  display: flex; gap: 8px; align-items: flex-start;
}
.print-tile .prev {
  flex: 0 0 46px; height: 30px; border-radius: 4px; background: #fff; color: #16233a;
  font-size: 7px; padding: 3px; overflow: hidden; line-height: 1.1;
}
.print-tile.sel { outline: 2px solid var(--amber); }
.print-tile .lbl { display: block; color: var(--muted); font-size: 10.5px; }
.print-tile label { display: flex; gap: 6px; align-items: flex-start; }

/* ---------- Print area ---------- */
#print-area { display: none; }
@media print {
  body { background: #fff; color: #000; }
  #layout, #slides, #modal-overlay, .no-print { display: none !important; }
  #print-area { display: block !important; }
  .print-sheet { page-break-after: always; padding: 0 0 12mm; color: #16233a; font-family: var(--font-body); }
  .print-sheet:last-child { page-break-after: auto; }
}
.print-sheet .phd { display: flex; align-items: baseline; gap: 10px; border-bottom: 2px solid #cc7a00; padding-bottom: 4px; margin-bottom: 8px; }
.print-sheet .phd b { font-family: var(--font-brand); font-size: 16pt; }
.print-sheet .phd span { font-size: 9pt; color: #5b6b85; }
.pgrid { display: grid; grid-template-columns: 1fr; gap: 6mm; }
.pgrid.n2 { grid-template-columns: 1fr 1fr; }
.pgrid.n3 { grid-template-columns: 1fr 1fr 1fr; }
.pgrid.n4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.psheet-card {
  border: 1.2pt solid #2b3f5f; border-radius: 8pt; padding: 8pt 10pt; break-inside: avoid;
  background: #fff; font-size: 10pt; line-height: 1.45;
}
.psheet-card h4 { margin: 0 0 5pt; font-size: 13pt; font-family: var(--font-brand); color: #12324f; }
.psheet-card .lbl { font-size: 7.5pt; text-transform: uppercase; letter-spacing: .6px; color: #5b6b85; }
.psheet-card ul, .psheet-card ol { margin: 4pt 0; padding-left: 16pt; }
.psheet-card table { width: 100%; border-collapse: collapse; font-size: 9pt; }
.psheet-card th, .psheet-card td { border: .8pt solid #98a8c2; padding: 3pt 4pt; text-align: left; }
.psheet-card .line { border-bottom: .8pt dotted #7d8ba3; height: 15pt; }
.psheet-card .answer-key { margin-top: 6pt; font-size: 8pt; color: #46536b; }

/* ---------- Toast ---------- */
#toast {
  position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 30px); z-index: 120;
  background: #1d2c47; border: 1px solid var(--cyan); color: var(--text); padding: 9px 16px;
  border-radius: 24px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: .25s;
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Bosh sahifa ---------- */
#home-hero { background: linear-gradient(120deg, #1a2b4a, #101a2d); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; margin-bottom: 16px; }
#home-hero h2 { margin: 0 0 6px; font-family: var(--font-brand); font-size: 27px; color: var(--amber); }
.tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.bob-tile { text-align: left; background: #121d33; border: 1px solid var(--line); border-radius: 14px; padding: 14px; color: var(--text); }
.bob-tile:hover { border-color: var(--amber); transform: translateY(-2px); transition: .15s; }
.bob-tile .n { font-family: var(--font-brand); font-size: 15px; color: var(--cyan); }
.bob-tile .t { display: block; font-size: 15px; margin: 3px 0 8px; font-weight: 600; }
.bob-tile .m { font-size: 12px; color: var(--muted); }
.bob-tile .bar { height: 6px; background: #1b2740; border-radius: 6px; margin-top: 9px; overflow: hidden; }
.bob-tile .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--amber)); }

/* ---------- Responsive ---------- */
@media (max-width: 1000px) {
  .lab-wrap { grid-template-columns: 1fr; }
  .grid.cols-2, .grid.cols-3 { grid-template-columns: 1fr; }
  .print-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .slide-sheet .body { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  #sidebar { position: fixed; left: 0; top: 0; z-index: 60; transform: translateX(-102%); transition: .2s; box-shadow: 20px 0 60px #0009; }
  body.sb-open #sidebar { transform: translateX(0); }
  #burger { display: block; }
  #tabs { position: static; }
  #topbar { flex-wrap: wrap; }
  #content { padding: 14px 12px 60px; }
}

    </style>
  </head>
  <body>
    <div id="layout">
      <aside id="sidebar">
        <div id="brand">
          <h1>Tabiiy fan · 6-sinf</h1>
          <p>Kitob mundarijasi asosida · 12 bob, 26 mavzu</p>
        </div>
        <input id="search" type="search" placeholder="Mavzu qidirish…" autocomplete="off" />
        <nav id="bob-list"></nav>
        <div class="small muted" style="border-top: 1px solid var(--line); padding-top: 8px">
          Ma'lumot darslik va mashq daftari mundarijasidan olgan. Progress brauzeringizda saqlanadi.
        </div>
      </aside>

      <main id="main">
        <header id="topbar">
          <button class="btn small" data-act="burger" id="burger">☰</button>
          <div id="crumb"></div>
          <div id="tabs">

y ta'sir qiladi. Muvozanatni tekshirishning eng oddiy vositasi — jadval va ustunli diagramma: kunlik ratsionni guruhlar bo'yicha taqqoslash.\n\nOziq zanjiri va oziq to'ri mavzusida biz shu organizmlarni bog'laydigan oziq munosabatlarini ko'ramiz.","formulas":["Oqsil : yog' : uglevod ≈ 1 : 1 : 4","1 g oqsil ≈ 17 kJ, 1 g uglevod ≈ 17 kJ, 1 g yog' ≈ 39 kJ","Ratsion = kunlik ovqat rejasi (miqdor + tarkib)","Muvozanat = sarflanadigan energiya = keladigan energiya","Makloelementlar ko'p, mikroelementlar oz miqdorda kerak","Kunlik sut, non, go'sht/baliq, sabzavot va meva — turli guruhlar"],"vocab":[{"w":"Ratsion","m":"bir kunda iste'mol qilinadigan ovqatning rejasi"},{"w":"Makloelementlar","m":"oqsil, yog', uglevod — ko'p kerak bo'ladigan moddalar"},{"w":"Mikroelementlar","m":"vitaminlar, minerallar, suv — oz miqdorda kerak"},{"w":"Uglevodlar","m":"organizmning asosiy energiya manbasi"},{"w":"Oqsillar","m":"hujayra va to'qimalarning qurilish materiali"},{"w":"Vitaminlar","m":"jarayonlarni tartibga soluvchi organik moddalar"}],"quiz":[["Ovqatdagi asosiy energiya manba qaysi modda guruhi?",["Vitaminlar","Minerallar","Suv","Uglevodlar"],3,"Uglevodlar — tezkor energiya manbai; 1 g da ≈ 17 kJ."],["1 g yog' parchalanganda ajraladigan energiya taxminan qancha?",["4 kJ","90 kJ","17 kJ","39 kJ"],3,"Yog' — eng «quvvatli» modda: 1 g da ≈ 39 kJ, oqsil va uglevodda ≈ 17 kJ."],["Oqsil : yog' : uglevod ning tavsiya etiladigan nisbati:",["1 : 1 : 4","4 : 1 : 1","1 : 4 : 1","1 : 2 : 2"],0,"Muvozanatlashgan ratsionda bu nisbat taxminan 1:1:4 deb olinadi."],["Ratsional ovqatlanishning asosiy belgisi nima?",["Energiya sarf bilan ta'minlanadi va mahsulotlar xilma-xil","Yog'lar umuman yo'q","Faqat bir xil ovqatni ko'p yeysang bo'ldi","Kuniga b mahal ovqatlanish yetarli"],0,"Muvozanat ikki qismli: miqdor (sarf = kirish) va tarkib (turli guruhlar)."],["Vitaminlar organizmda asosan nima vazifani bajaradi?",["Suyakka o'xshash qurilish materiali beradi","Asosiy energiya manbai bo'ladi","Jarayonlarni tartibga soladi","Oksigen tashiydi"],2,"Vitaminlar energiya bermaydi — ular kimyoviy jarayonlarni regulatsiya qiladi."]],"slideQuiz":[["Muvozanatlashgan ratsionda eng katta ulush qaysi guruhga tegishli?",["Uglevodlar","Oqsillar","Yog'lar","Vitaminlar"],0,"Nisbat 1:1:4 — uglevodlar eng ko'p."],["Kunlik ratsionni tekshirish uchun qaysi vizual vosita qulay?",["Ustunli diagramma","Faqat matn","Rasm galereyasi","Chizma emas"],0,"Diagramma guruhlar ulushini bir qarashda taqqoslash imkonini beradi."]],"game":[["Mahsulotni uning asosiy modda guruhi bilan moslashting: kartoshka",["Vitamin","Uglevod","Yog'","Oqsil"],1,"Kartoshka — asosan kraxmal, ya'ni uglevod."],["Tuxum oqi asosan nimaga boy?",["Yog'","Oqsil","Suv","Uglevod"],1,"Tuxum oqi — toza oqsil namunasi."],["Apelsin asosan qaysi mikroelement manbai?",["Yog'","Kalsiy","Vitamin C","Kraxmal"],2,"Sitruslar vitamin C ga boy."],["Sur'ya (yog') organizmda asosan nima uchun kerak?",["Suv saqlash","Uzoq muddatli energiya zaxirasi","Oksigen tashish","Oqsil qurilishi"],1,"Yog' — energiya zaxirasi va issiqlik izolatsiyasi."]],"gameQuiz":[["Mahsulotni uning asosiy modda guruhi bilan moslashting: kartoshka",["Vitamin","Uglevod","Yog'","Oqsil"],1,"Kartoshka — asosan kraxmal, ya'ni uglevod."],["Tuxum oqi asosan nimaga boy?",["Yog'","Oqsil","Suv","Uglevod"],1,"Tuxum oqi — toza oqsil namunasi."],["Apelsin asosan qaysi mikroelement manbai?",["Yog'","Kalsiy","Vitamin C","Kraxmal"],2,"Sitruslar vitamin C ga boy."],["Sur'ya (yog') organizmda asosan nima uchun kerak?",["Suv saqlash","Uzoq muddatli energiya zaxirasi","Oksigen tashish","Oqsil qurilishi"],1,"Yog' — energiya zaxirasi va issiqlik izolatsiyasi."]],"task":{"q":"Oilangning bir kunlik ratsionini yozib chiqing va uni to'rt guruhga ajrating: oqsillar, yog'lar, uglevodlar, vitamin/mineral mahsulotlari. Har guruh uchun ustunli diagramma tuzing va muvozanatni baholang.","a":"Diagrammada uglevod ustuni eng baland, oqsil va yog' taxminan teng bo'lishi kerak; bitta guruhlarning butunlay yo'qligi — muvozanat buzilganligi belgisi.","why":"Ma'lumotni jadvalga yig'ish va diagrammaga aylantirish — tadqiqotchilik ko'nikmalaridan biri; natija esa ratsion haqidagi xulosani tekshirishga imkon beradi.","steps":["Eslatma: nonushta, tushlik, kechki ovqat va oraliq taomlarni yozing","Har bir mahsulotni guruhga ajrating (aralash mahsulotda asosiy qismni oling)","Jadval tuzing: guruh — miqdor (g yoki ml)","Ustunli diagramma chizing, o'qlarga nom va birlik yozing","Xulosa: qaysi guruh yetishmayapti, nima taklif qilasiz?"],"jihoz":["Daftar va qalam","Oilaviy ratsion yozuvi","Millimetr qog'oz yoki diagramma uchun jadval"],"xavfsizlik":["Mahsulotlarni og'iz orqali tekshirish kerak emas — yozuv va ma'lumot bilan ishlang","Allergiya bo'lgan mahsulotni belgilab qo'ying"]},"act":{"type":"lab","name":"ratsion","mode":"tarviya"},"kitob":{"bobNomi":"Ovqat hazm qilish sistemasi","bet":4,"oralig":"4–13","kod":"1.1","amaliyIsh":{"kod":"1.1","nomi":"Oilamning ovqat ratsioni","bet":1},"boshqotirma":5,"bilimlarXaritasi":6,"takrorlash":7,"mustahkamlash":10},"urinish":{"savollar":["Muvozanatlashgan ratsion nima?"],"qism_mavzular":[],"konikmalar":["jadval va ustunli diagrammadan foydalanib tadqiqot natijalarini izohlash;","turli ma’lumot manbalaridan olingan dalillardan foydalanib savollarga javob berish;","kuzatishlar asosida obyektlarni tasniflash;","modelda o‘rganilayotgan obyektning asosiy xususiyatlari aks etishini anglash;","ilmiy tushunchani tasvirlashda modeldan foydalanish."],"tatbiq":[]}},{"d":1,"c":2,"kod":"1.2","t":"Ovqat hazm qilish sistemasi","chorak":1,"lab":"hazm","labMode":"oqim","labTitle":"","theory":"Hazm qilish — murakkab oziq moddalarni hujayra singdira oladigan kichik molekulalarga aylantirish jarayoni. Jarayon ovqat hazm qilish kanalida sodir bo'ladi va ikki xil ta'sir aralash ishlaydi: mexanik (chaqnash, ezish, siljitish) va kimyoviy (fermentlar).\n\nKanal bo'limlari: og'iz → yutqoq → qizilo'ngach → oshqozon → ingichka ichak → qo'lloq ichak → to'g'ri ichak → davomchi ichak.\n\nOg'izda tishlar ovqatni maydalaydi, tupurik uni namlaydi va amilaza kraxmalni parchalashni boshlaydi. Qizilo'ngachda mushaklar to'lqinli qisqarish (peristaltika) ovqatni pastga suradi. Oshqozonda shira va xlorid kislotasi oqsilni parchalaydi, ezish orqali chimildiq hosil bo'ladi.\n\nIngichka ichakda asosiy hazm va singdirish bo'ladi: o't yog'ni maydalaydi (emulsiya qiladi), oshqozonosti bezi shirasi fermentlarni yetkazadi, ichak devoridagi mayda o'sintilar — villinlar tayyor moddalarni qonga o'tkazadi. Qo'lloq ichakda suv va mineral moddalar singdiriladi, qoldiq qism to'g'ri ichakka o'tadi.\n\nHayvonlarda ham shu prinsip ishlaydi: sigirning ko'p bo'lmali o'simlik tolalarini parchalashga, yirtqichning qisqa kanali esa oqsilga moslashgan. Shu o'xshashlik va farqlarni solishtirish — mavzuning ikkinchi yarimi.","formulas":["Hazm = mexanik + kimyoviy ta'sir","Kanal: og'iz → yutqoq → qizilo'ngach → oshqozon → ingichka ichak → qo'lloq ichak → to'g'ri ichak","Amilaza — kraxmalni parchalaydi (og'izda boshlanadi)","Oshqozon shirasi + xlorid kislotasi — oqsilni parchalaydi","O't — yog'ni maydalaydi (emulsiya), ferment emas","Singdirish asosan ingichka ichakdagi villinlarda"],"vocab":[{"w":"Ferment","m":"bir moddani ikkinchisiga aylantiruvchi oqsil"},{"w":"Peristaltika","m":"kanal devoridagi to'lqinli mushak qisqarishi"},{"w":"Chimildiq","m":"oshqozonda hosil bo'ladigan yarim suyuq ovqat aralashmasi"},{"w":"Villin","m":"ichak devoridagi singdirish maydonini oshiruvchi chiqit"},{"w":"Emulsiya","m":"yog'ning mayda tomchilarga bo'linishi"},{"w":"Oshqozonosti bezi","m":"hazm fermentlari va natriy bikarbonatini ichakka quyadigan bez"}],"quiz":[["Hazm jarayonining asosiy qismi qayerda sodir bo'ladi?",["Og'izda","Qo'lloq ichakda","Ingichka ichakda","Oshqozonda"],2,"Parchalash og'iz va oshqozonda boshlanadi, asosiy hazm va singdirish esa ingichka ichakda."],["Tishlarning vazifasi qaysi turdagi ta'sirga kiradi?",["Biologik","Kimyoviy","Mexanik","Elektr"],2,"Maydalash — fizik (mexanik) ta'sir; fermentlar esa kimyoviy."],["O'tning hazmdagi roli nimada?",["Oqsilni parchalaydi","Qonni tozalaydi","Yog'ni maydalaydi (emulsiya)","Kraxmalni parchalaydi"],2,"O't ferment emas; u yog'ni mayda tomchilarga bo'lib, fermentlar ishini osonlashtiradi."],["Kraxmal parchalanishi qayerda boshlanadi?",["Yutqoqda","To'g'ri ichakda","Og'izda","Oshqozonda"],2,"Tupurikdagi amilaza kraxmalni og'izda parchalashni boshlaydi."],["Qo'lloq ichakda asosan nima sodir bo'ladi?",["Yog' emulsiyalanadi","Ovqat chaynaldi","Suv va mineral moddalar singdiriladi","Oqsil parchalanadi"],2,"Qoldiqdan suvni qaytarib olish — suvsizlanishning oldini oladi."]],"slideQuiz":[["Oshqozon devoridagi mushaklar ovqatni qanday siljitadi?",["Peristaltika to'lqini bilan","Tortishish kuchi bilan","Elon yordamida","Faqat og'irlik bilan"],0,"Mushaklar ketma-ket qisqarib ovqatni oldinga suradi."],["Villinlarning asosiy vazifasi — nima?",["Kislota ishlab chiqarish","Ovqatni maydalash","Ferment saqlash","Singdirish yuzasini oshirish"],3,"Ko'p sonli chiqitlar yuzani bir necha barobar kattalashtiradi."]],"game":[["Bo'limni vazifasi bilan moslashting: oshqozon",["O't ishlab chiqarish","Oqsilni parchalash va chimildiq hosil qilish","Kraxmalni to'liq parchalash","Suvni qaytarish"],1,"Oshqozonda oqsil parchalanadi va mexanik ezish bo'ladi."],["Yirtqichlarda o'simxo'rlarga qaraganda hazm kanali qanday?",["Ancha uzunroq","Qisqaroq","Bir xil","Umuman yo'q"],1,"O'simlik tolasi qiyin hazm bo'ladi — shuning uchun o'simxo'rlarda kanal uzun va ko'p bo'lmali."],["Qaysi organ o'tni saqlaydi?",["Oshqozonosti bezi","Buyrak","O't pufagi","Jigar"],2,"O't jigarda hosil bo'ladi, o't pufagida saqlanadi."]],"gameQuiz":[["Bo'limni vazifasi bilan moslashting: oshqozon",["O't ishlab chiqarish","Oqsilni parchalash va chimildiq hosil qilish","Kraxmalni to'liq parchalash","Suvni qaytarish"],1,"Oshqozonda oqsil parchalanadi va mexanik ezish bo'ladi."],["Yirtqichlarda o'simxo'rlarga qaraganda hazm kanali qanday?",["Ancha uzunroq","Qisqaroq","Bir xil","Umuman yo'q"],1,"O'simlik tolasi qiyin hazm bo'ladi — shuning uchun o'simxo'rlarda kanal uzun va ko'p bo'lmali."],["Qaysi organ o'tni saqlaydi?",["Oshqozonosti bezi","Buyrak","O't pufagi","Jigar"],2,"O't jigarda hosil bo'ladi, o't pufagida saqlanadi."]],"task":{"q":"Ovqat hazm qilish sistemasi modelini tayyorlang (shisha, naycha, rezina pufak, moyli qog'oz) va modelda kanallar bo'ylab ovqat harakatini hamda emulsiyani ko'rsating.","a":"Model: shisha butilka — oshqozon, ichidagi suyuqlik — shira; naycha orqali «ovqat» pastga tushadi; moyli qog'oz yog'ni ushlab qoladi, suv esa o'tadi — emulsiya va singdirish farqi.","why":"Model haqiqiy tizimni soddalashtiradi: uning qaysi qismi nimani ifodalashini aniq yozish kerak, chunki modelning chegaralarini bilish ham tadqiqotchilik ko'nikmasi.","steps":["Materiallar ro'yxatini tuzing va xavfsizlikni belgilang","Har bir qism nimani ifodalashini yozing (kalit)","Harakatni ko'rsatish: naycha orqali mayda zarra pastga tushadi","Emulsiyani sinab ko'ring: suv + moy, sovun tomizing va aralashtiring","Modelning kamchiliklarini yozing (narsani o'lchamaydi, fermentlarni ko'rsatmaydi)"],"jihoz":["Shisha butilka (0,5 l)","Silikon naycha (30 sm)","Rezina pufak yoki qo'lqop","O'simlik yog'i, suv, sovun","Moyga chidamli qog'oz"],"xavfsizlik":["Shishani ehtiyot qiling — sinishda ustozga xabar bering","Sovun suyuqligini og'izga olib bo'lmaydi","Ish oxirida qo'l yuviladi"]},"act":{"type":"lab","name":"hazm","mode":"oqim"},"kitob":{"bobNomi":"Ovqat hazm qilish sistemasi","bet":4,"oralig":"4–13","kod":"1.2","amaliyIsh":{"kod":"1.2","nomi":"Ovqat hazm qilish sistemasi modelini tayyorlash","bet":3},"boshqotirma":5,"bilimlarXaritasi":6,"takrorlash":7,"mustahkamlash":10},"urinish":{"savollar":["Ovqat qanday hazm bo‘ladi?","Hayvonlarning ovqat hazm qilish sistemasi o‘xshash tuzilganmi?"],"qism_mavzular":[],"konikmalar":["jadval va ustunli diagrammadan foydalanib tadqiqot natijalarini izohlash;","turli ma’lumot manbalaridan olingan dalillardan foydalanib savollarga javob berish;","kuzatishlar asosida obyektlarni tasniflash;","modelda o‘rganilayotgan obyektning asosiy xususiyatlari aks etishini anglash;","ilmiy tushunchani tasvirlashda modeldan foydalanish."],"tatbiq":[]}},{"d":2,"c":1,"kod":"2.1","t":"Nafas sistemasi","chorak":1,"lab":"nafas","labMode":"diaphragma","labTitle":"","theory":"Nafas olish — organizmning kislorod olib, uglerod (IV) oksidini chiqarib yuborish jarayoni. Asosiy maqsad — hujayralarda energiya olish ( nafas zanjiri ) uchun kislorod yetkazish.\n\nNafas yo'li: burun → halqum → yutqich (halqum) → traxeya → bronxlar → bronxiolalar → o'pka pufakchalari (alveolalar). Burun havoni isitadi, namlaydi va changdan tozalaydi; traxeyaning ichki qavariq halqalari uni ochiq saqlaydi, siljituvchi tukchalar esa changni yuqoriga chiqaradi.\n\nO'pka pufakchalari bilan qon tomirlari bir-biriga yaqin o'ralgan — shu yerda gaz almashinuvi bo'ladi: kislorod qonga, uglerod (IV) oksidi esa qondan havoga o'tadi. Bu almashinuv diffuziya — moddaning ko'p joydan kam joyga tarqalishi — orqali sodir bo'ladi, maxsus energiya sarflanmaydi.\n\nNafas olish mexaniki: diyafragma qisqarib pastga tushadi, ko'krak qafasi kengayadi, o'pka ichida bosim kamayadi va havo kiradi (nafas olish). Diyafragma bo'shashib ko'tarilganda — teskari jarayon, havo chiqadi (nafas chiqarish). Modelda shu ikki harakatni ko'rish mumkin.\n\nUmurtqali hayvonlarda nafas organlari turlicha: baliqlarda jabralar (suvda erigan kislorod), qushlarda o'pka + havo qopchalari, sut emizuvchilarda o'pka, suvda-yuruvchilarda teri orqali qo'shimcha nafas.","formulas":["Nafas olish: diyafragma pastga → hajm ↑ → bosim ↓ → havo kiradi","Nafas chiqarish: diyafragma yuqoriga → hajm ↓ → bosim ↑ → havo chiqadi","Gaz almashinuvi = diffuziya (ko'p → kam)","Alveola — qon va havo o'rtasidagi yupqa to'siq","Yetishmovchilik: kislorod ↓ → energiya olish sekinlashadi","Katta o'lchamli hayvonlarda nafas chastotasi kamroq"],"vocab":[{"w":"Alveola","m":"o'pkadagi gaz almashinuvi bo'ladigan havo pufakchasi"},{"w":"Diyafragma","m":"ko'pir kafasi bilan qorin bo'shlig'ini ajratuvchi mushak"},{"w":"Diffuziya","m":"moddaning ko'p konsentratsiyali joydan kam joyga tarqalishi"},{"w":"Bronx","m":"traxeyadan o'pkaga havo olib boruvchi yo'l"},{"w":"Jabra","m":"suvda erigan kislorodni olish organi"},{"w":"Nafas chastotasi","m":"bir daqiqadagi nafas olish soni"}],"quiz":[["Nafas olishda diyafragma qanday harakatlanadi?",["Qisqarib pastga tushadi","Chetga siljiydi","Harakatlanmaydi","Bo'shashib yuqoriga ko'tariladi"],0,"Pastga tushganda ko'pir kafasi kengayadi va havo kiradi."],["O'pka pufakchalarida gaz almashinuvi qanday yo'l bilan bo'ladi?",["Diffuziya orqali","Faol tashish orqali","Mushak qisqarishi orqali","Osmos yordamida"],0,"Kislorod va uglerod (IV) oksidi konsentratsiya farqi hisobiga o'tadi."],["Traxeyaning qavariq halqalarining vazifasi nima?",["Nafas yo'lini ochiq saqlash","Havoni isitish","Qon aylanishini tezlashtirish","Ovoz chiqarish"],0,"Halqalar yumshoq devor yopilib qolishiga yo'l qo'ymaydi."],["Baliqlar kislorodni qayerdan oladi?",["O'pka orqali","Og'iz bo'shlig'idan","Suvda erigan kislorodni jabra orqali","Havodan teri orqali"],2,"Jabrada suv oqimi bilan qon oqimi qarama-qarshi harakatlanadi — almashinuv samarali."],["Bir daqiqada nafas soni eng ko'p bo'lgan hayvon qaysi?",["Sichqon","Fil","Timsoh","Ot"],0,"Kichik tanali hayvonlarda moddalar almashinuvi tez — nafas chastotasi yuqori."]],"slideQuiz":[["Qushlarda nafas samaradorligini oshiradigan qo'shimcha organ — nima?",["Buron kavaki","Havo qopchalari","Jabra","Teri nafas"],1,"Havo qopchalari uchishda qo'shimcha kislorod zaxirasini beradi."],["Nafas chiqarishda o'pka ichidagi bosim qanday o'zgaradi?",["Kamayadi","Ortadi","Nolga tushadi","O'zgarmaydi"],1,"Bosim ortganda havo tashqariga chiqadi."]],"game":[["Bo'limni vazifasi bilan moslashting: burun bo'shlig'i",["Havoni siqish","Havoni isitish, namlash, tozalash","Ovoz chiqarish","Gaz almashinuvi"],1,"Burun — nafas havosini tayyorlovchi «filtr»."],["Qaysi organ o'pka pufakchalari bilan qamrab olingan?",["Limfa tomirlari","Siydik yo'llari","Nerv tolalari","Qon kapillyarlari"],3,"Kapillyar to'ri gaz almashinuvini ta'minlaydi."],["Suvda-yuruvchilarda (qurbaqa) qo'shimcha nafas organi — nima?",["Havo qopchasi","Teri","O'pka pufakchasi yo'q","Jabra"],1,"Yupqa, nam teri orqali ham gaz almashinuvadi."]],"gameQuiz":[["Bo'limni vazifasi bilan moslashting: burun bo'shlig'i",["Havoni siqish","Havoni isitish, namlash, tozalash","Ovoz chiqarish","Gaz almashinuvi"],1,"Burun — nafas havosini tayyorlovchi «filtr»."],["Qaysi organ o'pka pufakchalari bilan qamrab olingan?",["Limfa tomirlari","Siydik yo'llari","Nerv tolalari","Qon kapillyarlari"],3,"Kapillyar to'ri gaz almashinuvini ta'minlaydi."],["Suvda-yuruvchilarda (qurbaqa) qo'shimcha nafas organi — nima?",["Havo qopchasi","Teri","O'pka pufakchasi yo'q","Jabra"],1,"Yupqa, nam teri orqali ham gaz almashinuvadi."]],"task":{"q":"Nafas sistemasi modelini tayyorlang (shisha, ikki shamol o'tkazgich (ventilyator), rezina plyonka) va diyafragma harakatini o'zgartirib nafas olish/chiqarishni kuzating. Natijani jadvalga yozing.","a":"Plyonka pastga tortilganda — shamol o'tkazgich (ventilyator)lar shishadi (nafas olish), qo'yib yuborilganda — yopiladi va havo chiqadi. Plyonkani qanchalik pastga tortsangiz, havo shuncha ko'p kiradi.","why":"Model nafas mexanikasini ko'rsatadi, ammo qon aylanishini va diffuziyani ko'rsata olmaydi — chegarasini tushuntirish ham topshiriqning bir qismi.","steps":["Ikki shamol o'tkazgich (ventilyator)ni naycha orqali ulang va shisha ichiga joylang","Shisha og'zini rezina plyonka (yoki qo'lqop barmog'i) bilan tortib mahkamlang","Plyonkani pastga torting — shamol o'tkazgich (ventilyator)lar holatini yozing","Qo'yib yuboring — teskari holatni yozing","Xulosa: hajm va bosim qanday bog'langan? Model nimani ko'rsata olmaydi?"],"jihoz":["Shisha butilka (1 l)","2 shamol o'tkazgich (ventilyator) (yoki pufak)","Rezina plyonka / qo'lqop","Naycha va lenta"],"xavfsizlik":["Shishaga bosim bilan ishlaganda ehtiyot bo'ling","Modeldan keyin qo'l yuviladi"]},"act":{"type":"lab","name":"nafas","mode":"diaphragma"},"kitob":{"bobNomi":"Nafas va qon aylanish sistemalari","bet":14,"oralig":"14–31","kod":"2.1","amaliyIsh":{"kod":"2.1","nomi":"Nafas olish va nafas chiqarish","bet":12},"boshqotirma":20,"bilimlarXaritasi":21,"takrorlash":22,"mustahkamlash":26},"urinish":{"savollar":["Nafas sistemasi qanday funksiyani bajaradi?","Biz qanday nafas olamiz va chiqaramiz?","Umurtqali hayvonlarning nafas sistemasi qanday tuzilgan?"],"qism_mavzular":[],"konikmalar":["ilmiy hodisani tasvirlash va izohlashda modeldan foydalanish;","ilmiy hodisani tushunishda modelning ahamiyatini bayon etish;","tadqiqotni yaxshilash yuzasidan taklif berish va uni izohlash;","o‘lchash natijalarini taqdim etish uchun jadval tuzish;","ishonchli natijalar olish uchun o‘lchashlarni takrorlash zarurligi yuzasidan qaror qabul qilish;","tadqiqot natijalaridagi qonuniyatni bayon etish hamda kutilmagan natijalarni aniqlash;","turli ma’lumot manbalaridan olingan dalillardan foydalanib savollarga javob berish;","nuqtali diagrammadan foydalanib tadqiqot natijalarini izohlash."],"tatbiq":["ilmiy bilimlar vaqt o‘tishi bilan o‘zgarishini ko‘rsatish uchun to‘plangan dalillardan foydalanish;","bahs-munozarada o‘z nuqtayi nazarini ilmiy dalillardan foydalanib asoslash."]}},{"d":2,"c":2,"kod":"2.2","t":"Qon aylanish sistemasi","chorak":1,"lab":"puls","labMode":"chastota","labTitle":"","theory":"Qon aylanish sistemasi — moddalarni tana bo'ylab tashuvchi yopiq yo'l. Vazifalari: kislorod va oziq moddalarni hujayralarga yetkazish, parchalanish mahsulotlarini chiqarish, haroratni va organizm ichki muhitini barqaror saqlash.\n\nOrganlar: yurak — mushakli nasos; tomirlar — arteriyalar (yurakdan olib chiqadi, qalin devor, bosim yuqori), venalar (yurakka keltiradi, ichki qopqoqchalari bor), kapillyarlar (gaz va modda almashinuvi shu yerda, devori bir qavatli).\n\nYurak to'rt bo'lmali: ikki qovoqcha, ikki qorincha. O'ng tomon — venoz (kislorodsiz) qonni o'pka aylanishiga, chap tomon — arteriyal (kislorodga boy) qonni katta aylanishga haydaydi. Qon bosimi va puls — yurak qisqarishlarining tomirdagi to'lqini.\n\nPulsni hisoblash — o'lchash ishi: tinch holatda, yugurgandan keyin, tik turib va o'tirganda. Ma'lumot jadvalga yoziladi, o'rtacha qiymat hisoblanadi, ustunli diagramma bilan taqqoslanadi. Shu usul bilan «jismoniy mashq → puls chastotasi» bog'lanishini ishonchli tekshirish mumkin.\n\nUmurtqali hayvonlarda yurak tuzilishi evolyutsiya bo'yicha murakkablashadi: baliqda ikki bo'lakli, suvda-yuruvchilarda uch bo'lmali, sut emizuvchilarda to'rt bo'lmali. To'rt bo'lmali yurakda arteriya va venoz qon aralashmaydi — issiqqonlilikning bir sababi.","formulas":["Yurak = 2 qovoqcha + 2 qorincha","Katta aylanish: chap qorincha → aorta → organlar → vena kovaki → o'ng qovoqcha","Kichik (o'pka) aylanish: o'ng qorincha → o'pka arteriyasi → o'pka → o'pka venalari → chap qovoqcha","Puls = bir daqiqadagi yurak qisqarishlari soni","Arteriya — yurakdan; vena — yurakka; kapillyar — almashinuv","Jadval → o'rtacha qiymat → diagramma (ma'lumot ishlash tartibi)"],"vocab":[{"w":"Arteriya","m":"yurakdan qonni olib chiquvchi qalin devorli tomir"},{"w":"Vena","m":"qonni yurakka qaytaruvchi, ichida qopqoqcha bor tomir"},{"w":"Kapillyar","m":"eng mayda tomir; gaz va modda almashinuvi shu yerda"},{"w":"Puls","m":"yurak qisqarishi natijasida arteriya devorining tebranishi"},{"w":"Qon bosimi","m":"qonning tomir devoriga tushiradigan bosimi"},{"w":"Qovoqcha","m":"qonni qorinchaga quyuvchi yurak bo'lagi"}],"quiz":[["Qonni yurakdan olib chiqadigan tomirlar qanday ataladi?",["Venalar","Arteriyalar","Kapillyarlar","Limfomatik yo'llar"],1,"Arteriya — yurakdan; vena — yurakka olib keladi."],["Gaz va modda almashinuvi qaysi tomirlarda bo'ladi?",["Yirik venalarda","Qovoqchalarda","Aortada","Kapillyarlarda"],3,"Kapillyar devori bir qavatli — almashinuv shu yerda qulay."],["Chap qorincha qonni qayerga haydaydi?",["Yurak mushagiga","Buyrakka","Faqat o'pkaga","Katta aylanishga (butun tanaga)"],3,"Chap qorincha — eng qalin devorli bo'lim, aorta orqali tanani ta'minlaydi."],["O'ng qovoqchaga qanday qon keladi?",["Aralashgan","Venoz (kislorodsiz)","Qon kelmaydi","Arteriyal (kislorodga boy)"],1,"O'ng tomon venoz qonni o'pka aylanishiga yuboradi."],["Yugurgandan keyin puls chastotasi qanday o'zgaradi va nima uchun?",["Ortadi — mushaklarga ko'proq kislorod kerak","O'zgarmaydi","Kamayadi — yurak charchaydi","Avval ortadi, keyin to'xtaydi"],0,"Zaryad ortganda energiya ehtiyoji oshadi — yurak tezroq ishlaydi."]],"slideQuiz":[["Vena ichidagi qopqoqchalarning vazifasi nima?",["Bosimni oshiradi","Qonning orqaga qaytishining oldini oladi","Qonni tozalaydi","Kislorod qo'shadi"],1,"Qopqoqchalar venoz qonni yurak tomon harakatlantirishga yordam beradi."],["To'rt bo'lmali yurak nima afzallik beradi?",["Puls kamayadi","Qon sekinroq harakatlanadi","Yurak kichik bo'ladi","Arteriya va venoz qon aralashmaydi"],3,"Ikki qismning ajralishi issiqqonlilik va faol hayot tarzi uchun muhim."]],"game":[["Hayvonni yurak bo'lmalar soni bilan moslashting: baliq",["4 bo'lmali","3 bo'lmali","Yurak yo'q","2 bo'lmali"],3,"Baliq yuragi — bitta qovoqcha va bitta qorincha."],["Umurtqali hayvonlar ichida yuragi uch bo'lmali bo'lgani kim?",["Dovdayuq","Baliq","It","Timsoh"],0,"Dovdayuqda ikki qovoqcha va bitta qorincha — qon qisman aralashadi."],["Bir daqiqada eng ko'p qisqaradigan yurak kimga xos?",["Sichqonga","Otga","Timsohga","Itga"],0,"Kichik hayvonlarda moddalar almashinuvi tez — yurak ham tez ishlaydi."]],"gameQuiz":[["Hayvonni yurak bo'lmalar soni bilan moslashting: baliq",["4 bo'lmali","3 bo'lmali","Yurak yo'q","2 bo'lmali"],3,"Baliq yuragi — bitta qovoqcha va bitta qorincha."],["Umurtqali hayvonlar ichida yuragi uch bo'lmali bo'lgani kim?",["Dovdayuq","Baliq","It","Timsoh"],0,"Dovdayuqda ikki qovoqcha va bitta qorincha — qon qisman aralashadi."],["Bir daqiqada eng ko'p qisqaradigan yurak kimga xos?",["Sichqonga","Otga","Timsohga","Itga"],0,"Kichik hayvonlarda moddalar almashinuvi tez — yurak ham tez ishlaydi."]],"task":{"q":"Jismoniy mashqlar yurak qisqarishlari chastotasiga qanday ta'sir etadi? Uch holatda (tinch, 20 sekonda 20 marta o'tirib-turish, 1 daqiqa yugurish) pulsni o'lchang, jadval tuzing va xulosa qiling.","a":"Har bir holatda puls ortadi; eng katta ortish yugurishdan keyin. Tiklanish vaqti qisqargan o'quvchida yurak chidimliroq ishlaydi.","why":"O'zgartiriladigan omil (harakat turi) va o'lchanadigan natija (puls) aniq bo'lsa, qonuniyat ishonchli chiqadi. Takroriy o'lchash tasodifiy xatolikni kamaytiradi.","steps":["5 daqiqa o'tirib dam oling — 1 daqiqa puls sanang (buni «nazorat» deb belgilang)","20 marta o'tirib-turing, darhol puls sanang","1 daqiqa joyda yuguring, 1 daqiqadan keyin puls sanang","Uch natijani jadvalga yozing; imkon bo'lsa 2 marta takrorlang va o'rtacha qiymatni hisoblang","Ustunli diagramma chizing va xulosa: bog'lanish qanday?"],"jihoz":["Sekundomer (telefon soati)","Daftar jadval uchun","Tinch xona"],"xavfsizlik":["Yurak kasalligi bo'lsa, yuklama qilmang — ustoz bilan suhbat qiling","O'zingizni yomon his qilsangiz mashg'ulotni to'xtating","Pulsni bo'yin tomirida emas, bilakda oling va bosib turmang"]},"act":{"type":"lab","name":"puls","mode":"chastota"},"kitob":{"bobNomi":"Nafas va qon aylanish sistemalari","bet":14,"oralig":"14–31","kod":"2.2","amaliyIsh":{"kod":"2.2","nomi":"Nafas sistemasi modelini tayyorlash","bet":14},"boshqotirma":20,"bilimlarXaritasi":21,"takrorlash":22,"mustahkamlash":26},"urinish":{"savollar":["Qon aylanish sistemasi qanday funksiyani bajaradi?","Tanamiz bo‘ylab qon qanday harakatlanadi?","Umurtqali hayvonlarning qon aylanish sistemasi qanday tuzilgan?"],"qism_mavzular":[],"konikmalar":["ilmiy hodisani tasvirlash va izohlashda modeldan foydalanish;","ilmiy hodisani tushunishda modelning ahamiyatini bayon etish;","tadqiqotni yaxshilash yuzasidan taklif berish va uni izohlash;","o‘lchash natijalarini taqdim etish uchun jadval tuzish;","ishonchli natijalar olish uchun o‘lchashlarni takrorlash zarurligi yuzasidan qaror qabul qilish;","tadqiqot natijalaridagi qonuniyatni bayon etish hamda kutilmagan natijalarni aniqlash;","turli ma’lumot manbalaridan olingan dalillardan foydalanib savollarga javob berish;","nuqtali diagrammadan foydalanib tadqiqot natijalarini izohlash."],"tatbiq":["ilmiy bilimlar vaqt o‘tishi bilan o‘zgarishini ko‘rsatish uchun to‘plangan dalillardan foydalanish;","bahs-munozarada o‘z nuqtayi nazarini ilmiy dalillardan foydalanib asoslash."]}},{"d":3,"c":1,"kod":"3.1","t":"Yuqumli kasalliklar","chorak":1,"lab":"mikrob","labMode":"tarqalish","labTitle":"","theory":"Kasallik — organizmning barqaror ishlashi buzilgan holat. Sabablari ikki guruhga bo'linadi: yuqumli (tashqi ajan — mikrob kiradi) va yuqumsiz (ovqatlanish, irsiyat, muhit, turmush tarzi).\n\nYuqumli kasalliklarning qo'zg'atuvchilari:\n— bakteriyalar — bir hujayrali, hujayra devori bor, ko'pincha bo'linib ko'payadi;\n— viruslar — hujayra tuzilishiga ega emas, faqat tirik hujayra ichida ko'payadi;\n— zamburug'lar va oddiy hayvonlar (parasitlar) ham kasallik keltirib chiqarishi mumkin.\n\nYuqumli kasallik tarqalishining uch bo'g'ini bor: manba (kasal organizm yoki sauguvchi) → uzatish yo'li → kirish eshigi (teri, nafas yo'llari, ovqat hazm kanali, ko'z shilliq qavati). Uch bo'g'in birga bo'lmasa, kasallik yuqmaydi — shuning uchun oldini olish ham shu bo'g'inlardan birini uzish orqali qilinadi.\n\nUzatish yo'llari: havo-tomchi (asirish, yo'tal), ovqat va suv, aloqa (qo'l, buyum), qon so'ruvchi hasharotlar, jinsiy yo'l. Pufakchi tajribasida asirilganda tomchilar qanchalik uzoqqa tarqalishi ko'rinadi — bu havo-tomchi yo'lining namoyishi.\n\nMikroblar uchun qulay sharoit: namlik, iliq harorat, oziqa. Shu sababli shaxsiy gigiyena, ovqatni to'g'ri saqlash va toza suv — kasalliklarning oldini olishning eng arzon va samarali choralari.","formulas":["Kasallik = yuqumli + yuqumsiz sabablar","Virus — hujayrasiz, faqat tirik hujayrada ko'payadi","Bakteriya — bir hujayrali, bo'linib ko'payadi","Yuqumli kasallikning 3 bo'g'ini: manba → uzatish yo'li → kirish eshigi","Bo'g'inlarni birini uzsa — yuqish to'xtaydi","Mikrob uchun qulay: namlik + iliq harorat + oziqa"],"vocab":[{"w":"Infeksiya","m":"mikrobning organizmga kirib ko'payishi"},{"w":"Qo'zg'atuvchi","m":"kasallik keltirib chiqaradigan organizm"},{"w":"Saug'uvchi","m":"mikrobni o'zida saqlaydigan, ammo kasal bo'lmagan organizm"},{"w":"Epidemiya","m":"kasallikning keng tarqalishi"},{"w":"Karantin","m":"aloqani cheklash orqali tarqalishni to'xtatish"},{"w":"Gigiyena","m":"salomatlikni saqlash qoidalari"}],"quiz":[["Viruslarning bakteriyadan asosiy farqi nimada?",["Ancha katta bo'ladi","Hujayra devoriga ega","Antibiotikdan o'ladi","Faqat tirik hujayra ichida ko'payadi"],3,"Virus — hujayrasiz tuzilish; mustaqil ko'pala olmaydi."],["Yuqumli kasallik tarqalishining birinchi bo'g'ini qaysi?",["Immun javobi","Davolash","Manba","Kirish eshigi"],2,"Manba → uzatish yo'li → kirish eshigi tartibida ko'rib chiqiladi."],["Sovuq urishida kasallik asosan qanday yo'l bilan yuqadi?",["O'simlik orqali","Havo-tomchi","Qon orqali","Teri orqali"],1,"Asirish va yo'tal paytida tomchilar havoga tarqaladi."],["Qaysi chora kasallikning yuqishini to'xtatishga yordam bermaydi?",["Ovqatni to'g'ri saqlash","Qo'lni yuvish","Xonani shamollatish","Mikrobni o'ldiruvchi vitamin ichish"],3,"Gigiyena choralari uzatish yo'lini uzadi; «mirakul vitamin» esa ishonchsiz ma'lumot."],["Mikroblar eng tez qanday sharoitda ko'payadi?",["Muzlagan holda","Yorug' joyda","Quruq va sovuq joyda","Iliq va nam joyda"],3,"Namlik, iliq harorat va oziqa — ko'payish uchun uch sharoit."]],"slideQuiz":[["Karantin qaysi bo'g'inni uzadi?",["Immun tizimini","Manbani","Uzatish yo'lini (aloqani)","Kirish eshigini"],2,"Aloqa cheklansa, mikrob yangi organizmga o'ta olmaydi."],["Antibiotiklar qaysi qo'zg'atuvchiga ta'sir qiladi?",["Hech qaysi
