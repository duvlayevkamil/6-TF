      { k: "mat", label: "Material (0..5): " + MATERIALLAR.map((m) => m.k).join(", "), min: 0, max: 5, step: 1 },
      { k: "massa", label: "Namuna massasi", min: 20, max: 600, step: 10, unit: " g" },
      { k: "suyuq", label: "Suyuqlik: 0 suv · 1 tuzli suv · 2 spirt", min: 0, max: 2, step: 1 },
    ],
    readouts: [
      { k: "hajm", label: "Hajm", unit: "sm³" },
      { k: "rho", label: "Zichlik", unit: "g/sm³" },
      { k: "suzish", label: "Suvda" },
      { k: "otkaz", label: "O‘tkazuvchanlik" },
    ],
    compute(st) {
      const m = MATERIALLAR[st.mat | 0] || MATERIALLAR[0];
      const rhoSuv = [1, 1.2, 0.79][st.suyuq];
      const hajm = st.massa / m.rho;
      const suzadi = m.rho < rhoSuv;
      return {
        hajm,
        rho: m.rho,
        suzish: suzadi ? "suzadi" : "cho‘kadi",
        otkaz: m.issiq >= 4 ? `issiqlik ↑↑ · tok ↑↑` : "issiqlik ↓ · tok ↓",
        rhoSuv,
        mat: m,
      };
    },
    svg(st, r) {
      const m = r.mat;
      const bars = barChart(
        [
          { k: "issiqlik", v: m.issiq, color: "#ff7a7a", label: m.issiq + "/5" },
          { k: "elektr", v: m.elektr, color: "#5fd9d0", label: m.elektr + "/5" },
          { k: "qattiqlik", v: m.qattiq + 1, color: "#b18cff", label: m.qattiq + 1 + "/5" },
          { k: "zichlik", v: m.rho, color: "#ffb347", label: nf(m.rho, 1) },
        ],
        { x: 40, y: 250, w: 290, h: 180 }
      );
      const tankX = 420, tankY = 90, tankW = 180, tankH = 190;
      const objR = 20 + Math.sqrt(r.hajm) * 0.8;
      const objY = r.suzish === "suzadi" ? tankY + 55 : tankY + tankH - objR - 6;
      return svgBox(
        rect(tankX, tankY, tankW, tankH, { fill: ["#12314f", "#123f4a", "#33244f"][st.suyuq], stroke: "#33507f", r: 6 }) +
        line(tankX, tankY + 26, tankX + tankW, tankY + 26, { stroke: "#5fd9d0", sw: 1.4, dash: "5 4" }) +
        circle(tankX + tankW / 2, objY, objR, { fill: st.suyuq === 2 ? "#ffd7a1" : "#cfe0ff", stroke: "#ffb347", sw: 2, opacity: 0.95 }) +
        txt(tankX + tankW / 2, objY + 4, m.k, { anchor: "middle", size: 11, fill: "#26160a", weight: "bold" }) +
        txt(tankX + tankW / 2, tankY + tankH + 22, (["suv", "tuzli suv", "spirt"][st.suyuq]) + " ρ=" + nf(r.rhoSuv, 2), { anchor: "middle", size: 11, fill: "#93a4c4" }) +
        bars + txt(40, 60, m.k + " — " + nf(m.rho, 1) + " g/sm³ · " + nf(r.hajm, 0) + " sm³ · " + r.suzish, { size: 13, fill: "#ffb347", weight: "bold" }), "0 0 640 300"
      );
    },
  };
  const qaynash = {
    title: "Qizdirish, qaynash va bug‘lanish",
    hint: "Quvvat va massa — harorat egri chizig‘i va qaynash vaqti shundan hisoblanadi.",
    init: { quvvat: 800, massa: 200, suyuqlik: 0, qopqoq: 0 },
    controls: [
      { k: "quvvat", label: "Plitka quvvati (Vt)", min: 200, max: 2200, step: 50, unit: " Vt" },
      { k: "massa", label: "Suv massasi (g)", min: 50, max: 1000, step: 25, unit: " g" },
      { k: "suyuqlik", label: "Suyuqlik: 0 suv · 1 spirt", min: 0, max: 1, step: 1 },
      { k: "qopqoq", label: "Qopqoq (0/1)", min: 0, max: 1, step: 1 },
    ],
    readouts: [
      { k: "vaqt", label: "Qaynashgacha", unit: "min" },
      { k: "qaynash", label: "Qaynash harorati", unit: "°C" },
      { k: "bug", label: "Bug‘lanish" },
      { k: "energiya", label: "Kerak energiya", unit: "kJ" },
    ],
    compute(st) {
      const c = st.suyuqlik ? 2450 : 4200;
      const T0 = 20, Tb = st.suyuqlik ? 78 : 100;
      const E = (c * (st.massa / 1000) * (Tb - T0)) / 1000; // kJ
      const P = st.quvvat * (st.qopqoq ? 1.12 : 0.86);
      const vaqt = (E * 1000) / P / 60;
      return { vaqt, qaynash: Tb, bug: st.qopqoq ? "sekin (qopqoq ostida to‘planadi)" : "tez (ochiq yuza)", energiya: E };
    },
    svg(st, r) {
      const W = 520, H = 190, x0 = 60, y0 = 250;
      const c = st.suyuqlik ? 2450 : 4200;
      const P = st.quvvat * (st.qopqoq ? 1.12 : 0.86);
      const tMax = Math.max(0.5, r.vaqt * 1.4);
      const pts = [];
      for (let i = 0; i <= 60; i++) {
        const t = (i / 60) * tMax;
        const T = Math.min(r.qaynash, 20 + (P * t * 60) / (c * (st.massa / 1000)) / 1000);
        pts.push([x0 + (t / tMax) * W, y0 - ((T - 20) / 100) * H]);
      }
      const curve = path("M" + pts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L"), { stroke: "#ffb347", sw: 2.4 });
      const boil = line(x0, y0 - ((r.qaynash - 20) / 100) * H, x0 + W, y0 - ((r.qaynash - 20) / 100) * H, { stroke: "#ff7a7a", dash: "6 5", sw: 1.4 });
      const pot = rect(x0 - 4, y0 - 66, 96, 62, { fill: "#1d3a5c", stroke: "#93a4c4", r: 6 }) +
        rect(x0 - 14, y0 - 74, 116, 10, { fill: "#93a4c4", stroke: "none", r: 4 }) +
        (st.qopqoq ? path(`M${x0 - 18},${y0 - 78} Q${x0 + 44},${y0 - 108} ${x0 + 106},${y0 - 78}`, { stroke: "#5fd9d0", sw: 3 }) : "");
      let steam = "";
      for (let i = 0; i < 5; i++) {
        const sx = x0 + 6 + i * 20;
        steam += path(`M${sx},${y0 - 80} q6,-12 -2,-22 q-6,-10 2,-20`, { stroke: "#93a4c4", sw: 1.6, opacity: st.qopqoq ? 0.25 : 0.8 });
      }
      return svgBox(
        line(x0, y0, x0 + W, y0, { stroke: "#33507f" }) + line(x0, y0, x0, y0 - H, { stroke: "#33507f" }) +
        txt(24, 80, "°C", { size: 11, fill: "#93a4c4" }) + txt(x0 + W + 6, y0 + 4, "min", { size: 11, fill: "#93a4c4" }) +
        txt(x0 + W - 4, y0 - ((r.qaynash - 20) / 100) * H - 8, r.qaynash + "°C", { anchor: "end", size: 12, fill: "#ff7a7a" }) +
        boil + curve + pot + steam +
        txt(320, 34, "Qaynashgacha " + nf(r.vaqt, 1) + " min  ·  " + r.bug, { anchor: "middle", size: 13.5, fill: "#ffb347", weight: "bold" }), "0 0 640 300"
      );
    },
  };

  /* ---------- 9. O‘zgarish / fizik va kimyo ---------- */
  const ozgarish = {
    title: "Fizik yoki kimyoviy o‘zgarish?",
    hint: "Hodisani tanlang, belgilarni belgilang — tizim xulosani tekshiradi.",
    init: { hodisa: 0, rang: 0, gaz: 0, harorat: 0, qaytar: 0 },
    controls: [
      { k: "hodisa", label: "Hodisa: 0 muz erishi · 1 sham yonishi · 2 qog‘oz bukilishi · 3 temir zangi", min: 0, max: 3, step: 1 },
      { k: "rang", label: "Rang o‘zgardi (0/1)", min: 0, max: 1, step: 1 },
      { k: "gaz", label: "Gaz chiqdi (0/1)", min: 0, max: 1, step: 1 },
      { k: "harorat", label: "Harorat o‘zgardi (0/1)", min: 0, max: 1, step: 1 },
      { k: "qaytar", label: "Boshlang‘ich holatga qaytariladi (0/1)", min: 0, max: 1, step: 1 },
    ],
    readouts: [
      { k: "turi", label: "To‘g‘ri tasnif" },
      { k: "sizning", label: "Sizning javobingiz" },
      { k: "baho", label: "Baho" },
      { k: "massa", label: "Massa" },
    ],
    compute(st) {
      const H = [

        { nom: "Temirning zanglashi", tur: "Kimyoviy · qaytmas", belgi: [1, 0, 0] },
      ][st.hodisa];
      const belgilar = [st.rang, st.gaz, st.harorat];
      const kimyoviy = belgilar[0] + belgilar[1] >= 1;
      const javob = kimyoviy ? "Kimyoviy" : st.qaytar ? "Fizik · qaytar" : "Fizik · qaytmas";
      const togri = H.tur.startsWith("Kimyoviy");
      let baho = "Sizning belgilaringiz H1 va H2 mezoniga asoslangan";

      else baho = "Xato: H1 (rang) yoki H2 (gaz) belgisi hodisaga mos kelmadi";
      return { turi: H.tur, nom: H.nom, sizning: javob, baho, massa: kimyoviy ? "yopiq idishda saqlanadi" : "saqlanadi" };
    },
    svg(st, r) {

        txt(l.x + 45, l.y + 50, "boshidan", { anchor: "middle", size: 11, fill: "#93a4c4" }) +
        txt(l.x + 45, l.y + 18, pic, { anchor: "middle", size: 30 }) +

        rect(rg.x - 30, rg.y - 20, 150, 120, { fill: "#1a2a3d", stroke: "#ffb347", r: 10 }) +
        txt(rg.x + 45, rg.y + 18, st.rang ? "🟤" : pic, { anchor: "middle", size: 30 }) +
        txt(rg.x + 45, rg.y + 50, "oxirida", { anchor: "middle", size: 11, fill: "#93a4c4" }) +
        txt(320, 300, "To‘g‘ri tasnif: " + r.turi + "   ·   sizniki: " + r.sizning, { anchor: "middle", size: 13, fill: "#5fd9d0", weight: "bold" }) +
        txt(320, 322, r.baho, { anchor: "middle", size: 12, fill: r.baho.startsWith("To‘g‘ri") ? "#6fe39a" : "#ff7a7a" }), "0 0 640 340"
      );
    },
  };

  /* ---------- 10. Erish / eruvchanlik ---------- */
  const erish = {
    title: "Erish va eruvchanlik",
    hint: "Harorat, maydalash va aralashtirish — shakar necha grammigacha eriydi?",
    init: { harorat: 40, massa: 60, mayda: 1, aralashtirish: 1 },
    controls: [
      { k: "harorat", label: "Harorat (°C)", min: 0, max: 90, step: 1, unit: "°C" },

      { k: "mayda", label: "Maydalangan (0/1)", min: 0, max: 1, step: 1 },
      { k: "aralashtirish", label: "Aralashtirilgan (0/1)", min: 0, max: 1, step: 1 },
    ],
    readouts: [
      { k: "chegara", label: "Eruvchanlik chegarasi", unit: "g" },
      { k: "erigan", label: "Eridi", unit: "g" },
      { k: "choqma", label: "Cho‘kma", unit: "g" },
      { k: "tezlik", label: "Erish tezligi", unit: "×" },
    ],
    compute(st) {
      const chegara = 180 + st.harorat * 2.2; // 100 g suvga, taxminiy
      const erigan = Math.min(st.massa, chegara);

      const tez = 1 + st.mayda * 0.8 + st.aralashtirish * 0.7 + st.harorat / 45;
      return { chegara, erigan, choqma, tezlik: tez };

    svg(st, r) {
      const x = 200, y = 70, w = 220, h = 210;
      let sugar = "";
      const n = Math.round(r.erigan / 12);
      for (let i = 0; i < n; i++) sugar += rect(x + 16 + (i % 9) * 22, y + 46 + Math.floor(i / 9) * 20, st.mayda ? 4 : 9, st.mayda ? 4 : 9, { fill: "#ffffff", stroke: "none", opacity: 0.55 });
      let undissolved = "";
      const u = Math.round(r.choqma / 12);
      for (let i = 0; i < u; i++) undissolved += rect(x + 22 + (i % 8) * 24, y + h - 24 - Math.floor(i / 8) * 12, st.mayda ? 5 : 10, st.mayda ? 5 : 10, { fill: "#fff", stroke: "none", opacity: 0.95 });
      const stir = st.aralashtirish ? path(`M${x + w + 16},${y + 20} q-14,40 0,80 q14,30 0,60`, { stroke: "#b18cff", sw: 2.4 }) : "";
      return svgBox(

        sugar + undissolved + stir +
        txt(x + w / 2, y - 14, "100 g suv · " + st.harorat + "°C", { anchor: "middle", size: 12, fill: "#93a4c4" }) +
        txt(60, 110, "erigan: " + nf(r.erigan, 0) + " g", { size: 12.5, fill: "#6fe39a" }) +

        txt(60, 154, "chegara: " + nf(r.chegara, 0) + " g", { size: 12.5, fill: "#ffb347" }) +
        txt(60, 176, "tezlik: " + nf(r.tezlik, 1) + "×", { size: 12.5, fill: "#5fd9d0" }) +
        (r.choqma > 0.5 ? txt(x + w / 2, y + h + 26, "Eritma to‘yingan — ortig‘chi erimaydi", { anchor: "middle", size: 12, fill: "#ff7a7a" }) : ""), "0 0 640 320"
      );

  };

  /* ---------- 11. Kuch / massa-og‘irlik ---------- */
  const kuch = {
    title: "Massa va og‘irlik kuchi",
    hint: "Massani o‘zgartiring va sayyorani tanlang: prujina qancha cho‘ziladi?",
    init: { massa: 3, jism: 0 },
    controls: [
      { k: "massa", label: "Massa (kg)", min: 0.5, max: 20, step: 0.5, unit: " kg" },
      { k: "jism", label: "Joy: 0 Yer · 1 Oy · 2 Mars · 3 Yupiter", min: 0, max: 3, step: 1 },

    readouts: [
      { k: "g", label: "g", unit: "N/kg" },

      { k: "massa", label: "Massa", unit: "kg" },

    compute(st) {
      const g = [9.8, 1.6, 3.7, 24.8][st.jism];

      return svgBox(
        line(x - 60, top, x + 60, top, { stroke: "#93a4c4", sw: 4 }) +

        rect(x - 34, top + len, 68, 44, { fill: "#1d3a5c", stroke: "#5fd9d0", sw: 2, r: 8 }) +

        txt(80, 112, "Massa hamma joyda " + nf(st.massa, 1) + " kg", { size: 12, fill: "#93a4c4" }), "0 0 640 380"
      );
    },
  };

  /* ---------- 12. Suzish / shakl ---------- */
  const suzish = {
    title: "Plastilin: shar yoki kema?",
    hint: "Bir xil massa, turli shakl — suvning itarib chiqarish kuchi qanday o‘zgaradi?",
    init: { massa: 60, shakl: 0, suyuqlik: 0 },
    controls: [
      { k: "massa", label: "Plastilin massasi (g)", min: 20, max: 200, step: 5, unit: " g" },
      { k: "shakl", label: "Shakl: 0 shar · 1 kosa (kema) · 2 tekis plitka", min: 0, max: 2, step: 1 },
      { k: "suyuqlik", label: "Suyuqlik: 0 suv · 1 tuzli suv", min: 0, max: 1, step: 1 },
    ],
    readouts: [
      { k: "FA", label: "Arximed kuchi", unit: "N" },
      { k: "F", label: "Og‘irlik kuchi", unit: "N" },
      { k: "holat", label: "Natija" },
      { k: "yuk", label: "Ko‘tara oladigan yuk", unit: "g" },
    ],
    compute(st) {
      const rhoPlast = 1.9, V = st.massa / rhoPlast;

      // suvning itarib chiqarish kuchi: shakl qancha ko'p hajmni siqib chiqarsa, kuch shuncha ortadi
      const Vsil = [V, V * 5.2, V * 1.6][st.shakl];
      const FA = suv * 10 * (Vsil / 1000);
      const F = (st.massa / 1000) * 10;
      const holat = FA > F + 0.01 ? "suzadi" : FA < F - 0.01 ? "cho‘kadi" : "suv ichida muallaq";
      const yuk = Math.max(0, (FA - F) * 100);
      return { FA, F, holat, yuk, Vsil };
    },
    svg(st, r) {
      const tankX = 120, tankY = 90, tankW = 400, tankH = 200;
      const waterTop = tankY + 34;

        rect(tankX, tankY, tankW, tankH, { fill: "#12314f", stroke: "#33507f", r: 8, opacity: 0.85 }) +

        shape +

        txt(tankX, tankY - 12, "F(A) = " + nf(r.FA, 2) + " N   ·   og‘irlik = " + nf(r.F, 2) + " N   →   " + r.holat, { size: 13, fill: onTop ? "#6fe39a" : "#ff7a7a", weight: "bold" }) +
        txt(tankX, tankY + tankH + 26, "Qo‘shimcha yuk: " + nf(r.yuk, 0) + " g gacha", { size: 12, fill: "#ffb347" }), "0 0 640 340"
      );
    },
  };

  /* ---------- 13. Yorug‘lik ---------- */
  const yoruglik = {
    title: "Ko‘zgudan qaytish",
    hint: "Tushish burchagini suring — qaytish burchagi har doim unga teng (α = β).",
    init: { burchak: 35 },
    controls: [{ k: "burchak", label: "Tushish burchagi α (°)", min: 0, max: 85, step: 1, unit: "°" }],
    readouts: [
      { k: "alfa", label: "α tushish", unit: "°" },
      { k: "beta", label: "β qaytish", unit: "°" },
      { k: "farq", label: "Farq", unit: "°" },
    ],
    compute(st) {

    },
    svg(st, r) {
      const cx = 320, cy = 250, R = 170;
      const a = (st.burchak * Math.PI) / 180;
      const inX = cx - Math.sin(a) * R, inY = cy - Math.cos(a) * R;
      const outX = cx + Math.sin(a) * R, outY = cy - Math.cos(a) * R;
      return svgBox(
        line(40, cy, 600, cy, { stroke: "#93a4c4", sw: 5 }) +
        line(cx, cy, cx, cy - R - 10, { stroke: "#33507f", sw: 1.4, dash: "5 4" }) +
        arrow(inX, inY, cx, cy, { stroke: "#ffb347", sw: 3 }) +

    title: "Suv qaysi tuproqdan qancha tez o‘tadi?",
    hint: "Uch tuproqning singdirish tezligini qiyoslang — sug‘orish rejasi shundan chiqadi.",
    init: { tur: 0, hajm: 100, vaqt: 30 },
    controls: [
      { k: "tur", label: "Tuproq: 0 qumli · 1 loyli · 2 qora", min: 0, max: 2, step: 1 },
      { k: "hajm", label: "Quyilgan suv (ml)", min: 20, max: 300, step: 10, unit: " ml" },
      { k: "vaqt", label: "Kuzatuv vaqti (sekund)", min: 5, max: 300, step: 5, unit: " s" },
    ],
    readouts: [
      { k: "tezlik", label: "Singdirish tezligi", unit: "ml/min" },
      { k: "kirish", label: "Kirgan suv", unit: "ml" },
      { k: "qolgan", label: "Sirtda qoldi", unit: "ml" },
      { k: "tavsiya", label: "Sug‘orish" },
    ],
    compute(st) {
      const sekinlik = [1, 6.5, 2.6][st.tur];
      const maxT = Math.round(st.hajm * sekinlik);
      const kirgan = Math.min(st.hajm, (st.hajm / maxT) * st.vaqt);
      const tez = st.hajm / maxT;
      return {
        tezlik: tez * 60,
        kirish: kirgan,
        qolgan: st.hajm - kirgan,
        tavsiya: st.tur === 0 ? "ko‘p-ko‘p, kam-kam" : st.tur === 1 ? "oz va sekin, ko‘lmak bo‘lmasin" : "o‘rtacha, haftada 2-3 marta",
      };
    },
    svg(st, r) {
      const cols = ["#c9a15c", "#5f7295", "#3a2c22"];
      let out = "";
      [0, 1, 2].forEach((i) => {
        const x = 70 + i * 190, top = 60, bot = 250;
        const speed = [1, 6.5, 2.6][i];
        const f = s(st.vaqt / (st.hajm * speed), 0, 1);
        out += rect(x, top, 130, bot - top, { fill: "#0f1a2e", stroke: "#33507f", r: 6 });
        out += rect(x, top + 30, 130, bot - top - 30, { fill: cols[i], stroke: "none", opacity: 0.85 });
        for (let k = 0; k < 8; k++) out += circle(x + 18 + (k % 4) * 32, top + 50 + Math.floor(k / 4) * 30, i === 0 ? 9 : 5, { fill: "#ffffff", stroke: "none", opacity: 0.2 });
        const w = f * (bot - top - 40);
        out += rect(x + 4, top + 34, 122, w, { fill: "#5fd9d0", stroke: "none", opacity: 0.55, r: 3 });
        out += txt(x + 65, bot + 20, ["qumli", "loyli", "qora"][i], { anchor: "middle", size: 11.5, fill: i === st.tur ? "#ffb347" : "#93a4c4", weight: i === st.tur ? "bold" : "" });
        out += txt(x + 65, top - 8, nf((1 - f) * 100, 0) + "% suv qoldi", { anchor: "middle", size: 10.5, fill: "#93a4c4" });
      });
      return svgBox(out + txt(320, 310, "Suvning kirish darajasi — har bir tuproq uchun o‘lchangan vaqtda", { anchor: "middle", size: 12, fill: "#5fd9d0" }), "0 0 640 330");
    },
  };

  /* ---------- 17. Astronomiya ---------- */
  const astronomiya = {
    title: "Quyosh sistemasi va masshtab",
    hint: "Masshtabni o‘zgartiring — sayyoralarning haqiqiy joylashuvi qanchalik keng ekanini ko‘ring.",
    init: { sayyora: 2, masshtab: 2 },
    controls: [
      { k: "sayyora", label: "Sayyora (0 Merkuriy … 7 Neptun)", min: 0, max: 7, step: 1 },
      { k: "masshtab", label: "Masofa masshtabi (1..6)", min: 1, max: 6, step: 1 },
    ],
    readouts: [
      { k: "a.b.", label: "Quyoshdan", unit: "a.b." },
      { k: "daqiqa", label: "Yorug‘lik boradi", unit: "min" },
      { k: "kun", label: "Aylanish davri", unit: "kun" },
      { k: "yil", label: "Yil uzunligi", unit: "yil" },
    ],
    compute(st) {
      const P = [
        { k: "Merkuriy", a: 0.39, d: 0.24, y: 88, n: 0 },
        { k: "Venera", a: 0.72, d: 0.95, y: 225, n: 0 },
        { k: "Yer", a: 1, d: 1, y: 365, n: 1 },
        { k: "Mars", a: 1.52, d: 0.53, y: 687, n: 2 },
        { k: "Yupiter", a: 5.2, d: 11.2, y: 4333, n: 95 },
        { k: "Saturn", a: 9.58, d: 9.45, y: 10759, n: 146 },
        { k: "Uran", a: 19.2, d: 4.0, y: 30687, n: 28 },
        { k: "Neptun", a: 30.05, d: 3.88, y: 60190, n: 16 },
      ][st.sayyora | 0] || P[0];
      return { p: P, "a.b.": P.a, daqiqa: (P.a * 8.3), kun: P.d, yil: P.y / 365 };
    },
    svg(st, r) {
      const p = r.p;
      let orbits = "", planets = "";
      const cx = 320, cy = 180;
      [[0.39, "#93a4c4"], [0.72, "#c9a15c"], [1, "#5fd9d0"], [1.52, "#ff7a7a"], [5.2, "#ffb347"], [9.58, "#e6d3a3"], [19.2, "#7fd4ff"], [30.05, "#6b7cff"]].forEach(([a, c], i) => {
        const R = 12 + Math.sqrt(a / (st.masshtab * 5)) * 180;
        orbits += circle(cx, cy, R, { stroke: i === st.sayyora ? "#ffb347" : "#22304d", sw: i === st.sayyora ? 2.4 : 1, fill: "none" });
        if (i <= st.sayyora) {
          const ang = (i * 50 * Math.PI) / 180;
          planets += circle(cx + R * Math.cos(ang), cy + R * Math.sin(ang), 3 + p.d * (i === st.sayyora ? 2.2 : 1), { fill: c, stroke: "none", opacity: 0.95 });
        }
      });
      return svgBox(
        orbits + circle(cx, cy, 22, { fill: "#ffb347", stroke: "#fff", sw: 1.6, opacity: 0.95 }) + planets +
        txt(14, 34, p.k + " — Quyoshdan " + nf(p.a, 2) + " a.b. · yil " + nf(p.y / 365, 1) + " yer yili · yo‘ldosh " + p.n, { size: 12.5, fill: "#ffb347", weight: "bold" }) +
        txt(14, 54, "1 a.b. = 150 mln km — yorug‘lik bu masofani 8,3 daqiqada o‘tadi", { size: 11, fill: "#93a4c4" }), "0 0 640 360"
      );
    },
  };
  const fazalar = {
    title: "Oy fazalari, kun va fasllar",
    hint: "Oyning orbita burchagi va Yerning yildagi holati — faza, kunduz uzunligi va fasl shundan o‘zgaradi.",
    init: { burchak: 45, kunOrb: 170 },
    controls: [
      { k: "burchak", label: "Oyning orbitadagi burchagi (°)", min: 0, max: 360, step: 5, unit: "°" },
      { k: "kunOrb", label: "Yil ichida kun (1..365)", min: 1, max: 365, step: 1, unit: " kun" },
    ],
    readouts: [
      { k: "faza", label: "Oy fazasi" },
      { k: "yorug", label: "Yorug‘ qism", unit: "%" },
      { k: "fasl", label: "Fasal (shimol)" },
      { k: "kunduz", label: "Kunduz uzunligi", unit: "soat" },
    ],
    compute(st) {
      const b = st.burchak % 360;
      const yorug = Math.round(((1 - Math.cos((b * Math.PI) / 180)) / 2) * 100);
      const faza = yorug > 96 ? "To‘lin Oy" : yorug < 4 ? "Yangi Oy" : b < 90 ? "O‘sib borayotgan yarim oy" : b < 180 ? "To‘linga yaqin (o‘suvchi)" : b < 270 ? "Kamayayotgan (so‘nggi chorak)" : "Yangi Oyga yaqin";
      const f = (st.kunOrb - 80) / 365 * Math.PI * 2;
      const kunduz = 12 + 6.2 * Math.sin(f);
      const q = Math.sin(f);
      const fasl = q > 0.5 ? "yoz" : q > 0 ? "bahor" : q > -0.5 ? "kuz" : "qish";
      return { faza, yorug, fasl, kunduz };
    },
    svg(st, r) {
      const cx = 460, cy = 180, R = 66;
      const b = ((st.burchak % 360) * Math.PI) / 180;
      const kx = cx + R * Math.cos(b), ky = cy + R * Math.sin(b);
      const illum = r.yorug / 100;
      const moon = circle(kx, ky, 16, { fill: "#0a1424", stroke: "#93a4c4", sw: 1.4 }) +
        path(`M${kx},${ky - 16} A16,16 0 ${illum > 0.5 ? 1 : 0} 0 ${kx},${ky + 16} A${Math.abs(16 * (2 * illum - 1))},16 0 0 ${illum > 0.5 ? 1 : 0} ${kx},${ky - 16} Z`, { fill: "#fff3cf", stroke: "none", opacity: 0.95 });
      const earthX = 110, earthY = 180;
      const tilt = -23.5;
      const dayLen = r.kunduz;
      const dayArc = (dayLen / 24) * 360;
      let out =
        txt(320, 34, "Oy fazasi: " + r.faza + "  ·  yorug‘ qism " + r.yorug + "%", { anchor: "middle", size: 13.5, fill: "#ffb347", weight: "bold" }) +
        circle(earthX, earthY, 44, { fill: "#1d3a5c", stroke: "#5fd9d0", sw: 2 }) +
        path(`M${earthX - 40},${earthY} A44,44 0 0 1 ${earthX + 40},${earthY}`, { stroke: "#ffb347", sw: 4, opacity: 0.85 }) +
        line(earthX - 30, earthY - 52, earthX + 30, earthY + 52, { stroke: "#ff7a7a", sw: 1.6, dash: "5 4" }) +
        txt(earthX, earthY - 64, "o‘q qiyaligi 23,5°", { anchor: "middle", size: 10.5, fill: "#ff7a7a" }) +
        txt(earthX, earthY + 74, "kunduz " + nf(dayLen, 1) + " soat · " + r.fasl, { anchor: "middle", size: 11.5, fill: "#5fd9d0" }) +
        arrow(640 - 40, 90, earthX + 70, earthY - 40, { stroke: "#ffe1b0", sw: 2.4 }) +
        txt(600, 78, "Quyosh nuri", { anchor: "end", size: 11, fill: "#ffe1b0" }) +
        circle(cx, cy, R, { stroke: "#22304d", fill: "none", dash: "4 5" }) +
        circle(cx, cy, 22, { fill: "#1d3a5c", stroke: "#5fd9d0", sw: 2 }) +
        txt(cx, cy + 5, "Yer", { anchor: "middle", size: 11, fill: "#cfe0ff" }) +
        moon;
      return svgBox(out, "0 0 640 340");
    },
  };

  /* ---------- Laboratoriya moslashuvchan ulagichi ---------- */
  const REG = {
    ratsion, hazm, nafas, puls, mikrob, spreu, himoya, zanjir, zanjir_birikish,
    modda, qaynash, ozgarish, erish, kuch, suzish, yoruglik, sinish,
    elektr, qiyos, jins, qoldiq, tuproq, singdirish, astronomiya, fazalar,
  };
  // mavzu labMode bo‘yicha qo‘shma rejimlarni biriktirish
  const ALIAS = {
    "mikrob:spreu": "spreu",
    "zanjir:birikish": "zanjir_birikish",
    "modda:qaynash": "qaynash",
    "ozgarish:kimyo": "ozgarish",
    "suzish:shakl": "suzish",
    "yoruglik:sinish": "sinish",
    "elektr:qiyos": "qiyos",
    "jins:qoldiq": "qoldiq",
    "tuproq:singdirish": "singdirish",
    "astronomiya:fazalar": "fazalar",
  };

  function mount(host, topic, api) {
    const key = ALIAS[topic.lab + ":" + topic.labMode] || topic.lab;
    const cfg = REG[key];
    if (!cfg) {
      host.innerHTML = `<p class="hint">Bu mavzu uchun simulyator tayyorlanmoqda.</p>`;
      return { destroy() {} };
    }
    host.innerHTML = "";
    const state = Object.assign({}, cfg.init);
    const wrap = el("div", "lab-wrap");
    const stage = el("div", "lab-stage");
    const panel = el("div", "lab-panel");
    wrap.append(stage, panel);
    host.append(wrap);

    const head = el("div", "card", `<h2 style="margin-bottom:4px">${cfg.title}</h2><p class="hint" style="margin:0">${cfg.hint || ""}</p>`);
    host.prepend(head);

    // boshqaruv elementlari
    cfg.controls.forEach((c) => {
      const f = el("div", "field");
      const lab = el("label", "", c.label);
      const input = el("input");
      input.type = "range";
      input.min = c.min; input.max = c.max; input.step = c.step;
      input.value = state[c.k];
      const val = el("span", "val", String(state[c.k]).replace(".", ",") + (c.unit || ""));
      input.addEventListener("input", () => {
        state[c.k] = c.step >= 1 && c.max - c.min <= 60 ? parseInt(input.value, 10) : parseFloat(input.value);
        val.innerHTML = (c.max - c.min <= 60 && c.step >= 1 ? state[c.k] : nf(state[c.k], 2)) + (c.unit || "");
        render();
      });
      f.append(lab, input, val);
      panel.append(f);
    });
    if (cfg.controlsExtra) {
      cfg.controlsExtra.forEach((x) => {
        if (x.type === "playpause") {
          const row = el("div", "field");
          const btn = el("button", "btn primary", "▶ Harakatni boshlash");
          btn.addEventListener("click", () => {
            api.running = !api.running;
            btn.innerHTML = api.running ? "⏸ To‘xtatish" : "▶ Harakatni boshlash";
            if (!api.running) { state.t = 0; render(); }
          });
          const rst = el("button", "btn small", "↺ Boshidan");
          rst.addEventListener("click", () => { state.t = 0; render(); });
          row.append(btn, " ", rst);
          panel.append(row);
        }
      });
    }

    // o‘lchov katakchalari
    const ro = el("div", "field");
    const grid = el("div", "readout");
    const cells = {};
    (cfg.readouts || []).forEach((rd) => {
      const cell = el("div", "cell", `<b>${rd.label}${rd.unit ? " (" + rd.unit + ")" : ""}</b><span>—</span>`);
      cells[rd.k] = cell.querySelector("span");
      grid.append(cell);
    });
    ro.append(grid);
    panel.append(ro);

    const actions = el("div", "field");
    const saveBtn = el("button", "btn small", "💾 Natijani daftarga");
    saveBtn.addEventListener("click", () => api.save({ lab: topic.lab, mode: topic.labMode, state: JSON.parse(JSON.stringify(state)), r: lastR }));
    actions.append(saveBtn, " ", el("span", "hint", " — o‘lchovlaringiz Amaliy topshiriq bo‘limidagi daftarga yoziladi."));
    panel.append(actions);

    let lastR = {};
    function render() {
      const r = cfg.compute(state, api);
      lastR = r;
      (cfg.readouts || []).forEach((rd) => {
        if (!(rd.k in r)) return;
        const v = r[rd.k];
        cells[rd.k].innerHTML = typeof v === "number" ? nf(v, rd.d == null ? 1 : rd.d) : String(v);
      });
      stage.innerHTML = cfg.svg(state, r, api);
      if (cfg.after) cfg.after(stage, state, r, api);
    }
    render();
    api.running = false;
    return {
      destroy() {
        api.running = false;
        if (api.timer) clearInterval(api.timer);
      },
    };
  }
  return { mount, REG };
})();

    </script>
    <script>
      /* 6-sinf Tabiiy fan platformasi — ilova (7-sinf arxitekturasi asosida)
 * Bitta HTML fayl ichida ishlaydi: ma'lumot <script id="topics-data"> orolida.
 * Saqlash: localStorage (tabiiy6_progress_v1) — server talab qilinmaydi.
 */
(function () {
  "use strict";

  const KEY = "tabiiy6_progress_v1";
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const nf = (x, d = 1) => (!isFinite(x) ? "—" : String(+ (+x).toFixed(d)).replace(".", ","));
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ---------------- ma'lumot ---------------- */
  let DATA = { meta: {}, topics: [] };
  try {
    DATA = JSON.parse($("#topics-data").textContent);
  } catch (e) {
    console.error("topics-data ajratib bo'lmadi:", e);
  }
  const TOPICS = (DATA.topics || []).map((t) => ({
    ...t,
    kod: t.kitob?.kod || `${t.d}.${t.c}`,
    bobNomi: t.kitob?.bobNomi || `${t.d}-bob`,
  }));
  const BOBS = (() => {
    const m = new Map();
    TOPICS.forEach((t) => {
      if (!m.has(t.d)) m.set(t.d, { n: t.d, nom: t.bobNomi, bet: t.kitob?.oralig || "", mavzular: [], amaliy: (DATA.meta?.bob_amaliy_ishlari || {})[t.d] || [], chorak: t.chorak || Math.ceil(t.d / 3) });
      m.get(t.d).mavzular.push(t);
    });
    return Array.from(m.values()).sort((a, b) => a.n - b.n);
  })();

  /* ---------------- holat / saqlash ---------------- */
  const state = {
    tab: "nazariya",
    topic: TOPICS[0]?.kod || "",
    panel: false,
    progress: load(),
    test: null,
    slides: null,
  };
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return {};
      return JSON.parse(raw);
    } catch (e) {
      return {};
    }
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state.progress));
    } catch (e) {
      console.warn("Saqlanmadi:", e);
    }
  }
  function pOf(kod) {
    if (!state.progress[kod]) state.progress[kod] = { viewed: false, steps: {}, notebook: {}, answers: {}, test: null, slides: 0 };
    return state.progress[kod];
  }
  function viewed(kod) {
    const p = pOf(kod);
    if (!p.viewed) {
      p.viewed = true;
      save();
      renderSidebar();
    }
  }
  function topicByKod(kod) {
    return TOPICS.find((t) => t.kod === kod);
  }
  const cur = () => topicByKod(state.topic);

  function toast(msg) {
    const t = $("#toast");
    if (!t) return;
    t.textContent = msg;
    t.classList.add("on");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove("on"), 2000);
  }

  /* ---------------- mezon chip ---------------- */
  function mezonChip(k, bio) {
    return `<span class="mezon-chip ${bio ? "biox" : ""}" title="Darslikdagi ko'nikma: ${esc(k)}">${esc(k)}</span>`;
  }
  function mezonList(topic, limit) {
    const k = (topic.urinish?.konikmalar || []).slice(0, limit || 3);
    if (!k.length) return "";
    return `<div class="chips">${k.map((x, i) => mezonChip(x, i === 1)).join("")}</div>`;
  }

  /* ---------------- sidebar ---------------- */
  function renderSidebar() {
    const list = $("#bob-list");
    if (!list) return;
    const q = ($("#search")?.value || "").trim().toLowerCase();
    list.innerHTML = BOBS.map((b) => {
      const items = b.mavzular.filter(
        (t) => !q || t.t.toLowerCase().includes(q) || t.kod.includes(q) || (t.theory || "").toLowerCase().includes(q)
      );
      if (q && !items.length) return "";
      const done = b.mavzular.filter((t) => state.progress[t.kod]?.viewed).length;
      return `<section class="bob-group">
        <header class="bob-title"><span class="n">${b.n}-bob</span> <span>${esc(b.nom)}</span><b class="b">${done}/${b.mavzular.length}</b></header>
        ${items
          .map(
            (t) => `<button class="topic-item ${t.kod === state.topic ? "active" : ""}" data-topic="${t.kod}">
              <span class="kod">${t.kod}</span><span class="tt">${esc(t.t)}</span>${state.progress[t.kod]?.viewed ? '<span class="tick">✓</span>' : ""}
            </button>`
          )
          .join("")}
      </section>`;
    }).join("");
  }

  /* ---------------- topbar ---------------- */
  function renderTopbar() {
    const t = cur();
    $("#crumb").innerHTML = t
      ? `<b>${esc(t.bobNomi)}</b> · ${t.kod} ${esc(t.t)} · <span class="muted">darslik ${esc(t.kitob?.bet || "")}-bet</span>`
      : `<b>6-sinf Tabiiy fan</b> · boshqaruv paneli`;
    $$("#tabs .tab-btn").forEach((b) =>
      b.classList.toggle("active", state.panel ? b.dataset.act === "panel" : !state.panel && b.dataset.tab === state.tab)
    );
  }

  /* ---------------- asosiy kontent ---------------- */
  function render() {
    renderTopbar();
    renderSidebar();
    const host = $("#content");
    if (state.panel) return renderPanel(host);
    const t = cur();
    if (!t) {
      host.innerHTML = `<p>Mavzu topilmadi.</p>`;
      return;
    }
    viewed(t.kod);
    if (state.tab === "nazariya") renderTheory(host, t);
    else if (state.tab === "simulyator") renderLab(host, t);
    else if (state.tab === "oyin") renderGame(host, t);
    else if (state.tab === "test") renderTestTab(host, t);
    else renderTask(host, t);
  }

  function head(t, sub) {
    return `<div class="card">
      <h2>${esc(t.t)}</h2>
      <div class="kitob-box">
        <span class="chip">${t.kod}</span>
        <span class="chip cyan">Darslik: ${esc(t.kitob?.oralig || "")}-bet</span>
        ${t.kitob?.amaliyIsh ? `<span class="chip amber">Amaliy ish ${t.kitob.amaliyIsh.kod}: ${esc(t.kitob.amaliyIsh.nomi)}</span>` : ""}
        ${t.kitob?.boshqotirma ? `<span class="chip">Boshqotirma: ${t.kitob.boshqotirma}-bet</span>` : ""}
        ${t.kitob?.mustahkamlash ? `<span class="chip">Mustahkamlash: ${t.kitob.mustahkamlash}-bet</span>` : ""}
      </div>
      ${sub || ""}
    </div>`;
  }

  /* ---- Nazariya ---- */
  function renderTheory(host, t) {
    const paras = (t.theory || "").split("\n\n").filter(Boolean);
    host.innerHTML =
      head(t) +
      `<div class="card theory">
        <h3>Nazariya</h3>
        ${paras.map((p) => `<p>${esc(p)}</p>`).join("") || "<p class='muted'>Matn tayyorlanmoqda.</p>"}
      </div>
      <div class="grid cols-2">
        <div class="card">
          <h3>Asosiy formulalar va qoidalar</h3>
          <div class="formula-list">${(t.formulas || []).map((f) => `<div class="formula">${esc(f)}</div>`).join("")}</div>
        </div>
        <div class="card">
          <h3>Atamalar lug'ati</h3>
          <table class="vocab-table"><tbody>
            ${(t.vocab || []).map((v) => `<tr><td>${esc(v.w)}</td><td>${esc(v.m)}</td></tr>`).join("")}
          </tbody></table>

  /* ---- O'yin ---- */
  function renderGame(host, t) {
    const g = (t.game || []).length ? t.game : (t.slideQuiz || []).slice(0, 4);
    host.innerHTML =
      head(t) +
      `<div class="card game-card">
        <div class="game-meter"><span id="g-score">0</span><span class="muted">/ ${g.length}</span>
          <div class="track"><i id="g-bar" style="width:0"></i></div>
          <button class="btn small" data-act="game-reset">↺ Qaytadan</button>
        </div>
        <div id="g-body"></div>
      </div>`;
    const game = { i: 0, right: 0, lock: false };
    const body = $("#g-body");
    function draw() {
      if (game.i >= g.length) {
        body.innerHTML = `<h3 style="margin-top:0">Natija: ${game.right} / ${g.length}</h3>
          <p class="muted small">${game.right === g.length ? "A'lo! Barcha javoblar to'g'ri." : "Xatolarni takrorlab, nazariya bo'limiga qayting."}</p>
          ${mezonList(t, 2)}
          <div class="chips"><button class="btn primary" data-act="game-reset">Yana o'ynash</button><button class="btn" data-go="test">📝 Test</button></div>`;
        $("#g-bar").style.width = "100%";
        return;
      }
      const [q, opts, idx, why] = g[game.i];
      game.lock = false;
      body.innerHTML = `<div class="game-q">${esc(q)}</div>
        <div class="game-opts">${opts.map((o, i) => `<button class="game-opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>
        <p class="hint" id="g-why" style="display:none">${esc(why || "")}</p>`;
      $("#g-score").textContent = game.right;
      $("#g-bar").style.width = (game.i / g.length) * 100 + "%";
      $$(".game-opt", body).forEach((btn) =>
        btn.addEventListener("click", () => {
          if (game.lock) return;
          game.lock = true;
          const i = +btn.dataset.i;
          btn.classList.add(i === idx ? "right" : "bad");
          if (i !== idx) $$(".game-opt", body)[idx]?.classList.add("right");
          else game.right++;
          $("#g-score").textContent = game.right;
          $("#g-why").style.display = "block";
          const next = document.createElement("div");
          next.className = "chips";
          next.style.marginTop = "10px";
          next.innerHTML = `<button class="btn primary" data-next>Keyingi →</button>`;
          body.append(next);
          $("[data-next]", next).addEventListener("click", () => {
            game.i++;
            draw();
          });
        })
      );
    }
    draw();
  }

  /* ---- Test bo'limi (sozlash + natija) ---- */
  function renderTestTab(host, t) {
    const cfg = state.test?.cfg || { bob: [t.d], n: 10, mode: "aralash", timer: 0 };
    host.innerHTML =
      head(t) +
      `<div class="card">
        <h3>📝 Test tuzish</h3>
        <div class="field"><label>Boblar</label><div class="seg" data-seg="bob">${BOBS.map(
          (b) => `<button data-v="${b.n}" class="${cfg.bob.includes(b.n) ? "on" : ""}">${b.n}</button>`
        ).join("")}</div></div>
        <div class="grid cols-3" style="margin-top:10px">
          <div class="field"><label>Savollar soni</label><div class="seg" data-seg="n">${[5, 10, 15, 20, 30].map(
            (n) => `<button data-v="${n}" class="${cfg.n === n ? "on" : ""}">${n}</button>`
          ).join("")}</div></div>
          <div class="field"><label>Turi</label><div class="seg" data-seg="mode">${[
            ["aralash", "Aralash"],
            ["bilim", "Bilimlar"],
            ["amaliy", "Amaliy ko'nikma"],
          ]
            .map(([v, l]) => `<button data-v="${v}" class="${cfg.mode === v ? "on" : ""}">${l}</button>`)
            .join("")}</div></div>
          <div class="field"><label>Vaqt (min, 0 — cheksiz)</label><div class="seg" data-seg="timer">${[0, 5, 10, 15, 20].map(
            (n) => `<button data-v="${n}" class="${cfg.timer === n ? "on" : ""}">${n || "∞"}</button>`
          ).join("")}</div></div>
        </div>
        <div class="chips" style="margin-top:10px"><button class="btn primary" data-act="test-start">Testni boshlash</button></div>
      </div>`;
  }
  function buildTest(topics, cfg) {
    let pool = [];
    topics.forEach((t) =>
      (t.quiz || []).forEach((q, i) =>
        pool.push({ q: q[0], opts: q[1], a: q[2], why: q[3], kod: t.kod, bob: t.d, tur: i >= 3 ? "amaliy" : "bilim" })
      )
    );
    if (cfg.mode !== "aralash") pool = pool.filter((q) => q.tur === (cfg.mode === "bilim" ? "bilim" : "amaliy"));
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool.slice(0, cfg.n);
  }
  function startTest() {
    if (!state.test || !state.test.cfg) state.test = { cfg: { bob: [cur()?.d || 1], n: 10, mode: "aralash", timer: 0 } };
    const cfg = state.test.cfg;
    const topics = TOPICS.filter((t) => cfg.bob.includes(t.d));
    const questions = buildTest(topics, cfg);
    if (!questions.length) {
      toast("Bu shartlarda savol topilmadi");
      return;
    }
    state.test = { cfg, questions, answers: {}, i: 0, started: Date.now(), left: cfg.timer * 60 };
    renderTest();
  }
  function renderTest() {
    const { questions, answers, cfg } = state.test;
    const host = $("#content");
    const done = Object.keys(answers).length;
    host.innerHTML = `<div class="card">
      <div class="test-head">
        <h2 style="margin:0">Test · ${cfg.bob.length === 1 ? cfg.bob[0] + "-bob" : "boblar " + cfg.bob.join(", ")}</h2>
        <span class="chip">${questions.length} savol</span>
        <span class="chip cyan" id="t-timer">${cfg.timer ? "⏳ " + fmtTime(state.test.left) : "vaqt cheksiz"}</span>
        <span class="muted small">Savol ${state.test.i + 1} / ${questions.length}</span>
        <button class="btn small" data-act="test-exit">✕ Chiqish</button>
      </div>
      <div class="chip-list">${questions
        .map((q, i) => `<button class="chip-num ${i === state.test.i ? "cur" : ""} ${i in answers ? (answers[i] === q.a ? "ok" : "no") : ""}" data-jump="${i}">${i + 1}</button>`)
        .join("")}</div>
      <div id="t-body" style="margin-top:12px"></div>
    </div>`;
    drawQuestion();
    if (cfg.timer && !state.test.tick) {
      state.test.tick = setInterval(() => {
        if (!state.test) return;
        state.test.left--;
        const el = $("#t-timer");
        if (el) el.textContent = "⏳ " + fmtTime(state.test.left);
        if (state.test.left <= 0) {
          finishTest();
        }
      }, 1000);
    }
  }
  const fmtTime = (s) => (s > 0 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : "0:00");
  function drawQuestion() {
    const { questions, answers, i = 0 } = state.test;
    const q = questions[i];
    const body = $("#t-body");
    if (!body) return;
    const chosen = answers[i];
    body.innerHTML = `<div class="q-item">
      <div class="q-text">${i + 1}. ${esc(q.q)} <span class="chip" style="margin-left:6px">${q.kod}</span></div>
      ${q.opts.map((o, k) => `<label class="opt-row">${chosen != null ? (k === q.a ? "correct" : k === chosen ? "wrong" : "") : ""}">
        <input type="radio" name="q${i}" value="${k}" ${chosen === k ? "checked" : ""} ${chosen != null ? "disabled" : ""}>
        <span>${esc(o)}</span></label>`).join("")}
      ${chosen != null ? `<div class="why"><b>${chosen === q.a ? "To'g'ri ✓" : "Xato ✕"}</b> ${esc(q.why || "")}</div>` : ""}
      <div class="chips" style="margin-top:10px">
        <button class="btn small" data-prev ${i === 0 ? "disabled" : ""}>← Oldingi</button>
        <button class="btn small" data-next ${i >= questions.length - 1 ? "disabled" : ""}>Keyingi →</button>
        <button class="btn small primary" data-finish>${i >= questions.length - 1 ? "Yakunlash" : "Yakunlash (hoziroq)"}</button>
      </div>
    </div>`;
    $$(`#t-body input[name=q${i}]`).forEach((inp) =>
      inp.addEventListener("change", () => {
        state.test.answers[i] = +inp.value;
        const t = topicByKod(q.kod);
        if (t) {
          const p = pOf(t.kod);
          p.answers[i] = +inp.value === q.a;
          save();
        }
        renderTest();
      })
    );
  }
  function finishTest() {
    if (state.test?.tick) clearInterval(state.test.tick);
    const { questions, answers } = state.test;
    const t = cur();
    const right = questions.filter((q, i) => answers[i] === q.a).length;
    const total = questions.length;
    const bal = Math.round((right / total) * 100);
    const baho = bal >= 90 ? "5 (a'lo)" : bal >= 75 ? "4 (yaxshi)" : bal >= 55 ? "3 (qoniqarli)" : "2 (kuchsiz)";
    const mezon = {};
    const topicsTouched = [...new Set(questions.map((q) => q.kod))];
    questions.forEach((q, i) => {
      const tq = topicByKod(q.kod);
      const m = tq?.urinish?.konikmalar?.[0]?.replace(/;$/, "") || q.kod;
      mezon[m] = mezon[m] || { r: 0, n: 0 };
      mezon[m].n++;
      if (answers[i] === q.a) mezon[m].r++;
    });
    const kod = t?.kod;
    if (kod) pOf(kod).test = { right, total, bal, baho, when: new Date().toISOString().slice(0, 10) };
    topicsTouched.forEach((k) => pOf(k).test = pOf(k).test && pOf(k).test.bal > bal ? pOf(k).test : { right, total, bal, baho, when: new Date().toISOString().slice(0, 10) });
    save();
    $("#content").innerHTML = `<div class="card">
      <h2>Test natijasi</h2>
      <div class="score-bar"><b style="font-size:26px;color:var(--amber)">${right}/${total}</b>
        <div class="bar"><i style="width:${bal}%"></i></div><span>${bal}% · ${baho}</span></div>
      <h3>Mezonlar bo'yicha</h3>
      <div class="chips">${Object.entries(mezon)
        .map(([m, v]) => `<span class="mezon-chip ${v.r === v.n ? "biox" : ""}">${esc(m)} — ${v.r}/${v.n}</span>`)
        .join("")}</div>
      <h3>Xatolar tahlili</h3>
      ${questions
        .map(
          (q, i) =>
            answers[i] !== q.a
              ? `<div class="q-item"><div class="q-text">${i + 1}. ${esc(q.q)} <span class="chip">${q.kod}</span></div>
                 <p class="small">Sizning javobingiz: ${esc(q.opts[answers[i]] ?? "—")} · To'g'ri: ${esc(q.opts[q.a])}</p>
                 <div class="why">${esc(q.why || "")}</div></div>`
              : ""
        )
        .join("") || `<p class="muted">Xato yo'q — a'lo natija ✓</p>`}
      <div class="chips" style="margin-top:12px">
        <button class="btn primary" data-act="test-again">↺ Qayta topshirish</button>
        <button class="btn" data-act="test-new">⚙ Sozlamaga qaytish</button>
        <button class="btn ghost" data-act="print">🖨 Xatolarni chop etish</button>
      </div>
    </div>`;
    state.test = null;
    renderSidebar();
  }

            : `<p class="muted small">Hozircha yozuv yo'q. Amaliy topshiriq bo'limida xulosa yozing — u shu yerda ko'rinadi.</p>`}
        </div>
      </div>`;
  }

  /* ---------------- slaydlar ---------------- */
  function buildSlides(topic) {
    const slides = [];
    slides.push({
      type: "cover",
      title: topic.kod + " · " + topic.t,
      sub: "6-sinf Tabiiy fan · " + topic.bobNomi,
      bet: topic.kitob?.oralig,
      ai: topic.kitob?.amaliyIsh,
      savollar: topic.urinish?.savollar || [],
    });
    (topic.theory || "").split("\n\n").forEach((p, i) => slides.push({ type: "theory", n: i + 1, text: p, title: topic.t }));
    if (topic.formulas?.length) slides.push({ type: "formulas", items: topic.formulas, title: topic.t });
    if (topic.vocab?.length) slides.push({ type: "vocab", items: topic.vocab, title: topic.t });
    if (topic.task?.q)
      slides.push({ type: "task", q: topic.task.q, jihoz: topic.task.jihoz || [], xavfsizlik: topic.task.xavfsizlik || [], steps: topic.task.steps || [], title: topic.t });
    (topic.slideQuiz || []).forEach((q, i) =>
      slides.push({ type: "quiz", n: i + 1, q: q[0], opts: q[1], a: q[2], why: q[3], title: topic.t })
    );
    return slides;
  }
  function slideHTML(s, i, total) {
    let body = "";
    if (s.type === "cover")
      body = `<div class="sub">${esc(s.sub)}</div><h1 class="hd">${esc(s.title)}</h1>
        <p class="muted">Maqsad: mavzuni muhokama qilish, model bilan ishlash va natijani daftarga yozish.</p>
        <div class="kvs">
          <div class="fbox"><b>Darslik:</b> ${esc(s.bet || "")}-bet${s.ai ? " · amaliy ish " + esc(s.ai.kod) : ""}</div>
          ${s.ai ? `<div class="fbox"><b>Amaliy ish:</b> ${esc(s.ai.nomi)}</div>` : ""}
          ${(s.savollar || []).length ? `<div class="fbox"><b>Savollar:</b> ${s.savollar.map(esc).join(" ")}</div>` : ""}
        </div>`;
    else if (s.type === "theory")
      body = `<div class="sub">${esc(s.title)} · nazariya ${s.n}</div><div class="body one"><p>${esc(s.text)}</p></div>`;
    else if (s.type === "formulas")
      body = `<div class="sub">Asosiy qoidalar</div><div class="kvs">${(s.items || []).map((f) => `<div class="fbox">${esc(f)}</div>`).join("")}</div>`;
    else if (s.type === "vocab")
      body = `<div class="sub">Atamalar</div><div class="kvs">${(s.items || []).map((v) => `<div class="fbox"><b>${esc(v.w)}</b><br>${esc(v.m)}</div>`).join("")}</div>`;
    else if (s.type === "task")
      body = `<div class="sub">Amaliy topshiriq</div><p><b>${esc(s.q)}</b></p>
        <div class="body"><ol>${(s.steps || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ol>
        <div><div class="fbox"><b>Jihoz:</b> ${(s.jihoz || []).map(esc).join(", ")}</div><br>
        <div class="fbox" style="border-color:#c0392b;background:#fff2f1"><b>Xavfsizlik:</b> ${(s.xavfsizlik || []).map(esc).join(" · ")}</div></div></div>`;
    else if (s.type === "quiz")
      body = `<div class="sub">Savol ${s.n}</div><div class="qbox"><b>${esc(s.q)}</b>
        <ol style="list-style:upper-alpha">${(s.opts || []).map((o) => `<li>${esc(o)}</li>`).join("")}</ol></div>
        <p class="muted small">Javob: ${esc((s.opts || [])[s.a] || "")} — ${esc(s.why || "")}</p>`;
    return `<div class="slide-sheet" data-slide="${i}">
      ${body}
      <div class="foot"><span>${i + 1} / ${total}</span><span>6-sinf · Tabiiy fan</span></div>
    </div>`;
  }
  function openSlides(list, title) {
    state.slides = { list: list || buildSlides(cur()), i: 0, title: title || (cur() ? cur().kod + " " + cur().t : "Barcha slaydlar") };
    $("#slides").classList.add("on");
    document.body.classList.add("no-scroll");
    drawSlides();
  }
  function drawSlides() {
    const { list, i, title } = state.slides;
    $("#slides-title").textContent = title;
    $("#slides-stage").innerHTML = slideHTML(list[i], i, list.length);
    $("#slides-pos").textContent = `${i + 1} / ${list.length}`;
    $$("#slides [data-sl]").forEach((b) => (b.disabled = false));
  }
  function closeSlides() {
    $("#slides").classList.remove("on");
    document.body.classList.remove("no-scroll");
    state.slides = null;
  }

  /* ---------------- chop markazi ---------------- */
  function printCards() {
    const t = cur();
    const scope = state.print?.scope || "mavzu";
    const topics = scope === "bob" ? TOPICS.filter((x) => x.d === (t?.d || 1)) : scope === "barcha" ? TOPICS : t ? [t] : [];
    const cards = [];
    topics.forEach((tp) => buildSlides(tp).forEach((s, i) => cards.push({ tp, s, i })));
    (t ? [t] : []).forEach((tp) => cards.push({ tp, s: { type: "task", q: tp.task?.q || "", jihoz: tp.task?.jihoz || [], xavfsizlik: tp.task?.xavfsizlik || [], steps: tp.task?.steps || [], title: tp.t }, i: 99 }));
    return cards;
  }
  function openPrint() {
    state.print = state.print || { scope: "mavzu", per: 4, sel: {} };
    const cards = printCards();
    const sel = state.print.sel;
    $("#modal-overlay").innerHTML = `<div id="modal">
      <h2 style="display:flex;align-items:center">🖨 Chop markazi <button class="btn small" style="margin-left:auto" data-act="close-modal">✕ Yopish</button></h2>
      <div class="grid cols-3" style="margin-bottom:10px">
        <div class="field"><label>Qamrov</label><div class="seg" data-pseg="scope">
          ${[["mavzu", "Joriy mavzu"], ["bob", "Butun bob"], ["barcha", "Barcha boblar"]].map(
            ([v, l]) => `<button data-v="${v}" class="${state.print.scope === v ? "on" : ""}">${l}</button>`
          ).join("")}</div></div>
        <div class="field"><label>Bir varaqda</label><div class="seg" data-pseg="per">
          ${[1, 2, 4].map((n) => `<button data-v="${n}" class="${state.print.per === n ? "on" : ""}">${n} slayd</button>`).join("")}</div></div>
        <div class="field"><label>Rejim</label><div class="seg" data-pseg="quiz">
          ${[["javob", "Javoblar bilan"], ["bo'sh", "Bo'sh joy bilan"]].map(
            ([v, l]) => `<button data-v="${v}" class="${(state.print.quiz || "javob") === v ? "on" : ""}">${l}</button>`
          ).join("")}</div></div>
      </div>
      <div class="print-grid">${cards
        .map(
          (c, idx) => `<label class="print-tile ${(idx in sel ? sel[idx] : idx < 8) ? "sel" : ""}">
            <input type="checkbox" data-pick="${idx}" ${idx in sel ? (sel[idx] ? "checked" : "") : idx < 8 ? "checked" : ""}>
            <span class="prev">${miniPrev(c.s)}</span>
            <span><span class="lbl">${c.tp.kod}${c.i === 99 ? " · vazifa" : " · slayd " + (c.i + 1)}</span>${esc(cardText(c.s)).slice(0, 90)}</span>
          </label>`
        )
        .join("")}</div>
      <div class="chips" style="margin-top:12px">
        <button class="btn primary" data-act="do-print">🖨 Varaqqa tushirish</button>
        <button class="btn" data-act="print-all">✓ Hammasini belgilash</button>
        <button class="btn ghost" data-act="print-none">✕ Bekor qilish</button>
      </div>
    </div>`;
    $("#modal-overlay").classList.add("on");
    document.body.classList.add("no-scroll");
  }
  function cardText(s) {
    if (s.type === "cover") return s.title;
    if (s.type === "theory") return s.text;
    if (s.type === "formulas") return s.items.join(" · ");
    if (s.type === "vocab") return s.items.map((v) => v.w).join(", ");
    if (s.type === "task") return "Vazifa: " + s.q;
    return s.q || "";
  }
  function miniPrev(s) {
    return esc(cardText(s).slice(0, 52));
  }
  function printSheet(s, tp, opts) {
    const withAns = (opts.quiz || "javob") === "javob";
    const head = `<div class="phd"><b>${esc(tp.kod)} ${esc(tp.t)}</b><span>${esc(tp.bobNomi)} · darslik ${esc(
      tp.kitob?.oralig || ""
    )}-bet${tp.kitob?.amaliyIsh?.bet ? " · mashq daftari " + esc(tp.kitob.amaliyIsh.bet) + "-bet" : ""}</span></div>`;
    let body = "";
    if (s.type === "cover")
      body = `<h4>${esc(s.title)}</h4><p class="lbl">${esc(s.sub)}</p>${(tp.urinish?.savollar || []).map((q) => `<p>• ${esc(q)}</p>`).join("")}`;
    else if (s.type === "theory") body = `<p>${esc(s.text)}</p>`;
    else if (s.type === "formulas") body = `<ul>${s.items.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>`;
    else if (s.type === "vocab")
      body = `<table><tbody>${s.items.map((v) => `<tr><th>${esc(v.w)}</th><td>${esc(v.m)}</td></tr>`).join("")}</tbody></table>`;
    else if (s.type === "task")
      body = `<h4>Amaliy topshiriq</h4><p>${esc(s.q)}</p>
        ${s.steps?.length ? `<ol>${s.steps.map((x) => `<li>☐ ${esc(x)}</li>`).join("")}</ol>` : ""}
        ${s.jihoz?.length ? `<p class="lbl">Jihoz: ${s.jihoz.map(esc).join(", ")}</p>` : ""}
        ${s.xavfsizlik?.length ? `<p class="lbl">Xavfsizlik: ${s.xavfsizlik.map(esc).join(" · ")}</p>` : ""}
        <p class="lbl">Natija:</p><div class="line"></div><div class="line"></div><div class="line"></div>
        <p class="lbl">Xulosa:</p><div class="line"></div><div class="line"></div>`;
    else if (s.type === "quiz")
      body = `<p><b>${esc(s.q)}</b></p><ol style="list-style:upper-alpha">${s.opts
        .map((o, i) => `<li ${withAns && i === s.a ? `style="font-weight:700"` : ""}>${esc(o)}</li>`)
        .join("")}</ol>${withAns ? `<p class="answer-key">Javob: ${"ABCD"[s.a]} — ${esc(s.why || "")}</p>` : `<div class="line"></div>`}`;
    return `<div class="psheet-card">${head}${body}</div>`;
  }
  function doPrint() {
    const cards = printCards();
    const picked = cards
      .map((c, i) => ({ c, i }))
      .filter(({ c, i }) => (i in state.print.sel ? state.print.sel[i] : i < 8));
    const per = state.print.per || 4;
    const area = $("#print-area");
    let html = "";
    for (let i = 0; i < picked.length; i += per) {
      const chunk = picked.slice(i, i + per);
      html += `<div class="print-sheet"><div class="pgrid n${per}">${chunk
        .map(({ c }) => printSheet(c.s, c.tp, state.print))
        .join("")}</div></div>`;
    }
    area.innerHTML = html || `<div class="print-sheet"><p>Hech narsa tanlanmagan.</p></div>`;
    TOPICS.forEach((t) => {
      const p = pOf(t.kod);
      p.slidesPrinted = true;
    });
    save();
    window.print();
  }

  /* ---------------- hodisalar ---------------- */
  function bind() {
    $("#tabs").addEventListener("click", (e) => {
      const b = e.target.closest(".tab-btn[data-tab]");
      if (!b) return;
      state.tab = b.dataset.tab;
      state.panel = false;
      render();
    });
    document.addEventListener("click", (e) => {
      const b = e.target.closest("[data-topic]");
      if (!b) return;
      state.topic = b.dataset.topic;
      state.panel = false;
      state.test = null;
      document.body.classList.remove("sb-open");
      render();
      window.scrollTo({ top: 0 });
    });
    $("#search").addEventListener("input", renderSidebar);
    document.addEventListener("click", (e) => {
      const go = e.target.closest("[data-go]");
      if (go) {
        state.tab = go.dataset.go;
        render();
        return;
      }
      const tnav = e.target.closest("#t-body [data-prev], #t-body [data-next], #t-body [data-finish]");
      if (tnav && state.test) {
        if (tnav.hasAttribute("data-finish")) finishTest();
        else {
          state.test.i = clamp(state.test.i + (tnav.hasAttribute("data-next") ? 1 : -1), 0, state.test.questions.length - 1);
          renderTest();
        }
        return;
      }
      const jump = e.target.closest("[data-jump]");
      if (jump && state.test) {
        state.test.i = +jump.dataset.jump;
        renderTest();
        return;
      }
      const act = e.target.closest("[data-act]");
      if (act) {
        const a = act.dataset.act;
        const t = cur();
        if (a === "slides") openSlides(t ? buildSlides(t) : TOPICS.flatMap((x) => buildSlides(x)));
        else if (a === "print") openPrint();
        else if (a === "do-print") doPrint();
        else if (a === "print-all") {
          printCards().forEach((c, i) => (state.print.sel[i] = true));
          openPrint();
        } else if (a === "print-none") {
          printCards().forEach((c, i) => (state.print.sel[i] = false));
          openPrint();
        } else if (a === "close-modal") {
          $("#modal-overlay").classList.remove("on");
          document.body.classList.remove("no-scroll");
        } else if (a === "test-start") {
          startTest();
        } else if (a === "test-exit") {
          if (state.test?.tick) clearInterval(state.test.tick);
          state.test = null;
          render();
        } else if (a === "test-again") {
          startTest();
        } else if (a === "test-new") {
          render();
        } else if (a === "game-reset") {
          render();
        } else if (a === "save-task") {
          save();
          toast("Daftarga saqlandi ✓");
        } else if (a === "clear-task") {
          state.progress[t.kod] = { viewed: true, steps: {}, notebook: {}, answers: {}, test: null };
          save();
          render();
          toast("Tozalandi");
        } else if (a === "reset") {
          if (confirm("Barcha progress va daftarchalar o'chirilsinmi?")) {
            localStorage.removeItem(KEY);
            state.progress = {};
            render();
          }
        } else if (a === "add-row") {
          const p = pOf(t.kod);
          p.notebook.rows = (p.notebook.rows || []).concat({ a: "", b: "", c: "" });
          render();
        } else if (a === "panel") {
          state.panel = !state.panel;
          render();
        } else if (a === "burger") {
          document.body.classList.toggle("sb-open");
        }
      }

      const segBtn = e.target.closest("[data-seg] [data-v]");
      if (segBtn) {
        const seg = segBtn.closest("[data-seg]");
        const v = +segBtn.dataset.v;
        const kind = seg.dataset.seg;
        const cfg = state.test?.cfg || { bob: [cur()?.d || 1], n: 10, mode: "aralash", timer: 0 };
        if (kind === "bob") cfg.bob = cfg.bob.includes(v) ? cfg.bob.filter((x) => x !== v) : cfg.bob.concat(v);
        else cfg[kind] = v;
        state.test = { cfg };
        renderTestTab($("#content"), cur());
      }
      const pBtn = e.target.closest("[data-pseg] [data-v]");
      if (pBtn) {
        const kind = pBtn.closest("[data-pseg]").dataset.pseg;
        state.print[kind] = kind === "scope" ? pBtn.dataset.v : +pBtn.dataset.v;
        openPrint();
      }
      const pick = e.target.closest("[data-pick]");
      if (pick) {
        state.print.sel[pick.dataset.pick] = pick.checked;
        pick.closest(".print-tile").classList.toggle("sel", pick.checked);
      }
    });
    document.addEventListener("change", (e) => {
      const step = e.target.closest("[data-step]");
      if (step) {
        const t = cur();
        if (!t) return;
        const p = pOf(t.kod);
        p.steps[step.dataset.step] = step.checked;
        step.closest(".check-row")?.classList.toggle("done", step.checked);
        save();
      }
    });
    document.addEventListener("input", (e) => {
      const t = cur();
      if (!t) return;
      const nb = e.target.closest("[data-nb]");
      if (nb) {
        pOf(t.kod).notebook[nb.dataset.nb] = e.target.value;
        clearTimeout(save._deb);
        save._deb = setTimeout(save, 400);
      }
      const row = e.target.closest("[data-row]");
      if (row) {
        const p = pOf(t.kod);
        const [i, k] = row.dataset.row.split(".");
        p.notebook.rows = p.notebook.rows || [{ a: "", b: "", c: "" }];
        while (p.notebook.rows.length <= +i) p.notebook.rows.push({ a: "", b: "", c: "" });
        p.notebook.rows[+i][k] = row.value;
        clearTimeout(save._deb);
        save._deb = setTimeout(save, 400);
      }
    });
    document.addEventListener("keydown", (e) => {
      if (!state.slides) return;
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
        state.slides.i = clamp(state.slides.i + 1, 0, state.slides.list.length - 1);
        drawSlides();
      } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        state.slides.i = clamp(state.slides.i - 1, 0, state.slides.list.length - 1);
        drawSlides();
      } else if (e.key === "Escape") closeSlides();
    });
    $("#slides").addEventListener("click", (e) => {
      const b = e.target.closest("[data-sl]");
      if (!b || !state.slides) return;
      const k = b.dataset.sl;
      if (k === "next") { state.slides.i = clamp(state.slides.i + 1, 0, state.slides.list.length - 1); drawSlides(); }
      else if (k === "prev") { state.slides.i = clamp(state.slides.i - 1, 0, state.slides.list.length - 1); drawSlides(); }
      else if (k === "close") closeSlides();
      else if (k === "print-now") {
        state.print = state.print || { scope: "mavzu", per: 1, sel: {} };
        const cards = printCards();
        state.print.per = 1;
        cards.forEach((c, i) => (state.print.sel[i] = i === state.slides.i));
        doPrint();
      }
    });
    $("#modal-overlay").addEventListener("click", (e) => {
      if (e.target.id === "modal-overlay") {
        e.target.classList.remove("on");
        document.body.classList.remove("no-scroll");
      }
    });
    window.addEventListener("beforeprint", () => {
      // chop paytida tanlanma bo'lmasa — joriy mavzu slaydlarini chiqaramiz
      if (!$("#print-area").innerHTML.trim()) {
        state.print = state.print || { scope: "mavzu", per: 4, sel: {} };
        doPrint();
      }
    });
    window.addEventListener("afterprint", () => {
      $("#print-area").innerHTML = "";
    });
  }

  if (typeof document !== "undefined" && document.getElementById("topics-data")) {
    document.addEventListener("DOMContentLoaded", () => {
      bind();
      render();
    });
  }

  /* test uchun ichki funksiyalar */
  window.__TF = { TOPICS, BOBS, buildTest, buildSlides, slideHTML, printSheet, mezonList, DATA };
})();

    </script>
  </body>
</html>
