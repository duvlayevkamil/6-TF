ing oldini olish","chorak":1,"lab":"mikrob","labMode":"spreu","labTitle":"","theory":"Kasallik tarqalishining oldini olish uchun zanjirning istalgan bo'g'ini uzilishi yetarli. Amalda to'rt asosiy chora ishlatiladi.\n\n1) Manbaga ta'sir: kasalni erta aniqlash, davolash, zarur bo'lsa ajratish (karantin), hayvonlar kasalligida veterinariya nazorati.\n\n2) Uzatish yo'lini uzish: qo'l yuvish, toza suv, ovqatni yaxshilab pishirish va yuvish, xonani shamollatish, nam tozalash, niqob va masofa, hasharotlarga qarshi choralarni ko'rish.\n\n3) Kirish eshigini mustahkamlash: terini shikastlanishdan saqlash, og'iz va burun bo'shlig'i gigiyenasi, toza doka va antiseptik.\n\n4) Organizmga qarshilikni oshirish: emlash (vaktsina), to'g'ri ovqatlanish, uyqu, harakat, badanga shifobaxsh odatlar.\n\nEmlash — maxsus tayyorlangan preparat yordamida organizmni «tanish»iga o'rgatish. Vaktsina kasallikning o'g'ir ko'rinishini berishdan avval immun tizimini tayyorlaydi, shuning uchun u eng samarali oldini olish choralaridan biridir.\n\n«Pufakchi yordamida asirish» tajribasi ko'rsatadiki, tomchilar 1 metrdan uzoqqa tarqaladi — masofa va niqob shu sababli ishlaydi. Hasharotlar chaqishi bilan tarqaladigan kasalliklarda esa uy ichidagi chakana suv idishlarini yo'q qilish, setka va repellantlar muhim.","formulas":["Oldini olish = zanjirning bir bo'g'ini uzilsa yetarli","4 chora: manba | uzatish yo'li | kirish eshigi | qarshilik","Qo'l yuvish — eng arzon va eng samarali chora","Vaktsina — immun tizimini erta tayyorlaydi","Tomchilar ~1 m gacha tarqaladi → masofa + niqob","Hasharotlar: suv to'planadigan joylarni yo'q qilish"],"vocab":[{"w":"Profilaktika","m":"kasallikning oldini olish tadbirlari"},{"w":"Vaktsina","m":"organizmni mikroblarga qarshilikka tayyorlovchi preparat"},{"w":"Antiseptik","m":"mikroblarni o'ldiruvchi yoki ko'payishini to'xtatuvchi modda"},{"w":"Dezinfeksiya","m":"buyum va xonalardagi mikroblarni yo'q qilish"},{"w":"Repellant","m":"hasharotlarni qaytaruvchi vosita"},{"w":"Dispersiya","m":"tomchilarning havoga tarqalishi"}],"quiz":[["Qaysi chora «uzatish yo'lini uzish»ga kiradi?",["Vaktsina qilish","Ko'z tomchisi","Qo'l yuvish","Kasalni davolash"],2,"Gigiyena mikrobning bir joydan ikkinchisiga o'tishini to'xtatadi."],["Emlash qaysi yo'nalishda ishlaydi?",["Tomchilarni ushlaydi","Organizmning qarshiligini oshiradi","Manbani yo'q qiladi","Kirish eshigini yopadi"],1,"Vaktsina — qo'shimcha chidamlilik chorasi."],["Pufakchi tajribasi nimani isbotlaydi?",["Ovoz kuchayadi","Havo harorati oshadi","Mikroblar o'ladi","Asirilganda tomchilar ancha uzoqqa tarqaladi"],3,"Ko'rinadigan tomchilar — havo-tomchi yo'lining isboti."],["Nima uchun xonani shamollatish tavsiya etiladi?",["Ovoz tarqaladi","Xona sovib qoladi","Havadagi mikrob va namlik konsentratsiyasi kamayadi","Chiroq yonadi"],2,"Toza havo — uzatish yo'lini zaiflashtiruvchi oddiy chora."],["Hasharotlar chaqishi orqali tarqaladigan kasalliklarga qarshi nima qilish kerak?",["Uy atrofida suv to'planadigan idishlarni yo'q qilish","Xonani qorong'i qilish","Derazani yopib qo'yish","Ko'proq ovqat yeysiz"],0,"Suvda ko'payadigan hasharotlarning manbai yo'q qilinadi."]],"slideQuiz":[["Kasalni erta aniqlash va ajratish qaysi bo'g'inga ta'sir qiladi?",["Kirish eshigiga","Manbaga","Ovqatlanishga","Immun tizimiga"],1,"Manba nazorati — kasal organizmning aloqasini cheklash."],["Qaysi ma'lumot ishonchsiz?",["«Vaktsina kasallikning og'ir oqibatlari kamaytiradi»","«Bu tabletka barcha viruslarni 1 kunda yo'q qiladi»","«Qo'l yuvish infeksiyani kamaytiradi»","«Kasalni davolash shifokor nazoratida»"],1,"«Mirakul» va'dalar, tekshirilmagan ma'lumot — ishonch alomati."]],"game":[["Chorani zanjir bo'g'ini bilan moslashting: niqob taqish",["Uzatish yo'li","Kirish eshigi","Manba","Qarshilik"],0,"Niqob tomchilarning havo orqali o'tishini kamaytiradi."],["Ovqatni yaxshilab pishirish qaysi choraga kiradi?",["Karantin","Davolash","Uzatish yo'lini uzish","Emlash"],2,"Issiqlik mikroblarni yo'q qiladi va ovqat orqali yuqishning oldini oladi."],["Chakana suv idishini to'kish — nimaga qarshi chora?",["Irsiy kasallikka","Havo-tomchiga","Teri orqali yuqishga","Hasharotlar orqali yuqishga"],3,"Lichinka suvda rivojlanadi — manbai yo'q qilinadi."]],"gameQuiz":[["Chorani zanjir bo'g'ini bilan moslashting: niqob taqish",["Uzatish yo'li","Kirish eshigi","Manba","Qarshilik"],0,"Niqob tomchilarning havo orqali o'tishini kamaytiradi."],["Ovqatni yaxshilab pishirish qaysi choraga kiradi?",["Karantin","Davolash","Uzatish yo'lini uzish","Emlash"],2,"Issiqlik mikroblarni yo'q qiladi va ovqat orqali yuqishning oldini oladi."],["Chakana suv idishini to'kish — nimaga qarshi chora?",["Irsiy kasallikka","Havo-tomchiga","Teri orqali yuqishga","Hasharotlar orqali yuqishga"],3,"Lichinka suvda rivojlanadi — manbai yo'q qilinadi."]],"task":{"q":"«Kasallik tarqalishining oldini qanday olish mumkin?» — maktab uchun 1 haftalik profilaktika reja tuzing: 4 ta chora, har biriga qaysi zanjir bo'g'ini uzilishini yozing.","a":"Namuna: (1) sinfda qo'l yuvish jadvali — uzatish yo'li; (2) kasal o'quvchini uyga yuborish — manba; (3) xonani shamollatish va nam tozalash — uzatish yo'li; (4) to'g'ri ovqatlanish va uyqu rejimi — qarshilik.","why":"Reja har bir harakatning «nimaga qarshi»ligini ko'rsatsa, o'quvchi chorani tushunadi va boshqalarga tushuntira oladi.","steps":["Sinfdagi kunlik ritmni yozing (nonushta, tanaffus, tozalash)","Har ritmga zanjir bo'g'inini moslang","Jadval tuzing: chora — kim bajaradi — qachon — qaysi bo'g'in","Kerakli resurs va jihozlarni yozing","Baholash mezonini qo'shing: haftadan keyin nima o'zgardi?"],"jihoz":["Jadval varaqasi","Sinfdagi kun tartibi","Poster yoki slayd uchun qog'oz"],"xavfsizlik":["Antiseptik va dezinfeksiya vositalarini ustoz nazoratisiz ishlatmang","Dori vositalarini tavsiya qilmang — bu shifokor ishi"]},"act":{"type":"lab","name":"mikrob","mode":"spreu"},"kitob":{"bobNomi":"Kasalliklar","bet":32,"oralig":"32–46","kod":"3.2","amaliyIsh":{"kod":"3.2","nomi":"Purkagich yordamida “aksirish”","bet":31},"boshqotirma":35,"bilimlarXaritasi":36,"takrorlash":37,"mustahkamlash":40},"urinish":{"savollar":["Kasallik tarqalishining oldini qanday olish mumkin?","Hasharotlar chaqishidan qanday himoyalanish zarur?"],"qism_mavzular":[],"konikmalar":["ilmiy tushunchani tasvirlash va izohlashda modeldan foydalanish;","ilmiy tushunchani anglashda modelning ahamiyatini bayon etish;","nazorat qilinadigan tajriba rejasini tuzish va uch xil o‘zgaruvchini aniqlash;","tadqiqot uchun kerakli jihozlarni tanlash va ulardan to‘g‘ri foydalanish;","turli tadqiqot metodlarining o‘ziga xos xususiyatlarini anglash;","amaliy ishni bajarish davomida yuzaga kelishi mumkin bo‘lgan xavflarni hamda ularni kamaytirish yo‘llarini bayon etish;","egallangan bilimlarni qo‘llab tadqiqot natijalarini bashorat qilish;","kuzatish natijalarini taqdim etish uchun jadval tuzish;","tadqiqot natijalariga asoslanib ilmiy xulosa chiqarish;","tadqiqot natijalariga asoslanib bashoratning aniqligini bayon etish;","nuqtali diagrammadan foydalanib tadqiqot natijalarini izohlash;","turli ma’lumot manbalaridan olingan dalillardan foydalanib savollarga javob berish."],"tatbiq":["ilmiy bilimlar vaqt o‘tishi bilan o‘zgarishini ko‘rsatish uchun to‘plangan dalillardan foydalanish;","tabiiy fanlarning muayyan sohasida faoliyat yurituvchi kasb egalarini aniqlash va ularning faoliyatini tavsiflash;","bahs-munozarada o‘z nuqtayi nazarini ilmiy dalillardan foydalanib asoslash."]}},{"d":3,"c":3,"kod":"3.3","t":"Odam organizmining himoya mexanizmlari","chorak":1,"lab":"himoya","labMode":"tosiqlar","labTitle":"","theory":"Organizm mikroblarga qarshi bir necha darajada himoyalanadi. Birinchi himoya chizig'i — tashqi to'siqlar: teri, shilliq qavatlar, tupurik, oshqozon kislotasi, yosh suyuqligi, burundagi tukchalar va asqinish refleksi. Ular mikrobdan fizik va kimyoviy to'siq bo'lib xizmat qiladi.\n\nIkkinchi himoya chizig'i — umumjavob. Shikast bo'lsa: qon ivishi jarohatni berkitadi, yallig'lanish (qizil, issiq, shishgan, og'riqli holat) boshlanadi, fagotsitlar mikroblarni yutadi, harorat ko'tarilib ko'payishni sekinlashtiradi.\n\nUchinchi himoya chizig'i — maxsus (spesifik) javob: limfotsitlar. Antigen — mikrobdagi «belgi». B-limfotsitlar antitel ishlab chiqaradi; antitel antigenga moslab qulflanadi. T-limfotsitlar yuqumlangan hujayralarga ta'sir qiladi. Xotira hujayralari shu mikrobni eslab qoladi — takror uchrashganda javob tez va kuchli bo'ladi. Emish aynan shu mexanizmni «o'qitish» uchun ishlatiladi.\n\nImmunlik ikki xil: tabiiy (onisdan bo'ladigan to'siqlar va avvaldan o'tgan kasallikdan keyingi xotira) va sun'iy (emlashdan keyin). Ona sutidagi antitelalar chaqaloqqa birinchi himoyani beradi.","formulas":["1-chiziq: teri va shilliq qavatlar (fizik + kimyoviy to'siq)","2-chiziq: yallig'lanish, fagotsitoz, qon ivishi, harorat","3-chiziq: limfotsitlar, antitelalar, xotira hujayralari","Antigen — mikrobning «belgisi»; antitel — unga mos oqsil","Xotira hujayralari → takror javob tezroq va kuchliroq","Immunlik: tabiiy va sun'iy (vaktsina)"],"vocab":[{"w":"Immunitet","m":"organizmning kasalliklarga qarshi turish qobiliyati"},{"w":"Antigen","m":"organizmda antitel ishlab chiqarishga sabab bo'ladigan modda"},{"w":"Antitel","m":"antigenga birikib, zararsizlantiruvchi maxsus oqsil"},{"w":"Fagotsit","m":"mikroblarni yutib hazm qiluvchi oq qon hujayrasi"},{"w":"Yallig'lanish","m":"shikast yoki infektsiyaga umumiy javob"},{"w":"Xotira hujayrasi","m":"mikrobni «eslab» keyingi javobni tezlashtiruvchi limfotsit"}],"quiz":[["Qaysi omma birinchi himoya chizig'iga kiradi?",["Antitelalar","Teri va shilliq qavatlar","Fagotsitlar","Xotira hujayralari"],1,"Tashqi to'siqlar mikrobing kirishiga to'siq bo'ladi."],["Antitelaning vazifasi nima?",["Haroratni ko'taradi","Mikroblarni yutadi","Qonni ivitadi","Antigenga birikib zararsizlantiradi"],3,"Moslik «kalit — kilti» tamoyili bilan antitel ishlaydi."],["Emlash qaysi chiziqni tayyorlaydi?",["Birinchi — teri","Uchinchi — maxsus javob","Hech birini","Ikkinchi — yallig'lanish"],1,"Vaktsina xotira hujayralarini shakllantiradi."],["Yaraga qon ivib qobiq hosil qilishi — nima?",["Irsiy belgi","Allergik javob","Birinchi chiziq","Ikkinchi himoya chizig'i javobi"],3,"Qobiq mikroblarning kirishini to'sadi — umumiy javob."],["Chaqaloq ona sutidan qanday himoya oladi?",["Harorat orqali","Terisi qalinlashib","Tayyor antitelalar bilan","Vaktsina orqali"],2,"Sutdagi antitelalar — passiv immunlikning namunasi."]],"slideQuiz":[["Ikkinchi himoya chizig'iga xos bo'lmagan belgi — qaysi?",["Yallig'lanish","Harorat ko'tarilishi","Fagotsitoz","Mikrobni tanib olish va xotira saqlash"],3,"Xotira va «tanish» — uchinchi, maxsus chiziqning ishi."],["«Mikrobni yutib hazm qilish» — qaysi hujayra vazifasi?",["Fagotsit","Neyron","Eritrotsit","Trombotsit"],0,"Oq qon hujayralarining bir turi fagotsitozni bajaradi."]],"game":[["Vazifani organ/hujayra bilan moslashting: qonni ivitish",["Trombotsitlar","Fagotsitlar","Eritrotsitlar","Limfotsitlar"],0,"Trombotsitlar jarohatni berkitadi."],["Qaysi modda oshqozonda mikrobni o'ldiradi?",["O't","Xlorid kislotasi","Tupurik","Insulin"],1,"Kislota — kimyoviy to'siq; ovqatdagi ko'p mikroblar shu yerda nobud bo'ladi."],["Allergiya — immun javobning qanday ko'rinishi?",["Yo'qligi","Irsiy o'zgarishi","Umumiy susayishi","Ziyonli darajada kuchayishi"],3,"Allergiya — zararsiz moddaga noto'g'ri kuchli javob."]],"gameQuiz":[["Vazifani organ/hujayra bilan moslashting: qonni ivitish",["Trombotsitlar","Fagotsitlar","Eritrotsitlar","Limfotsitlar"],0,"Trombotsitlar jarohatni berkitadi."],["Qaysi modda oshqozonda mikrobni o'ldiradi?",["O't","Xlorid kislotasi","Tupurik","Insulin"],1,"Kislota — kimyoviy to'siq; ovqatdagi ko'p mikroblar shu yerda nobud bo'ladi."],["Allergiya — immun javobning qanday ko'rinishi?",["Yo'qligi","Irsiy o'zgarishi","Umumiy susayishi","Ziyonli darajada kuchayishi"],3,"Allergiya — zararsiz moddaga noto'g'ri kuchli javob."]],"task":{"q":"«Organizmni himoya qiluvchi to'siq» tajribasini tuzing: toza va sovunlangan qo'l bilan yupqa qatlamli jelidagi «mikrob» izlarini taqqoslang va natijani rasm/jadval bilan hujjatlang.","a":"Sovunlangan qo'l bosilgan qismda «mikrob» (uchun bo'yoq yoki jel ustidagi kukun) ancha kam bo'ladi — sovun va suv mikroblarni mexanik ravishda yuvib ketadi.","why":"Bu — nazorat qilinadigan tajriba: bitta sharoit (qo'l holati) o'zgartiriladi, qolganlari bir xil; takroriy bosish tasodifni kamaytiradi.","steps":["Ikki idishdagi bir xil jelga bo'yoq/kraxmal kukunini surting","Chap qo'l — toza, o'ng qo'l — sovun bilan yuvilgan va quritilgan","Ikkala qo'l bilan jellni bir xil kuch bilan bosing","Qolgan «iz» maydonini katakka bo'ling va sanang","Jadval va diagramma tuzing, xulosa yozing: farq necha barobar?"],"jihoz":["2 idishdagi shaffof jel yoki kraxmal suyuqligi","Sovun, sochiq","Bo'yoq/kukun (mikrob o'rniga)","Katakli qog'oz, lupa"],"xavfsizlik":["Haqiqiy kasal material bilan ishlamang","Tajribadan keyin qo'l sovun bilan yuviladi","Bo'yoqni ko'zga va og'izga tegizmang"]},"act":{"type":"lab","name":"himoya","mode":"tosiqlar"},"kitob":{"bobNomi":"Kasalliklar","bet":32,"oralig":"32–46","kod":"3.3","amaliyIsh":{"kod":"3.3","nomi":"Organizmni himoya qiluvchi to‘siq","bet":33},"boshqotirma":35,"bilimlarXaritasi":36,"takrorlash":37,"mustahkamlash":40},"urinish":{"savollar":["Odam organizmi kasalliklarga qarshi qanday kurashadi?"],"qism_mavzular":[],"konikmalar":["ilmiy tushunchani tasvirlash va izohlashda modeldan foydalanish;","ilmiy tushunchani anglashda modelning ahamiyatini bayon etish;","nazorat qilinadigan tajriba rejasini tuzish va uch xil o‘zgaruvchini aniqlash;","tadqiqot uchun kerakli jihozlarni tanlash va ulardan to‘g‘ri foydalanish;","turli tadqiqot metodlarining o‘ziga xos xususiyatlarini anglash;","amaliy ishni bajarish davomida yuzaga kelishi mumkin bo‘lgan xavflarni hamda ularni kamaytirish yo‘llarini bayon etish;","egallangan bilimlarni qo‘llab tadqiqot natijalarini bashorat qilish;","kuzatish natijalarini taqdim etish uchun jadval tuzish;","tadqiqot natijalariga asoslanib ilmiy xulosa chiqarish;","tadqiqot natijalariga asoslanib bashoratning aniqligini bayon etish;","nuqtali diagrammadan foydalanib tadqiqot natijalarini izohlash;","turli ma’lumot manbalaridan olingan dalillardan foydalanib savollarga javob berish."],"tatbiq":["ilmiy bilimlar vaqt o‘tishi bilan o‘zgarishini ko‘rsatish uchun to‘plangan dalillardan foydalanish;","tabiiy fanlarning muayyan sohasida faoliyat yurituvchi kasb egalarini aniqlash va ularning faoliyatini tavsiflash;","bahs-munozarada o‘z nuqtayi nazarini ilmiy dalillardan foydalanib asoslash."]}},{"d":4,"c":1,"kod":"4.1","t":"Oziq zanjirlari va oziq to‘ri","chorak":2,"lab":"zanjir","labMode":"tuzish","labTitle":"","theory":"Tabiatda hech qaysi organizm o'z-o'zidan yo'qdan paydo bo'lmaydi va yo'qolmaydi — moddalar va energiya organizmlar orasida ko'chadi. Buni ko'rsatuvchi sxema — oziq zanjiri.\n\nOziq zanjiri boshlanishi doim prodyuserdan (yashil o'simlik, suv suvo'tlari) bo'ladi: ular Quyosh energiyasidan foydalanib organik modda hosil qiladi. Keyin konsumentlar keladi: 1-tartibli — o'simxo'rlar, 2- va 3-tartibli — yirtqichlar, oxirida ajratgichlar (bakteriya va zamburug'lar) qoldiq moddalarni mineral moddalarga aylantiradi va ular qaytadan o'simlikka o'tadi.\n\nStrelka har doim «kimdan → kimga» emas, «energiya qayerga oqadi» degan ma'noda qo'yiladi: o't → shivilin → bo'ri.\n\nTabiatda zanjirlar alohida emas, o'zaro kirishib yotadi — bu oziq to'ri. Bir organizm bir nechta zanjirda ishtirok etadi, shuning uchun bitta bo'g'in uzilganda tizim butunlay buzilmaydi; biroq to'ri murakkab va barqaror tizim qancha ko'p bog'langan bo'lsa, o'sha darajada chidamli bo'ladi.\n\nTrofik daraja — organizmning zanjirdagi o'rni. Har bir bosqichda energiyaning faqat taxminan 10% keyingisiga o'tadi, qolgani issiqlik va harakatga sarflanadi. Shu sababli zanjir odatda 4-5 bosqichdan oshmaydi va yirtqichlar soni har doim kamroq bo'ladi.","formulas":["Zanjir boshi = prodyuser (o'simlik, suvo't)","Konsument I = o'simxo'r; konsument II–III = yirtqichlar","Ajratgichlar = organizm qoldiqlarini mineral moddaga aylantiradi","Strelka = energiya oqimi yo'nalishi","Har bosqichda energiyaning ~10% keyingisiga o'tadi","Oziq to'ri = bir-biriga kirishgan zanjirlar to'plami"],"vocab":[{"w":"Prodyuser","m":"organik modda hosil qiluvchi yashil organizm"},{"w":"Konsument","m":"tayyor organik modda bilan oziqlanuvchi organizm"},{"w":"Ajratgich (reducent)","m":"qoldiqlarni mineral moddalarga aylantiruvchi organizm"},{"w":"Trofik daraja","m":"organizmning oziq zanjiridagi o'rni"},{"w":"Oziq to'ri","m":"o'zaro bog'langan oziq zanjirlar tizimi"},{"w":"Bioenergetik piramida","m":"energiyaning darajalar bo'yicha kamayishini ko'rsatuvhi sxema"}],"quiz":[["Oziq zanjiri doim kimdan boshlanadi?",["Ajratgichdan","O'simxo'rdan","Yirtqichdan","Prodyuserdan"],3,"Zanjir boshi — energiyani Quyoshdan oluvchi organizm."],["Strelka nimani ko'rsatadi?",["Harakat tezligini","Kim kimdan qochishini","Energiya qayerga o'tishini","Qaysi biri kuchliroq ekanini"],2,"Strelka energiya oqimi yo'nalishini beradi."],["Energiyaning necha foizi keyingi trofik darajaga o'tadi?",["Barchasi","Taxminan 90%","Taxminan 10%","Taxminan 50%"],2,"Qolgani metabolizm va issiqlikka sarflanadi."],["Oziq to'ri oziq zanjiridan nimasi bilan farq qiladi?",["U faqat suvda bo'ladi","U qisqaroq","Unda prodyuser yo'q","Zanjirlar o'zaro kirishib yotadi"],3,"To'ri — ko'p zanjirlar to'plami, barqarorlikni oshiradi."],["Zanjir odatda nega 4-5 bosqichdan oshmaydi?",["Organizm kam","Bunday cheklov yo'q","Energiya har bosqichda kamayadi","Yirtqichlar uchishi qiyin"],2,"Yuqori darajaga yetarli energiya yetib bormaydi."]],"slideQuiz":[["Hasharotxo'r qushlar soni keskin kamaysa, tizimda nima bo'lishi kutiladi?",["Hech narsa o'zgarmaydi","O'simliklar yo'qoladi","Hasharotlar ko'payadi, o'simlik zararlanadi","Yirtqichlar ko'payadi"],2,"Bo'g'in uzilganda qo'shni zanjirlar qisman o'rnini bosadi, ammo muvozanat buziladi."],["Ajratgichlar bo'lmaganida nima sodir bo'lardi?",["Hech qanday farq bo'lmasdi","Qoldiqlar to'planib, mineral moddalar tugardi","O'simlik tez o'sardi","Zanjir uzaytardi"],1,"Modda aylanishi to'xtaydi — hayot uchun muhim bosqich."]],"game":[["Organizmni trofik darajasi bilan moslashting: qo'ng'iz lichinkasi (o'simlik bilan oziqlanadi)",["Prodyuser","Ajratgich","Konsument II","Konsument I"],3,"O'simlik bilan oziqlangan — 1-tartibli konsument."],["Zanjirni to'g'ri tartibga tizing: energiya oqimi",["ilon → bo'ri → o't → sichqon","sichqon → o't → bo'ri → ilon","o't → sichqon → ilon → bo'ri","bo'ri → ilon → sichqon → o't"],2,"Prodyuserdan yuqori konsumentgacha."],["Qo'shiqchi zamburug'larning vazifasi zanjirda qanday?",["Yirtqich","Konsument I","Ajratgich","Prodyuser"],2,"Zamburug'lar o'lik moddalarni mineral moddaga aylantiradi."]],"gameQuiz":[["Organizmni trofik darajasi bilan moslashting: qo'ng'iz lichinkasi (o'simlik bilan oziqlanadi)",["Prodyuser","Ajratgich","Konsument II","Konsument I"],3,"O'simlik bilan oziqlangan — 1-tartibli konsument."],["Zanjirni to'g'ri tartibga tizing: energiya oqimi",["ilon → bo'ri → o't → sichqon","sichqon → o't → bo'ri → ilon","o't → sichqon → ilon → bo'ri","bo'ri → ilon → sichqon → o't"],2,"Prodyuserdan yuqori konsumentgacha."],["Qo'shiqchi zamburug'larning vazifasi zanjirda qanday?",["Yirtqich","Konsument I","Ajratgich","Prodyuser"],2,"Zamburug'lar o'lik moddalarni mineral moddaga aylantiradi."]],"task":{"q":"O'z mintaqangizdan 6 ta organizm tanlab, oziq zanjiri tuzing va uni oziq to'riga aylantiring. So'ng bitta bog'ichni «o'chirib» tizimga ta'sirini tahlil qiling.","a":"To'g'ri tuzilgan zanjir: prodyuser → konsument I → konsument II (+ ajratgich alohida belgilanadi). O'simxo'r yo'qolsa, yirtqich energiyasiz qoladi; prodyuser esa ortib ketishi mumkin.","why":"O'zingiz yashaydigan joy organizmlari bilan ishlash ma'lumotni tekshiriladigan qiladi; «o'chirish» sinovi esa bog'lanishlarni chuqur tushunishni talab qiladi.","steps":["6-8 organizm ro'yxatini tuzing (kamida 2 o'simlik)","Har biriga kim bilan oziqlanishini yozing","Strelkalar bilan chizing; energiya oqimi yo'nalishini tekshiring","Bir turi bo'lmagan organizmni o'chirib, 2 ta oqibatni yozing","Xulosa: qaysi bo'g'in eng muhim edi va nima uchun?"],"jihoz":["Qog'oz va rangli qalam","Qishloq/maktab atrofi ro'yxati","Bitta o'chirish uchun qaychi yoki o'chirg'ich"],"xavfsizlik":["Yovvoyi hayvonlarni ushlamang — faqat kuzatish va ma'lumot bilan ishlang","Zaxarli o'simlik va hasharotlarga tegmang"]},"act":{"type":"lab","name":"zanjir","mode":"tuzish"},"kitob":{"bobNomi":"Oziq zanjiri va oziq to‘ri","bet":47,"oralig":"47–59","kod":"4.1","amaliyIsh":{"kod":"4.1","nomi":"Oziq zanjiri tuzish","bet":41},"boshqotirma":45,"bilimlarXaritasi":46,"takrorlash":47,"mustahkamlash":49},"urinish":{"savollar":["Oziq zanjirlari va oziq to‘rlari qanday tuzilgan?"],"qism_mavzular":[],"konikmalar":["turli manbalardan olingan ma’lumotlarga asoslanib tirik organizmlarni tasniflash;","ilmiy hodisani tushunishda modelning ahamiyatini bayon etish;","ilmiy hodisani tasvirlash va izohlashda modeldan foydalanish."],"tatbiq":["tabiiy fanlar yutuqlaridan kundalik hayotda foydalanilishini bayon etish;","fan va texnologiya yutuqlaridan foydalanishning atrof-muhitga ijobiy va salbiy ta’sirini muhokama qilish."]}},{"d":4,"c":2,"kod":"4.2","t":"Energiya va zaharli moddalar oqimi","chorak":2,"lab":"zanjir","labMode":"birikish","labTitle":"","theory":"Oziq zanjiri bo'ylab energiya bilan birga turli moddalar ham ko'chadi. Ba'zi moddalar organizmdan chiqib ketmaydi — ular to'qimalarda yig'iladi. Bu hodisa bioakkumulyatsiya deb ataladi.\n\nMechanizm: organizm moddani oz miqdorda doim qabul qiladi, lekin uni ajratib chiqara olmaydi (yoki juda sekin). Shuning uchun har trofik darajada konsentratsiya ortadi. Masalan, suvda erigan zahar suvo'tlarida, ular bilan oziqlanuvchi baliqcha organizmida, yirik baliq va nihoyat baliq bilan oziqlanuvchi qushdagi konsentratsiya bir necha yuz- ming marta yuqori bo'lishi mumkin.\n\nEnergiya oqimi va moddalar aylanishi o'xshash, ammo bir xil emas: energiya doim issiqlik sifatida «chiqib ketadi», moddalar esa aylanada qoladi. Shu sabab energiya uchun Quyosh kerak, moddalar uchun esa ajratgichlar.\n\nZaharli moddalar manbalari: sanoat chiqindilari, pestitsidlar, og'ir metallar, plastik bo'laklari va ular yutgan microplastic. Amalda eng muhim savol: «bu kimning dasturxoniga yetib keladi?» — javob insonni ham o'z ichiga oladi, chunki biz zanjirning tepa qismin damiz.","formulas":["Bioakkumulyatsiya = to'qimada modda yig'ilishi","Biologik kuchayish = har darajada konsentratsiya ortadi","Energiya: oqim → issiqlik (aylanada qolmaydi)","Moddalar: aylanada qoladi (ajratgichlar qaytaradi)","Zanjir uzunligi va daraja soni cheklangan","Xavf bahosi: miqdor + chastota + chiqib ketish tezligi"],"vocab":[{"w":"Bioakkumulyatsiya","m":"moddaning organizm to'qimasida yig'ilishi"},{"w":"Biologik kuchayish","m":"modda konsentratsiyasining trofik daraja bo'yicha ortishi"},{"w":"Pestitsid","m":"zararkunanda kurashish uchun ishlatiluvchi kimyoviy modda"},{"w":"Og'ir metall","m":"organizmdan chiqib ketmaydigan zaharli element (simob, qo'rg'oshin)"},{"w":"Mikroplastik","m":"mayda plastik bo'laklari; suv organizmlariga kiradi"},{"w":"Sanoat chiqindisi","m":"ishlab chiqarishdan qoladigan ifloslantiruvchi oqim"}],"quiz":[["Bioakkumulyatsiya nima?",["Zanjirning uzilishi","O'simlikning o'sishi","Energiyaning kamayishi","Moddaning organizm to'qimasida yig'ilishi"],3,"Modda chiqib ketmaydi — organizmda qoladi va ko'payadi."],["Zanjirda eng yuqori konsentratsiya odatda kimda bo'ladi?",["Suvda","Tepa yirtqichda","O'simlikda","Ajratgichlarda"],1,"Har bosqichda kuchayadi — tepadagi organizm eng ko'p oladi."],["Energiya va moddalar aylanishining asosiy farqi nimada?",["Modda yo'qoladi, energiya aylanadi","Energiya issiqlik bo'lib chiqib ketadi, modda aylanadi","Ikkalasi ham aylanada qoladi","Hech qaysi aylanmaydi"],1,"Shu sabab doimiy Quyosh energiyasi kerak."],["Zanjir bo'ylab energiya kamayishining asosiy sababi nima?",["Yirtqichlar ovqatni sekin yeydi","Strelkalar to'g'ri chizilmagan","Har bosqichda harakat va issiqlikka sarflanadi","O'simlik energiyani yashiradi"],2,"Sarflangan energiya qaytmaydi — shu tufayli darajalar soni cheklangan."],["Qaysi holatda xavf kattaroq?",["Modda tez chiqadi, kam keladi","Modda umuman kirib kelmaydi","Modda sekin chiqadi va tez-tez keladi","Faqat bitta ovqatda uchraydi"],2,"Chiqib ketish sekin + chastota yuqori = to'planish."]],"slideQuiz":[["Simob bilan ifloslangan suv havzasida eng katta konsentratsiya kimda kutiladi?",["Suvo'tlarda","Mayda baliqchada","Yirik yirtqich baliqda","Suvda"],2,"Tepa konsumentgacha kuchayadi."],["Pestitsid ishlatishning ekotizimga salbiy ta'siriga misol — nima?",["Tuproq unumdor bo'ladi","Energiya ortadi","Changlatuvchi hasharotlar ham nobud bo'ladi","Zanjir uzayadi"],2,"Maqsadli bo'lmagan nobud bo'lish — oziq to'rini buzadi."]],"game":[["Jarayonni atama bilan moslashting: konsentratsiyaning darajalar bo'yicha ortishi",["Emulsiyalash","Kondensatsiya","Diffuziya","Biologik kuchayish"],3,"Bu atama zanjir bo'ylab ortishni bildiradi."],["Mikroplastik birinchi bo'lib kimga kiradi?",["Toshqotgan qoldiqlarga","Inson terisiga","Yirtqich qushlarga","Suvo't va mayda organizmlarga"],3,"Zanjir pastidan boshlanadi."],["Qaysi chora bioakkumulyatsiyani kamaytiradi?",["Ovqatlanishni ko'paytirish","Zanjirni uzaytirish","Sanoat oqovasini tozalash","Ko'proq pestitsid"],2,"Manbada tozalash — eng samarali chora."]],"gameQuiz":[["Jarayonni atama bilan moslashting: konsentratsiyaning darajalar bo'yicha ortishi",["Emulsiyalash","Kondensatsiya","Diffuziya","Biologik kuchayish"],3,"Bu atama zanjir bo'ylab ortishni bildiradi."],["Mikroplastik birinchi bo'lib kimga kiradi?",["Toshqotgan qoldiqlarga","Inson terisiga","Yirtqich qushlarga","Suvo't va mayda organizmlarga"],3,"Zanjir pastidan boshlanadi."],["Qaysi chora bioakkumulyatsiyani kamaytiradi?",["Ovqatlanishni ko'paytirish","Zanjirni uzaytirish","Sanoat oqovasini tozalash","Ko'proq pestitsid"],2,"Manbada tozalash — eng samarali chora."]],"task":{"q":"Zaharli moddalar oziq zanjiri bo'ylab qanday uzatiladi? Modellash: 4 bosqichli zanjirga har darajada 10 birlik modda «kirib» kelsa, har konsumentda nechta to'planishini hisoblab, diagramma tuzing.","a":"Har darajada to'planish ortadi: prodyuser 10, konsument I ≈ 100, konsument II ≈ 1000, tepa konsument ≈ 10 000 birlik (model shartiga ko'ra). Diagramma — tik ko'tarilgan ustunlar.","why":"Model — real hodisani soddalashtiradi: unda miqdor farqlari aniq ko'rinadi, ammo organizmning haqiqiy metabolizmi hisobga olinmaydi. Shu chegarani yozish muhim.","steps":["Zanjirni yozing: suvo't → baliqcha → yirik baliq → qush","Har bosqichga kiradigan modda miqdorini belgilang (shartni o'zingiz yozing)","Chiqib ketish ~10% deb olsangiz, qolganini hisoblang","Jadval va ustunli diagramma tuzing","Xulosa: nima uchun tepadagi organizmlar xavf ostida? Modelning kamchiligi qaysi?"],"jihoz":["Kalkulyator","Katakli qog'oz","Diagramma uchun shkala"],"xavfsizlik":["Haqiqiy zaharli moddalar bilan ishlanmaydi — faqat model va ma'lumot","Hisobda birliklarni chalkashtirmang (mg, mg/kg)"]},"act":{"type":"lab","name":"zanjir","mode":"birikish"},"kitob":{"bobNomi":"Oziq zanjiri va oziq to‘ri","bet":47,"oralig":"47–59","kod":"4.2","amaliyIsh":{"kod":"4.2","nomi":"Zaharli moddalar oziq zanjiri bo‘ylab qanday uzatiladi?","bet":43},"boshqotirma":45,"bilimlarXaritasi":46,"takrorlash":47,"mustahkamlash":49},"urinish":{"savollar":["Oziq zanjirlari va oziq to‘rlari bo‘ylab energiya qanday uzatiladi?","Zaharli moddalar oziq zanjiri va oziq to‘rlari bо‘уlаb uzatilishi mumkinmi?"],"qism_mavzular":[],"konikmalar":["turli manbalardan olingan ma’lumotlarga asoslanib tirik organizmlarni tasniflash;","ilmiy hodisani tushunishda modelning ahamiyatini bayon etish;","ilmiy hodisani tasvirlash va izohlashda modeldan foydalanish."],"tatbiq":["tabiiy fanlar yutuqlaridan kundalik hayotda foydalanilishini bayon etish;","fan va texnologiya yutuqlaridan foydalanishning atrof-muhitga ijobiy va salbiy ta’sirini muhokama qilish."]}},{"d":5,"c":1,"kod":"5.1","t":"Moddalarning xossalari","chorak":2,"lab":"modda","labMode":"xossalar","labTitle":"Modda xossalari va ularni sinash","theory":"Modda — hajm va massaga ega bo'lgan hamma narsa. Bu talab gazlarga ham tegishli: havo ham modda, uning ham massasi bor. Puflangan sharni tortib, keyin havosini chiqarib qayta tartsangiz — farq seziladi.\n\nModdaning xossalari uni boshqalaridan ajratadi va qayerda ishlatishni belgilaydi: zichlik, qattiqlik, mo'rtlik, egiluvchanlik, suvni o'tkazish, issiqlik va elektr o'tkazuvchanlik, shaffoflik. Xossalar moddaning massasiga yoki shakliga bog'liq emas — 1 g ham, 1 kg mis ham bir xil zichlikka ega.\n\nZichlik — birlik hajmdagi massa: ρ = m ÷ V. Suvning zichligi 1000 kg/m³ (1 sm³ suv ≈ 1 g). Bir xil hajmdagi temir va yog'ochdan temir og'irroq, chunki uning zichligi katta. Zichlik jismning suzish yoki cho'kishini oldindan aytib beradi: zichligi suvnikidan kichik jism suzaydi, kattasi cho'kadi.\n\nIssiqlik o'tkazuvchanlik — moddaning issiqlikni o'tkazish qobiliyati. Metallar (mis, alyuminiy) issiqlikni tez tarqatadi — shu sabab qozon ular yasalgan. Yog'och, plastmassa, rezina va havo issiqlikni sekin o'tkazadi — bu issiq tutqich va deraza ramalarining sababi. Elektr o'tkazuvchanlik ham shu tarzda farq qiladi: metallar tokni yaxshi o'tkazadi, plastmassa va rezina o'tkazmaydi.\n\nBir xil xona haroratida (≈20°C) turli moddalar turli holatda bo'ladi, chunki har birining erish va qaynash harorati boshqacha: spirt qaynaydi (78°C), suv suyuq (0–100°C), temir qattiq (eriydi 1538°C da), kislorod esa gaz. Modda xossalarini bilish — to'g'ri materialni to'g'ri ishga tanlash degani.","formulas":["Modda = hajm + massaga ega narsa","ρ = m ÷ V — zichlik (kg/m³ yoki g/sm³)","ρ(suv) = 1000 kg/m³ = 1 g/sm³","ρ(jism) \u003c ρ(suv) → suzaydi; ρ(jism) > ρ(suv) → cho'kadi","Yaxshi o'tkazgich: metall · Yomon: yog'och, plastmassa, havo","Moddaning holati = erish va qaynash haroratiga bog'liq"],"vocab":[{"w":"Zichlik","m":"birlik hajmdagi massa, ρ = m ÷ V"},{"w":"Issiqlik o'tkazuvchanlik","m":"moddaning issiqlikni o'tkazish qobiliyati"},{"w":"Elektr o'tkazuvchanlik","m":"moddaning tokni o'tkazish qobiliyati"},{"w":"Qattiqlik","m":"sirtning tirnalishga qarshiligi"},{"w":"Mo'rtlik","m":"zarbda sinish xossasi (shisha, g'isht, keramika)"},{"w":"Shaffoflik","m":"yorug'likni o'zidan o'tkazish xossasi"}],"quiz":[["Gazlar ham massaga egami?",["Faqat issiq gazda","Yo'q — gazning og'irligi bo'lmaydi","Faqat chang aralash bo'lsa","Ha — havo ham modda, uning massasi bor"],3,"Puflangan shar havo chiqqanda yengillashadi — demak havoning massasi bor."],["Zichlik qanday topiladi?",["Massani hajmga bo'lish orqali","Faqat hajmni o'lchab","Og'irlikni tortib","Massani hajmga ko'paytirib"],0,"ρ = m ÷ V — birlik hajmdagi massa."],["Qozon nega metaldan, tutqichi esa plastmassadan yasaldi?",["Metall issiqlikni yaxshi, plastmassa yomon o'tkazadi","Tutqich chiroyli bo'lishi kerak","Plastmassa arzon","Metall yengil"],0,"Ikkala xossa bir buyumda kerak: o'tkazish + himoya."],["Bir xil hajmdagi temir va yog'ochdan qaysi og'irroq?",["Ikkalasi teng","Ma'lumot yetarli emas","Temir — zichligi katta","Yog'och — tuzilishi zich"],2,"Hajm bir xil bo'lsa, og'irlik zichlikka bog'liq."],["Materialni ishga tanlashda nimaga qaraladi?",["Uning xossalariga","Faqat narxiga","Qadoqlanishiga","Faqat rangiga"],0,"Xossa — buyumning vazifasiga mosligini belgilaydi (praktik ish «To'g'ri tanlov» shu asosda)."]],"slideQuiz":[["Xona haroratida spirt, suv va temir turli holatda — nega?",["Har birining erish va qaynash harorati boshqacha","Hammasi bir xil holatda, faqat ko'rinish boshqacha","Havo spirtini bug'latadi","Temir og'irroq"],0,"Holat haroratga, chegaralar esa moddaga bog'liq."],["Deraza ramasida plastmassa (yoki yog'och) nima uchun yaxshi?",["Metallga qaraganda o'tkazgich","Ko'proq og'ir","Suvni yaxshi o'tkazadi","Issiqlikni yomon o'tkazadi — issiqlik saqlanadi"],3,"Bu yerda kerakli xossa — past issiqlik o'tkazuvchanlik."]],"game":[["Xossani qiymati bilan moslang: mis",["Mo'rt va yengil","Suvda eriydi","Issiqlik va tokni yaxshi o'tkazadi","Issiqlikni umuman o'tkazmaydi"],2,"Mis — o'tkazgich, shu sabab sim va idishlarda."],["Shaffoflik qaysi buyumda asosiy talab?",["Deraza oynasida","Qozon tutqichida","Oyoq kiyimida","Devor bo'yog'ida"],0,"Yorug'lik o'tishi kerak — qattiq va silliq, lekin shaffof."],["Qaysi biri modda EMAS?",["Qum","Yorug'lik","Suv bug'i","Havo"],1,"Yorug'lik — energiya; hajm va massaga ega emas."],["Suvda suzadigan jismning zichligi qanday bo'ladi?",["1 g/sm³ dan kichik","1 g/sm³ dan katta","aynan 1 g/sm³","Zichlik aloqador emas"],0,"ρ \u003c ρ(suv) bo'lsa — jism suzadi."]],"gameQuiz":[["Xossani qiymati bilan moslang: mis",["Mo'rt va yengil","Suvda eriydi","Issiqlik va tokni yaxshi o'tkazadi","Issiqlikni umuman o'tkazmaydi"],2,"Mis — o'tkazgich, shu sabab sim va idishlarda."],["Shaffoflik qaysi buyumda asosiy talab?",["Deraza oynasida","Qozon tutqichida","Oyoq kiyimida","Devor bo'yog'ida"],0,"Yorug'lik o'tishi kerak — qattiq va silliq, lekin shaffof."],["Qaysi biri modda EMAS?",["Qum","Yorug'lik","Suv bug'i","Havo"],1,"Yorug'lik — energiya; hajm va massaga ega emas."],["Suvda suzadigan jismning zichligi qanday bo'ladi?",["1 g/sm³ dan kichik","1 g/sm³ dan katta","aynan 1 g/sm³","Zichlik aloqador emas"],0,"ρ \u003c ρ(suv) bo'lsa — jism suzadi."]],"task":{"q":"«To'g'ri tanlov» — 4 ta materialni (mis sim, yog'och tayoqcha, plastmassa qoshiq, alyuminiy folga) 4 ta vazifaga tanlang: (1) issiq suvli idishning tutqichi, (2) zanjir o'tkazgichi, (3) qozon, (4) deraza rama. Har tanlovda qaysi xossa hal qilganini yozing.","a":"(1) yog'och yoki plastmassa — issiqlikni yomon o'tkazadi; (2) mis — tokni yaxshi o'tkazadi; (3) alyuminiy — issiqlikni yaxshi o'tkazadi va yengil; (4) plastmassa — past issiqlik o'tkazuvchanlik + suvga chidamlilik.","why":"Tanlov mezonini xossaga asoslash — fanning amaliy qismi: material vazifaga mos bo'lsa, buyum ishonchli va xavfsiz ishlaydi.","steps":["Har materialning 4 xossasini sinab ko'ring (tirnash, suvga tushirish, magnit, qattiqlik)","Har vazifa uchun nomzodlarni solishtiring","Bittasini tanlab, qaysi xossa asos bo'lganini yozing","Rad etilgan variantni ham xossa bilan asoslang","Xulosa: bitta material hamma vazifaga yaraqlimi?"],"jihoz":["Mis sim, yog'och tayoqcha, plastmassa qoshiq, alyuminiy folga","Iliq suvli stakan","Batareya, lampa, kalit (o'tkazuvchanlikni tekshirish uchun)","Magnit"],"xavfsizlik":["Issiq suv va folga bilan ehtiyot bo'ling","O'tkazuvchanlikni faqat batareya (3–4,5 V) bilan tekshiring","Sinovdan keyin qo'llarni yuving"]},"act":{"type":"lab","name":"modda","mode":"xossalar"},"kitob":{"bobNomi":"Moddaning xossalari","bet":60,"oralig":"60–70","kod":"5.1","amaliyIsh":{"kod":"5.1","nomi":"To‘g‘ri tanlov","bet":51},"boshqotirma":56,"bilimlarXaritasi":57,"takrorlash":58,"mustahkamlash":61},"urinish":{"savollar":["Gazlar ham massaga egami?","Bir xil haroratda turli moddalarning agregat holati o‘zgaradimi?","Issiqlik o‘tkazuvchanlik va elektr o‘tkazuvchanlik nima?"],"qism_mavzular":[],"konikmalar":["tadqiqot uchun kerakli jihozlarni tanlash va ulardan to‘g‘ri foydalanish;","ilmiy savol qo‘yish va unga javob topishga yordam beradigan eng yaxshi tadqiqot metodini tanlash;","egallangan bilimlarni qo‘llab tadqiqot natijalarini bashorat qilish;","amaliy ishni bajarish davomida xavfsizlik qoidalariga rioya qilish;","tadqiqotni yaxshilash yuzasidan taklif berish va uni izohlash;","turli tadqiqot metodlarining o‘ziga xos xususiyatlarini anglash;","nazorat qilinadigan tajriba rejasini tuzish va uch xil o‘zgaruvchini aniqlash;","amaliy ishni bajarish davomida yuzaga kelishi mumkin bo‘lgan xavflarni hamda ularni kamaytirish yo‘llarini bayon etish;","tadqiqot natijalariga asoslanib bashoratning aniqligini bayon etish;","o‘lchash ishlarini to‘g‘ri va aniq bajarish;","kuzatish natijalarini taqdim etish uchun jadval tuzish;","tadqiqot natijalariga asoslanib ilmiy xulosa chiqarish."],"tatbiq":["bahs-munozarada o‘z nuqtayi nazarini ilmiy dalillardan foydalanib asoslash;","tabiiy fanlar yutuqlaridan kundalik hayotda foydalanilishini bayon etish."]}},{"d":5,"c":2,"kod":"5.2","t":"Qaynash va bug‘lanish","chorak":2,"lab":"modda","labMode":"qaynash","labTitle":"","theory":"Qattiq → suyuq (erish), suyuq → qattiq (qotish), suyuq → gaz (bug'lanish yoki qaynash), gaz → suyuq (kondensatsiya), qattiq → gaz (sublimatsiya) — bu agregat holat o'zgarishlari. Ularning barchasi fizik o'zgarishlardir: modda o'zgarmaydi, faqat zarrachalar tartibi va harakati o'zgaradi.\n\nBug'lanish suyuqlikning erkin sirtidan istalgan haroratda bo'ladi — tezroq harakatlangan zarrachalar suyuqlikdan chiqib ketadi va qolgan qism soviydi (shu sabab teridagi spirt sovitadi). Qaynash esa ma'lum haroratda butun hajm bo'ylab sodir bo'ladi: pufakchalar paydo bo'lib, ular ichidagi bug' bosimi tashqi bosimga tenglashadi.\n\nHar bir moddaning qaynash harorati tashqi bosimga bog'liq. Tovuq pishirish uchun qozonning qopqog'i bosimni oshiradi — suv 100°C dan yuqori haroratda qaynaydi va taom tez tayyor bo'ladi. Tog'da esa bosim kam, suv past haroratda qaynaydi va non pishi sekinlashadi.\n\nQizdirish egri chizig'i jarayonni aniq ko'rsatadi: harorat ko'tariladi → erish (harorat tekis) → suyuqlik qiziydi → qaynash (harorat yana tekis) → bug' qiziydi. «Tekis» qismlarda energiya zarrachalar orasidagi bog'lanishni uzishga sarflanadi.","formulas":["Bug'lanish: sirtida, har qanday haroratda","Qaynash: butun hajmda, ma'lum haroratda","Qaynash harorati tashqi bosimga bog'liq","Erishda harorat o'zgarmaydi (issiqlik bog'lanish uzishga ketadi)","Kondensatsiya — bug'lanishning teskarisi","Sovitish — bug'lanish tezlashganda kuchayadi (shamol, nam sochiq, ventilyator)"],"vocab":[{"w":"Qaynash","m":"suyuqlikning butun hajmi bo'ylab bug'ga aylanishi"},{"w":"Bug'lanish","m":"suyuqlik sirtidan molekulaning chiqib ketishi"},{"w":"Kondensatsiya","m":"bug'ning suyuqlikka aylanishi"},{"w":"Qaynash harorati","m":"bug' bosimi tashqi bosimga tenglashadigan harorat"},{"w":"Sublimatsiya","m":"qattiq holatdan to'g'ridan-to'g'ri gaz holatiga o'tish"},{"w":"Qizdirish egri chizig'i","m":"haroratning vaqt bo'yicha o'zgarish grafigi"}],"quiz":[["Qaynash va bug'lanishning asosiy farqi nimada?",["Farqi yo'q","Bug'lanish faqat qaynaganida bo'ladi","Qaynash uchun sovitish kerak","Qaynash butun hajmda, bug'lanish faqat sirtda"],3,"Qaynash ma'lum haroratda, bug'lanish istalgan haroratda."],["Nega daryoda suv 100°C da qaynamaydi?",["Tashqi bosim past (tog'da) yoki bug' tarqaladi","Suv toza","Suvning zichligi ortadi","Quyosh yetarli emas"],0,"Qaynash harorati bosimga bog'liq; ochiq havoda bug' tarqaladi va harorat ~100°C da qoladi."],["Suyuqlik qaynayotganda harorat qanday o'zgaradi?",["Deyarli o'zgarmaydi","Tez ko'tariladi","Avval pasayadi, keyin oshadi","Pasayadi"],0,"Egr chiziqda tekis qism — energiya bog'lanish uzishga sarflanadi."],["Nega shimmoqni shamolli havoda keyin quriganda sovuq his qilasiz?",["Matoning zichligi ortadi","Shamol issiqlik qo'shadi","Tezroq bug'lanish terini sovitadi","Suv isiydi"],2,"Tez bug'lanish → energiyani teridan oladi → sovitadi."],["Qopqog'i bosim oshiruvchi idishda taom tez pishadi, chunki...",["Suyuqlik past haroratda qaynaydi","Idish katta","Suyuqlik yuqoriroq haroratda qaynaydi","Bosim bug'ni yo'q qiladi"],2,"Bosim ↑ → qaynash harorati ↑ → pishish tezlashadi."]],"slideQuiz":[["Egri chiziqning «tekis» qismi nimani bildiradi?",["Modda bug'langan","Holat o'zgarishi ketmoqda, harorat o'zgarmayapti","Harorat pasaymoqda","Isitgich o'chgan"],1,"Holat o'zgarishida energiya bog'lanishlarni uzishga sarflanadi."],["Muz eritayotganda harorat qanday?",["0°C da saqlanadi","−10°C gacha tushadi","Tez oshadi","Qaynaydi"],0,"Erish — harorat o'zgarmaydigan jarayon."]],"game":[["Jarayonni nomi bilan moslashting: qattiq → gaz (to'g'ridan-to'g'ri)",["Qotirish","Eritish","Kondensatsiya","Sublimatsiya"],3,"Quruq muz yoki kiyimdagi egilgan rezina qayta o'z holiga keladi. Qaytmas — qaytib bo'lmaydigan: qog'oz kuyganda kul va gaz hosil bo'ladi (bu allaqachon kimyoviy o'zgarish), tuxum qotadi, po'lat cho'zilib ketadi.\n\nDiqqat: bir jarayonda ikkala tur aralashishi mumkin. Shamning erishi — fizik, fitilning yonishi — kimyoviy.\n\n«Kalit-aniqlagich» usuli: o'zgarishni aniqlash uchun savollarni ketma-ket qo'ying. 1) Yangi modda hosil bo'ldimi? 2) Rang, hido yoki gaz chiqdimi? 3) Jarayonni bir xil sharoitga qaytarib, avvalgi holatga keladimi? Birinchi ikki javob «ha» bo'lsa — kimyoviy o'zgarish ehtimoli kuchli.\n\nFizik o'zgarishlarda massa saqlanadi: muzning eriganidagi massasi o'zgarmaydi. Shu sababli tajribada boshidan va oxiridan tortib ko'rish — xulosani tekshirishning ishonchli yo'li.","formulas":["Fizik o'zgarish: tarkib o'zgarmaydi","Kimyoviy o'zgarish: yangi modda hosil bo'ladi","Qaytar: boshlang'ich holatga qaytib bo'ladi","Qaytmas: qaytib bo'lmaydi","Fizik o'zgarishda massa saqlanadi","Bir jarayonda ikkala tur birga ketishi mumkin"],"vocab":[{"w":"Fizik o'zgarish","m":"moddaning tarkibi o'zgarmagan holatga kelishi"},{"w":"Qaytar o'zgarish","m":"teskari yo'l bilan boshlang'ich holatga qaytariladigan o'zgarish"},{"w":"Qaytmas o'zgarish","m":"avvalgi holatga qaytarib bo'lmaydigan o'zgarish"},{"w":"Kalit-aniqlagich","m":"ketma-ket savollar bilan tasniflash sxemasi"},{"w":"Massaning saqlanishi","m":"o'zgarishda modda miqdori o'zgarmasligi"}],"quiz":[["Qaysi biri fizik o'zgarish?",["Temirning zanglashi","Muzning erishi","Sutning quyushishi","Qog'ozning yonishi"],1,"Muz eriganda suv molekulasi o'zgarmaydi — faqat holat o'zgaradi."],["Qaytar o'zgarishga misol — qaysi?",["Rezina lentani cho'zish","Shamning yonishi","Tuxumning qotishi","Nonning pishishi"],0,"Lenta qisqarib avvalgi holatiga qaytadi."],["Fizik o'zgarishda massa qanday bo'ladi?",["Kamayadi","Yo'qoladi","Ortadi","Saqlanadi"],3,"Tarkib o'zgarmagani uchun tortilgan massa bir xil qoladi."],["Qaysi hodisa qaytmas?",["Bukilgan qog'ozni yozi  qaytmas qiladi."]],"task":{"q":"10 ta hodisa ro'yxatini (muz erishi, non pishi, sim egish, non yonishi, shakar erishi, sut quyushishi, kiyim qurishi, temir zangi, sirka + soda, shisha sinishi) fizik/kimyoviy va qaytar/qaytmas deb ikki belgilang. Kalit-aniqlagich tuzing.","a":"Fizik: muz erishi, sim egish, kiyim qurishi, shisha sinishi, shakar erishi. Kimyoviy: non pishi/yonishi, sut quyushishi, zang, sirka+soda. Qaytar: muz erishi, sim egish (chegarada), shakar erishi. Qaytmas: yonish, pishish, quyushish, zang.","why":"Ikki mezon bilan ishlash mezonlarning bir-biriga bog'liq emasligini ko'rsatadi: fizik o'zgarish ham qaytmas bo'lishi mumkin.","steps":["2×2 jadval chizing: ustunlar fizik/kimyoviy, qatorlar qaytar/qaytmas","Har hodisani katakka joylang","Kalit-aniqlagich savollarini yozing (3 ta)","Ikkita bahsli holatni asoslang (sim egish, shisha sinishi)","Xulosa: eng ko'p chalkashlik qaysi meyzonda?"],"jihoz":["Katakli qog'oz yoki 2×2 jadval shabloni","Sodda tajriba uchun: sirka va ovqat sodasi (ixtiyoriy)"],"xavfsizlik":["Sirka va soda aralashmasini yopiq idishda qilmaslang (bosim ortadi)","Yonish tajribalarini faqat ustoz bilan bajaring"]},"act":{"type":"lab","name":"ozgarish","mode":"fizik"},"kitob":{"bobNomi":"Fizik va kimyoviy o‘zgarishlar","bet":71,"oralig":"71–86","kod":"6.1","amaliyIsh":{"kod":"6.1","nomi":"Qaytar fizik o‘zgarishlar","bet":63},"boshqotirma":71,"bilimlarXaritasi":72,"takrorlash":73,"mustahkamlash":75},"urinish":{"savollar":["Barcha fizik o‘zgarishlar qaytar jarayonmi?"],"qism_mavzular":["Qaytar va qaytmas o‘zgarishlar"],"konikmalar":["o‘rganilayotgan obyektlarda kuzatiladigan farqlarga asoslanib kalit-aniqlagich tuzish;","ilmiy savol qo‘yish va unga javob topishga yordam beradigan eng yaxshi tadqiqot metodini tanlash;","turli tadqiqot metodlarining o‘ziga xos xususiyatlarini anglash;","nazorat qilinadigan tajriba rejasini tuzish va uch xil o‘zgaruvchini aniqlash;","tadqiqot uchun kerakli jihozlarni tanlash va ulardan to‘g‘ri foydalanish;"," suvda baliqlar uchun kislorod kam bo'ladi.\n\nErigan moddaning massasi eritma massasiga qo'shiladi: 20 g tuz + 100 g suv = 120 g eritma. Eritmaning massa foizi shu ikki son bilan hisoblanadi.","formulas":["Eritma = erigan modda + erituvchi (bir jinsli aralashma)","Erish tezligi: maydalash + aralashtirish + harorat","Eruvchanlik = 100 g erituvchida eriy oladigan maksimal massa","To'yingan eritma = erish chegarasiga yetgan","Qattiq moddalar: harorat ↑ → eruvchanlik ↑ (odatda)","Gazlar: harorat ↑ → eruvchanlik ↓"],"vocab":[{"w":"Erish","m":"moddaning erituvchi bo'ylab zarrachalarga ajralib tarqalishi"},{"w":"Eritma","m":"bir jinsli aralashma"},{"w":"Eruvchanlik","m":"ma'lum haroratda eriy oladigan maksimal miqdor"},{"w":"To'yingan eritma","m":"eriy oladigan chegaraga yetgan eritma"},{"w":"Cho'kma","m":"erimay idish tubiga tushgan qoldiq"},{"w":"Erituvchi","m":"moddani erituvchi asosiy suyuqlik"}],"quiz":[["Erish tezligini oshirmaydigan omil qaysi?",["Qizdirish","Aralashtirish","Maydalash","Suvning rangi"],3,"Rang erish tezligiga ta'sir qilmaydi."],["Eruvchanlik nima?",["Ma'lum haroratda eriy oladigan maksimal miqdor","Suvning harorati","Bug'lanish tezligi","Eritmaning og'irligi"],0,"Bu — erish chegarasi, odatda 100 g suv uchun aytiladi."],["50°C dagi suvda 100 g ga shakar qo'shsangiz, avval eriydi, keyin to'xtaydi. Nega?",["Suv bug'landi","Shakar tugadi","Eritma to'yingan holatga yetdi","Harorat pasaydi"],2,"Chegara yetganda ortiqcha qism cho'kma bo'lib qoladi."],["Issiq suvda erigan kislorod kamroq bo'ladi, chunki...",["Suv qaynaydi","Kislorod og'irroq","Gazlarning eruvchanligi harorat oshganda kamayadi","Kislorod bug'lanadi"],2,"Gazlar uchun qoida teskari: sovuq suvda eruvchanlik yuqori."],["60 g suvga 10 g tuz solib eritsangiz, eritma massasi qancha?",["60 g","70 g","10 g","50 g"],1,"Massalar qo'shiladi: 60 + 10 = 70 g."]],"slideQuiz":[["Shakarli choyda qand ko'rinib turgan bo'lsa, eritma qanday?",["To'yingan (ortiqchasini eritib bo'lmaydi)","Suyultirilgan","Qattiq","Bug'langan"],0,"Cho'kma — to'yinganlikning belgisi."],["Aralashtirish nima uchun erishni tezlashtiradi?",["Yangi erituvchi qatlamiga moddani olib boradi","Haroratni oshiradi","Moddani maydalaydi","Suvni ko'paytiradi"],0,"Aralashtirish diffuziya yo'lini qisqartiradi."]],"game":[["Omilni ta'siri bilan moslashting: moddani maydalash",["Eruvchanlikni o'zgartiradi","Yuzani oshiradi → tezroq eriydi","Erituvchini ko'paytiradi","Haroratni oshiradi"],1,"Kichik zarrachalar ko'proq suv bilan uchrashadi."],["Qaysi eritma «bir jinsli»?",["Yog'li suv","Qumli suv","Bo'ta qog'oz","Tuzli suv"],3,"Zarrachalar ko'zga tashlanmay darajada tarqalgan."],["Gazning suvda eruvchanligi qachon ortadi?",["Sovuqda ham, issiqda ham","Harorat oshganda","Yorug'lik kuchayganda","Harorat pasayganda"],3,"Gazlar — sovuq suvda yaxshi eriydi."]],"gameQuiz":[["Omilni ta'siri bilan moslashting: moddani maydalash",["Eruvchanlikni o'zgartiradi","Yuzani oshiradi → tezroq eriydi","Erituvchini ko'paytiradi","Haroratni oshiradi"],1,"Kichik zarrachalar ko'proq suv bilan uchrashadi."],["Qaysi eritma «bir jinsli»?",["Yog'li suv","Qumli suv","Bo'ta qog'oz","Tuzli suv"],3,"Zarrachalar ko'zga tashlanmay darajada tarqalgan."],["Gazning suvda eruvchanligi qachon ortadi?",["Sovuqda ham, issiqda ham","Harorat oshganda","Yorug'lik kuchayganda","Harorat pasayganda"],3,"Gazlar — sovuq suvda yaxshi eriydi."]],"task":{"q":"«Haroratning eruvchanlikka ta'siri» — 3 ta stakanga 50 ml sovuq, iliq va issiq suv quying. Har biriga 1 g dan shakar qo'shib, to'yingan holatgacha (qand ko'rinmaguncha) davom eting. Natijalarni jadval va diagrammaga aylantiring.","a":"Issiq suvda ko'proq shakar eriydi: erish chegarasi harorat bilan ko'tariladi. Sovuq suvda birinchi bo'lib cho'kma paydo bo'ladi.","why":"O'zgartiriladigan omil — faqat harorat; suv miqdori, shakar bo'lagi o'lchami va aralashtirish soni bir xil bo'lsa, qonuniyat ishonchli bo'ladi.","steps":["Har stakanga 50 ml suv va haroratni yozing","1 g dan shakar qo'shib, to'liq eriguncha soslanib bashoratning aniqligini bayon etish;","tadqiqotni yaxshilash yuzasidan taklif berish va uni izohlash;","amaliy ishni bajarish davomida xavfsizlik qoidalariga rioya qilish."],"tatbiq":["fan va texnologiya yutuqlaridan foydalanishning atrof-muhitga ijobiy ta’sirini muhokama qilish."]}},{"d":6,"c":3,"kod":"6.3","t":"Kimyoviy reaksiyalar","chorak":2,"lab":"ozgarish","labMode":"kimyo","labTitle":"","theory":"Kimyoviy reaksiya — moddalarning tarkibi o'zgarib, yangi modda hosil bo'lishi. Boshlang'ich moddalar — reaksiyaga kirishuvchilar, yakunda — hosilalar. Reaksiyalarni shartli ravishda «A + B → C» ko'rinishida yozishadi.\n\nReaksiya ketayotganini ko'rsatuvchi belgilar: rang o'zgarishi, gaz chiqishi (pufakchalar), cho'kma hosil bo'lishi, haroratning o'zgarishi (qizish yoki soviya), hid o'zgarishi, yorug'lik chiqishi. Har bir belgi o'zi holisi bilan yetarli emas — bir nechta belgi birga bo'lsa xulosa ishonchli bo'ladi.\n\nReaksiya uchun zarrachalar to'qnashishi kerak, shuning uchun reaksiya tezligiga moddaning holati (yuzasi), harorat va konsentratsiya ta'sir qiladi. Katalizator — reaksiyani tezlashtiruvchi, ammo reaksiya oxirida o'zgarmay qoladigan modda.\n\nMassaning saqlanish qonuni: reaksiyaga kirishuvchi moddalarning umumiy massasi hosil bo'lgan moddalar massasiga teng. Chunki atomlar yo'qolmaydi va paydo bo'lmaydi — faqat bog'lanishlari qayta taqsimlanadi. Buni tekshirish uchun reaksiyani yopiq idishda o'tkazib, oldidan va keyidan tortish kifoya.\n\nYonish — kislorod ishtirokidagi tez oksidlanish. Nafas olish ham oksidlanish, lekin sekin va biologik; shamning yonishi va organizmdagi energiya olishi — kimyoviy jihatdan qarindosh jarayonlar.","formulas":["Reaksiya: kirishuvchilar → hosilalar","Belgilar: rang, gaz, cho'kma, harorat, hid, yorug'lik","Tezlik omillari: yuza, harorat, konsentratsiya, katalizator","Katalizator — tezlashtiradi va o'zgarmay qoladi","Massaning saqlanishi: m(kirishuvchi) = m(hosila)","Yonish = tez oksidlanish; nafas = sekin oksidlanish"],"vocab":[{"w":"Reagent","m":"reaksiyaga kirishayotgan modda"},{"w":"Hosila","m":"reaksiyada vujudga kelgan yangi modda"},{"w":"Cho'kma","m":"erimay chiqib tushgan modda"},{"w":"Katalizator","m":"reaksiyani tezlashtiruvchi, o'zi sarflanmaydigan modda"},{"w":"Oksidlanish","m":"kislorod bilan birikish (yoki elektron berish) jarayoni"},{"w":"Eksotermik reaksiya","m":"issiqlik ajraladigan reaksiya"}],"quiz":[["Kimyoviy reaksiya sodir bo'lganini eng ishonchli ko'rsatuvchi qaysi?",["Faqat suvi qizisa","Faqat aralashtirilsa","Faqat idish sovigan bo'lsa","Bir nechta belgi birga: rang o'zgarishi va yangi modda hosil bo'lishi"],3,"Bitta belgi aldaydi; bir nechtasi va tarkib o'zgarishi asosiy ko'rsatkich."],["Gaz chiqishi — bu...",["Reaksiya belgilaridan biri","Har doim kimyoviy reaksiya emas, ba'zida bug'lanish","Xato","Faqa fizik jarayon"],0,"Pufakchalar ham fizik (qaynash), ham kimyoviy (CO₂ chiqishi) bo'lishi mumkin."],["Massaning saqlanish qonuni nima deydi?",["Kirishuvchilar massasi = hosilalar massasi","Massa yo'qoladi","Massa doim ortadi","Faqat qattiq moddada saqlanadi"],0,"Atomlar saqlanadi — ular faqat qayta bog'lanadi."],["Katalizatorning roli qanday?",["Hosila beradi","Reaksiyani tezlashtiradi, o'zi sarflanmaydi","Massani oshiradi","Reaksiyani to'xtatadi"],1,"Reaksiya oxirida katalizator avvalgi holatida qoladi."],["Nafas olish va shamning yonishi o'rtasidagi o'xshashlik nima?",["Ikkalasi ham sekin","Ikkalasi ham suv hosil qilmaydi","Farqi yo'q","Ikkalasi ham oksidlanish, energiya ajraydi"],3,"Nafas — sekin va nazorat qilingan; yonish — tez va ochiq issiqlik bilan."]],"slideQuiz":[["Sovuq suvda sodali sirka aralashmasi iliq suvdagidan sekinroq g'alaydi — nega?",["Harorat past bo'lsa zarrachalar sekin to'qnashadi","Massa kam","Suv toza","Katalizator yo'q"],0,"Harorat reaksiya tezligiga bevosita ta'sir qiladi."],["Reaksiyani yopiq idishda o'tkazishning maqsadi nima?",["Gaz chiqib ketmasin, massa saqlanishini tekshirish mumkin bo'lsin","Reaksiyani to'xtatish","Haroratni oshirish","Rangni saqlash"],0,"Ochiq idishda gaz bilan massa «kamayib» ko'rinadi."]],"game":[["Belgini reaksiya turi bilan bog'lang: rangning o'zgarishi",["Harakat belgisi","Fizik o'zgarish belgisi","O'lchov xatosi","Kimyoviy reaksiya belgisi"],3,"Rang o'zgarishi yangi moddaga ishora."],["Yonish uchun zarur bo'lmagan narsa — qaysi?",["Kislorod","Yonuvchi modda","Yorug'lik","Yonish harorati"],2,"Yonish uchun uch omil kerak: modda, O₂ va alangalanish harorati."],["Sirka + soda aralashmasida qaysi gaz chiqadi?",["O₂","N₂","H₂","CO₂"],3,"Ko'mir angidridi — pufakchalar shu gaza tegishli."]],"gameQuiz":[["Belgini reaksiya turi bilan bog'lang: rangning o'zgarishi",["Harakat belgisi","Fizik o'zgarish belgisi","O'lchov xatosi","Kimyoviy reaksiya belgisi"],3,"Rang o'zgarishi yangi moddaga ishora."],["Yonish uchun zarur bo'lmagan narsa — qaysi?",["Kislorod","Yonuvchi modda","Yorug'lik","Yonish harorati"],2,"Yonish uchun uch omil kerak: modda, O₂ va alangalanish harorati."],["Sirka + soda aralashmasida qaysi gaz chiqadi?",["O₂","N₂","H₂","CO₂"],3,"Ko'mir angidridi — pufakchalar shu gaza tegishli."]],"task":{"q":"«Kimyoviy reaksiya belgilari» — uchta tajriba: (1) sirkaga soda; (2) sutga limon sharbati; (3) temir qog'oz (po'lat jun) sirka bilan 1 kunga qoldiring. Har birida qaysi belgi kuzatilganini va yangi modda hosil bo'lganmi yoki yo'qmi, asoslang.","a":"(1) g'illash va pufakchalar — gaz (CO₂) chiqdi, yangi modda bor. (2) sut ezilib, cho'kma (kazein) ajraldi — yangi modda hosil bo'ldi. (3) qizil-jigarrang dog' — zanglangan temir (oksid) paydo bo'ldi.","why":"Uch xil tajribada uch xil belgi (gaz, cho'kma, rang) kuzatiladi — «belgi ≠ reaksiya» emas, «belgilar majmuasi = reaksiya» degan xulosaga kelish ishonchli.","steps":["Har tajriba uchun alohida stakan oling va boshlang'ich holatni yozing","Qo'shish tartibini yozing (miqdor + vaqt)","Belgilarni jadvalga kiriting: rang | gaz | cho'kma | harorat | hid","Har belgiga «yangi moddami?» degan javob qo'shing","Xulosa: qaysi belgi yolg'iz qoldirganda aldaydi?"],"jihoz":["Sirka, ovqat sodasi","Sut va limon","Po'lat jun, sirka","3 stakan, qo'shiqchi"],"xavfsizlik":["Sirka va limon sharbatini ko'zga tekkizmang","Aralashmalarni hidlashda idishni o'zingerik burang, to'g'ridan-to'g'ri ichkanga yuqmang","Reaksiya oxirida eritmalarni yuvib tashlang, og'izga olmang"]},"act":{"type":"lab","name":"ozgarish","mode":"kimyo"},"kitob":{"bobNomi":"Fizik va kimyoviy o‘zgarishlar","bet":71,"oralig":"71–86","kod":"6.3","amaliyIsh":{"kod":"6.3","nomi":"Kimyoviy reaksiya belgilari","bet":68},"boshqotirma":71,"bilimlarXaritasi":72,"takrorlash":73,"mustahkamlash":75},"urinish":{"savollar":["Kimyoviy reaksiyalarda qanday o‘zgarishlar sodir bo‘ladi?","Kimyoviy reaksiya sodir bo‘lganini qanday bilish mumkin?"],"qism_mavzular":[],"konikmalar":["o‘rganilayotgan obyektlarda kuzatiladigan farqlarga asoslanib kalit-aniqlagich tuzish;","ilmiy savol qo‘yish va unga javob topishga yordam beradigan eng yaxshi tadqiqot metodini tanlash;","turli tadqiqot metodlarining o‘ziga xos xususiyatlarini anglash;","nazorat qilinadigan tajriba rejasini tuzish va uch xil o‘zgaruvchini aniqlash;","tadqiqot uchun kerakli jihozlarni tanlash va ulardan to‘g‘ri foydalanish;","o‘lchash ishlarini to‘g‘ri va aniq bajarish;","ishonchli natijalar olish uchun kuzatishlarni takrorlash zarurligi yuzasidan qaror qabul qilish;","egallangan bilimlarni qo‘llab tadqiqot natijalarini bashorat qilish;","amaliy ishni bajarish davomida yuzaga kelishi mumkin bo‘lgan xavflarni hamda ularni kamaytirish yo‘llarini bayon etish;","kuzatish va o‘lchash natijalarini taqdim etish uchun jadval tuzish;","kuzatish natijalarini rasm orqali ifodalash;","chiziqli grafikdan foydalanib tadqiqot natijalarini izohlash;","tadqiqot natijalaridagi qonuniyatni bayon etish hamda kutilmagan natijalarni aniqlash;","tadqiqot natijalariga asoslanibilmiy xulosa chiqarish;","tadqiqot natijalariga asoslanib bashoratning aniqligini bayon etish;","tadqiqotni yaxshilash yuzasidan taklif berish va uni izohlash;","amaliy ishni bajarish davomida xavfsizlik qoidalariga rioya qilish."],"tatbiq":["fan va texnologiya yutuqlaridan foydalanishning atrof-muhitga ijobiy ta’sirini muhokama qilish."]}},{"d":7,"c":1,"kod":"7.1","t":"Massa, og‘irlik va gravitatsiya kuchi","chorak":3,"lab":"kuch","labMode":"massa-ogirlik","labTitle":"","theory":"Massa — jismdagi modda miqdori, o'lchovi kilogramm (kg). U joyga va holatga bog'liq emas: 1 kg po'lat Yerda ham, Oyda ham, suvda ham 1 kg bo'lib qoladi.\n\nOg'irlik kuchi — Yerning jismga tushiradigan tortishish kuchi, Nyuton (N) bilan o'lchanadi. U massaga va erkin tushish tezlanishiga bog'liq: F = m · g, yer yuzida g ≈ 10 N/kg. Demak 3 kg jismga ≈ 30 N og'irlik kuchi ta'sir qiladi.\n\nOg'irlik kuchi va massa — turli tushuncha. Massa — skalyar miqdor (yo'nalishi yo'q), kuch esa vektor (yo'nalishi bor: pastga, jismning og'irlik markaziga).\n\nGravitatsiya — barcha jismalar o'rtasidagi o'zaro tortishish. Uning kuchi massalar ko'paytmasiga ortib, oradagi masofaning kvadratiga kamayadi: Oy Yerni tortadi, Yer Oy bilan birgalikda umumiy markaz atrofini aylanadi.\n\nAgar «g» o'zgarsa nima bo'ladi? Massa o'zgarmaydi, og'irlik kuchi esa o'zgaradi: Oyda g ≈ 1,6 N/kg (Yerdagidan ~6 marta kam), Marsda ≈ 3,7 N/kg. Shu sabab oyga uchgan astronavtning massasi bir xil, og'irligi esa ancha kam bo'ladi.\n\nKuchni o'lchash — dinamik o'lchagich (dynamometr) bilan. Uning ishlashi prujina qisqarishiga asoslangan: qancha kuch, shuncha cho'zilish.","formulas":["m — massa (kg), doimiy miqdor","F = m · g — og'irlik kuchi (N)","g ≈ 9,8 N/kg (hisobda 10 N/kg olinadi)","Oyda g ≈ 1,6 N/kg; Marsda ≈ 3,7 N/kg","Kuch — vektor (yo'nalishi bor), massa — skalyar","Dinamometr: F ~ Δl (prujina cho'zilishi)"],"vocab":[{"w":"Massa","m":"jismdagi modda miqdori, kg da o'lchanadi"},{"w":"Og'irlik kuchi","m":"Yer tomonidan jismga tushiriladigan tortishish kuchi"},{"w":"Gravitatsiya","m":"jismalar o'rtasidagi o'zaro tortishish"},{"w":"Erkin tushish tezlanishi (g)","m":"bir kg ga tushadigan og'irlik kuchi, N/kg"},{"w":"Dinamometr","m":"kuchni o'lchaydigan prujinali asbob"},{"w":"Og'irlik markazi","m":"og'irlik kuchi qo'yiladigan shartli nuqta"}],"quiz":[["Massa va og'irlik kuchining asosiy farqi nimada?",["Og'irlik massaga bog'liq emas","Ikkalasi bir xil narsa","Massa Nyuton bilan o'lchanadi","Massa modda miqdori (kg), kuch esa tortishish ta'siri (N)"],3,"Og'irlik kuchi = m·g; massa esa o'zgarmaydi."],["3 kg massali jismga Yerda taxminan qancha og'irlik kuchi ta'sir qiladi?",["≈10 N","≈30 N","≈3 N","≈300 N"],1,"F = 3 · 10 = 30 N."],["Oyga borgan astronavtning massasi va og'irligi qanday o'zgaradi?",["Massa o'zgarmaydi, og'irlik kamayadi","Ikkalari ortadi","Ikkalasi kamayadi","Massa kamayadi, og'irlik o'zgarmaydi"],0,"Modda miqdori bir xil; g esa ~6 marta kichik."],["Kuchning o'lchov birligi — nima?",["Kilogramm (kg)","Paskal (Pa)","Joul (J)","Nyuton (N)"],3,"Kuch Nyuton bilan, massa kilogramm bilan o'lchanadi."],["Gravitatsiya kuchi qachon kuchayadi?",["Masofa ortganda","Massalar ortganda va masofa kamayganda","Jism tezlashganda","Harorat oshganda"],1,"Kuch massalar ko'paytmasiga proportsional, masofa kvadratiga teskari."]],"slideQuiz":[["Nega olma Yer tomon tushadi, Yer esa olma tomon harakatlanmaydi?",["Yer qimirlamaydi","Ikkalasi o'zaro tortadi, ammo Yer massasi juda katta — uning harakati sezilmaydi","Havo to'siq bo'ladi","Olma Yerni tortmaydi"],1,"Tortishish o'zaro; tezlanish massaga teskari."],["Dinamometrda prujina ikki barobar ko'p cho'zilsa, kuch qanday o'zgaradi?",["O'zgarmaydi","2 marta kamayadi","≈4 marta ortadi","≈2 marta ortadi"],3,"Cho'zilish kuchga proportsional (chegaralarigacha)."]],"game":[["Kattalikni o'lchov birligi bilan moslashting: massa",["J","m/s","kg","N"],2,"Massa kilogrammda, kuch Nyutonda."],["Qaysi sayyorada og'irlik kuchi eng kichik bo'ladi?",["Marsda (3,7)","Yerda (9,8)","Oyda (1,6 N/kg)","Yupiterda (24)"],2,"Kichik g — kichik og'irlik."],["Massa 5 kg, g = 10 N/kg. Og'irlik kuchi qancha?",["50 N","500 N","5 N","0,5 N"],0,"F = m·g = 5 · 10 = 50 N."]],"gameQuiz":[["Kattalikni o'lchov birligi bilan moslashting: massa",["J","m/s","kg","N"],2,"Massa kilogrammda, kuch Nyutonda."],["Qaysi sayyorada og'irlik kuchi eng kichik bo'ladi?",["Marsda (3,7)","Yerda (9,8)","Oyda (1,6 N/kg)","Yupiterda (24)"],2,"Kichik g — kichik og'irlik."],["Massa 5 kg, g = 10 N/kg. Og'irlik kuchi qancha?",["50 N","500 N","5 N","0,5 N"],0,"F = m·g = 5 · 10 = 50 N."]],"task":{"q":"Uyingizdagi 5 ta buyumning massasini tarozi bilan aniqlang, har biri uchun og'irlik kuchini hisoblang va Oy/Mars shartida hisoblab, jadval va diagramma tuzing.","a":"F(Yer) = m·10, F(Oy) = m·1,6, F(Mars) = m·3,7. Diagrammada massalar bir xil qoladi, og'irlik ustunlari esa 3 marta qisqaradi.","why":"Hisoblashni o'lchangan ma'lumot bilan bog'lash formulani tushunishni tekshiradi; bir xil massa, turli og'irlik — «massa ≠ og'irlik» tushunchasini aniklashtiradi.","steps":["Buyumlarni torting va massani kg ga o'tkazing (1000 g = 1 kg)","Har biri uchun F = m·10 hisoblang","Jadvalga Oy va Mars qiymatlarini qo'shing","Ustunli diagramma: massa va og'irlikni alohida o'q bilan","Xulosa: diagrammada nima o'zgarmaydi, nima qisqaradi va nima uchun?"],"jihoz":["Oshxona tarozisi yoki shkala","Kalkulyator","Diagramma uchun katakli qog'oz"],"xavfsizlik":["Og'ir buyumni ko'tarishda ustoz yordamini so'rang","Tarozi chegarasidan oshirib bo'lmaydi"]},"act":{"type":"lab","name":"kuch","mode":"massa-ogirlik"},"kitob":{"bobNomi":"Kuchlarning ta’siri","bet":87,"oralig":"87–97","kod":"7.1","amaliyIsh":{"kod":"7.1","nomi":"Gravitatsiyaning ta’siri","bet":77},"boshqotirma":82,"bilimlarXaritasi":83,"takrorlash":84,"mustahkamlash":86},"urinish":{"savollar":["Massa va og‘irlik orasidagi farq nimada?","Gravitatsiya kuchi o‘zgarganda og‘irlik va massa o‘zgaradimi?"],"qism_mavzular":[],"konikmalar":["egallangan bilimlarni qo‘llab tadqiqot natijalarini bashorat qilish;","o‘rganilayotgan obyektlarni kuzatish va tajriba natijalariga asoslanib tasniflash;","o‘lchash ishlarini to‘g‘ri va aniq bajarish;","ishonchli natijalar olish uchun o‘lchashlarni takrorlash zarurligi yuzasidan qaror qabul qilish;","tadqiqot natijalariga asoslanib bashoratning aniqligini bayon etish;","ustunli diagrammadan foydalanib tadqiqot natijalarini izohlash;","tadqiqot natijalaridagi qonuniyatni bayon etish hamda kutilmagan natijalarni aniqlash;","ilmiy tushunchani anglashda modelning ahamiyatini bayon etish;","nazorat qilinadigan tajriba rejasini tuzish va uch xil o‘zgaruvchini aniqlash;","tadqiqot uchun kerakli jihozlarni tanlash va ulardan to‘g‘ri foydalanish.","tadqiqotni yaxshilash yuzasidan taklif berish va uni izohlash;","o‘rganilayotgan obyektlarda kuzatiladigan farqlarga asoslanib kalit-aniqlagich tuzish."],"tatbiq":["tabiiy fanlar yutuqlaridan kundalik hayotda foydalanilishini bayon etish."]}},{"d":7,"c":2,"kod":"7.2","t":"Harakatlanayotgan jismlarga ta’sir qiluvchi kuchlar","chorak":3,"lab":"suzish","labMode":"shakl","labTitle":"","theory":"Harakatlanayotgan jismga bir nechta kuch bir vaqtda ta'sir qiladi: itarish/tortish, og'irlik, tayanch reaksiyasi, ishqilanish va havo (suyuqlik) qarshiligi. Natija — bu kuchlarning yig'indisi, ya'ni teng ta'sir etuvchi kuch.\n\nAgar teng ta'sir etuvchi nolga teng bo'lsa — jism tezlanmaydi: tinch turadi yoki tekis to'g'ri chiziqli harakatlanadi. Kuch bo'lsa — tezlik o'zgaradi (tezlanish, sekinlashish yoki yo'nalishning burilishi).\n\nIshqilanish — sirtlarning bir-biriga nisbatan harakatiga to'sqinlik. Foydali tomonlari: yurish, tormoz, qog'ozda yozish; zararli tomonlari: sirtlarning yeyilishi, qizish, energiya sarfi. Ishqilanishni kamaytirish uchun moylash, shohsimon sirt, rulman va «silliq» materiallar ishlatiladi; oshirish uchun esa rezina iz, qum sochish va naqshli sirtlar qilinadi.\n\nSuyuqlikdagi jismga itarib chiqaruvchi (Arximed) kuchi ta'sir qiladi: F(A) = ρ(suyuqlik) · g · V(jism). Jismning og'irlik kuchi undan katta bo'lsa — cho'kadi, kichik bo'lsa — suzadi. Zichlik orqali qarash qulayroq: jismning o'rtacha zichligi suyuqliknikidan kichik bo'lsa suzadi.\n\nShakl va massa suzishga qanday ta'sir qiladi? Bir xil plastilinni shar qilsangiz cho'kadi, kicha qilsangiz — suzadi: hajm (shakl) o'zgarsa, suyuqlikning itarib chiqarish kuchi ortadi. Kema po'latdan bo'lsa ham, ichi bo'sh va umumiy zichlik suvnikidan kichik.","formulas":["Teng ta'sir etuvchi: R = F₁ + F₂ (yo'nalishni hisobga oling)","R = 0 → tezlik o'zgarmaydi","F = m · a (kuch ortsa, tezlanish ortadi)","Arximed kuchi: F_A = ρ · g · V","Suzish sharti: ρ_jism \u003c ρ_suyuqlik","Ishqilanishni kamaytirish: moylash, silliq sirt, rulman"],"vocab":[{"w":"Teng ta'sir etuvchi kuch","m":"bir nechta kuch o'rnini bosuvchi bitta kuch"},{"w":"Muvozanat","m":"kuchlar o'zaro yo'qqa chiqqan holat"},{"w":"Ishqilanish kuchi","m":"harakatga to'sqinlik qiluvchi kuch"},{"w":"Arximed kuchi","m":"suyuqlik (gaz) jismiga itarib chiqaradigan kuch"},{"w":"Zichlik","m":"birlik hajmdagi massa, ρ = m/V"},{"w":"Suyuqlik qarshiligi","m":"harakat tezligiga bog'liq to'sqinlik kuchi"}],"quiz":[["Jismga ta'sir qiluvchi kuchlar o'zaro yo'qqa chiqsa nima bo'ladi?",["Jism tezlanadi","Jism to'xtaydi","Tezlik o'zgarmaydi — tinchlik yoki tekis harakat","Jism yuqoriga ko'tariladi"],2,"Nol teng ta'sir etuvchi — tezlanish bo'lmaydi."],["Yog'och bo'lagi suvda suzadi, temir cho'kadi. Nega?",["Temir suvni o'tkazmaydi","Suv temirni tortadi","Yog'och yengilroq massaga ega","Yog'ochning o'rtacha zichligi suvniki kichik"],3,"Zichlik solishtirish orqali qaraladi, faqat og'irlik emas."],["Ishqilanishni kamaytirish usuli — qaysi?",["Sirtni qo'pol qilish","Moylash yoki rulman ishlatish","Tezlikni oshirish","Kuchni oshirish"],1,"Moylash qatlam va rulman sirtlarni ajratadi."],["Plastilin suvda cho'kadi; uni kicha qilsangiz suzadi. Sabab nima?",["Massasi kamayadi","Suv bilan aloqa hajmi ortib, itarib chiqarish kuchi oshadi","Zichligi o'zgaradi","Harorati oshadi"],1,"Shakl o'zgarsa — V ortadi, Arximed kuchi (ρ·g·V) ham ortadi."],["Harakat yo'nalishini o'zgartirish uchun nima kerak?",["Yo'nalish o'zgargan kuch","Massani oshirish","Ishqilanishni yo'q qilish","Tezlikni oshirish"],0,"Kuch — tezlanish sababi, u shuningdek burilishni ham beradi."]],"slideQuiz":[["Kema po'latdan yasalgan bo'lsa ham suvda suzadi — qanday?",["Ichida havo bo'lgani uchun umumiy o'rtacha zichlik suvniki kichik","Arximed kuchi yo'q","Po'lat suvda suzadi","Kuch kichrayadi"],0,"O'rtacha zichlik muhim: ρ_umumiy \u003c ρ_suv."],["Parashyutchi ochilgan parashyut bilan sekin tushadi, chunki...",["Havo qarshiligi kuchayadi","Og'irlik kuchi kamayadi","Ishqilanish yo'qoladi","Massa ortadi"],0,"Yuza ortishi bilan qarshilik kuchi oshadi."]],"game":[["Kuchni vazifasi bilan moslashting: ishqilanish",["Tezlikni doim oshiradi","Harakatga to'sqinlik qiladi","Jismni yuqoriga itaradi","Massani oshiradi"],1,"Ishqilanish harakatga qarshi yo'nalgan."],["Qaysida suzish uchun itarib chiqarish kuchi eng katta (bir xil hajmdagi jism)?",["Sovuq suvda","Oddiy suvda","Havoda","Tuzli suvda"],3,"Tuzli suvning zichligi katta → F_A = ρ·g·V ortadi."],["Bir xil shakldagi shar va kubni turing: 5 N og'irlikka 8 N itarib chiqarish kuchi bor. Nima bo'ladi?",["Yuqoriga ko'tariladi (suzadi)","Tinch turadi","Cho'kadi","Tezlanib pastga ketadi"],0,"Arximed kuchi > og'irlik kuchi → natija yuqoriga."]],"gameQuiz":[["Kuchni vazifasi bilan moslashting: ishqilanish",["Tezlikni doim oshiradi","Harakatga to'sqinlik qiladi","Jismni yuqoriga itaradi","Massani oshiradi"],1,"Ishqilanish harakatga qarshi yo'nalgan."],["Qaysida suzish uchun itarib chiqarish kuchi eng katta (bir xil hajmdagi jism)?",["Sovuq suvda","Oddiy suvda","Havoda","Tuzli suvda"],3,"Tuzli suvning zichligi katta → F_A = ρ·g·V ortadi."],["Bir xil shakldagi shar va kubni turing: 5 N og'irlikka 8 N itarib chiqarish kuchi bor. Nima bo'ladi?",["Yuqoriga ko'tariladi (suzadi)","Tinch turadi","Cho'kadi","Tezlanib pastga ketadi"],0,"Arximed kuchi > og'irlik kuchi → natija yuqoriga."]],"task":{"q":"Turli shaklga ega bo'lgan suzuvchi jismlar modeli: bir xil massali plastilinni (a) shar, (b) kichka, (c) katta idish shakliga soling. Har birini suvga qo'ying va natijani yozing; so'ng suzish uchun maksimal hajmni toping.","a":"Shar — cho'kadi; kichka va katta idish — suzaydi, ammo katta hajmli ko'proq yuk ko'taradi, chunki suvning itarib chiqarish kuchi ko'proq hajmga to'g'ri keladi.","why":"Shakl suvning itarib chiqarish kuchini o'zgartiradi: V ortsa → Arximed kuchi ortadi. Bu kema va qayiq konstruksiyasining asosi.","steps":["Bir marta plastilinni shakllantiring va massani torting (o'zgarmasligini tekshiring)","Uch shakl uchun cho'kadi/suzaydi jadvalini to'ldiring","Kichkaga tangalik qo'shib, qancha yukgacha suzayotganini yozing","Hajm va yuk o'rtasidagi bog'lanishni diagrammaga chizing","Xulosa: suzuvchi idishni nima belgilaydi?"],"jihoz":["Plastilin (bir xil massa uchun 3 bo'lak)","Katta suvli idish (yuvilgan idish)","Tangalik yoki mayda shaylar","Katta idish va qog'oz sochiq","Tarozi"],"xavfsizlik":["Suvi to'kilgan joyda sirpanish xavfi bor — qog'oz sochiq tayyor tuting","Plastilinni og'izga olmang"]},"act":{"type":"lab","name":"suzish","mode":"shakl"},"kitob":{"bobNomi":"Kuchlarning ta’siri","bet":87,"oralig":"87–97","kod":"7.2","amaliyIsh":{"kod":"7.2","nomi":"Turli shaklga ega bo‘lgan suzuvchi jismlar","bet":79},"boshqotirma":82,"bilimlarXaritasi":83,"takrorlash":84,"mustahkamlash":86},"urinish":{"savollar":["Jismlarga kuchlar qanday ta’sir qiladi?","Jism massasi va shakli uning suzishi yoki cho‘kishiga qanday ta’sir qiladi?"],"qism_mavzular":[],"konikmalar":["egallangan bilimlarni qo‘llab tadqiqot natijalarini bashorat qilish;","o‘rganilayotgan obyektlarni kuzatish va tajriba natijalariga asoslanib tasniflash;","o‘lchash ishlarini to‘g‘ri va aniq bajarish;","ishonchli natijalar olish uchun o‘lchashlarni takrorlash zarurligi yuzasidan qaror qabul qilish;","tadqiqot natijalariga asoslanib bashoratning aniqligini bayon etish;","ustunli diagrammadan foydalanib tadqiqot natijalarini izohlash;","tadqiqot natijalaridagi qonuniyatni bayon etish hamda kutilmagan natijalarni aniqlash;","ilmiy tushunchani anglashda modelning ahamiyatini bayon etish;","nazorat qilinadigan tajriba rejasini tuzish va uch xil o‘zgaruvchini aniqlash;","tadqiqot uchun kerakli jihozlarni tanlash va ulardan to‘g‘ri foydalanish.","tadqiqotni yaxshilash yuzasidan taklif berish va uni izohlash;","o‘rganilayotgan obyektlarda kuzatiladigan farqlarga asoslanib kalit-aniqlagich tuzish."],"tatbiq":["tabiiy fanlar yutuqlaridan kundalik hayotda foydalanilishini bayon etish."]}},{"d":8,"c":1,"kod":"8.1","t":"Yorug‘likning qaytishi","chorak":3,"lab":"yoruglik","labMode":"qaytish","labTitle":"","theory":"Yorug'lik — bizga obyektlarni ko'rish imkonini beruvchi elektromagnit to'lqin. Yorug'lik manbai (Quyosh, chiroq, olov) nur chiqaradi; qolgan jismlar esa nurini qaytaradi — shuning uchun biz ularni ko'ramiz.\n\nBir jinsli muhitda yorug'lik to'g'ri chiziq bo'ylab tarqaladi. Shu xossadan soyalar, oynada ko'rinadigan tasvir va tutilishlar hosil bo'ladi.\n\nYassi ko'zguda qaytish qonuni ishlaydi: tushish burchagi qaytish burchagiga teng (α = β). Burchaklar ko'zgu yuzasiga o'tkazilgan normalga nisbatan o'lchanadi — bu eng ko'p uchraydigan xato.\n\nQaytish ikki xil: yonma-yon (ko'zgu, silli metall) va sochranki (qog'oz, devor, matoning). Sochranki qaytish tufayli biz kitobni, devorni, daraxtni har qanday burchakdan ko'ramiz — agar hamma sirt ko'zgu kabi bo'lganda edi, biz faqat yaltiroq dog'lar ko'rgan bo'lardik.\n\nQora va oq sirtlar: och ranglar yorug'likni yaxshi qaytaradi, qora yutadi (shu sabab qora kiyimda issiq, oq kiyimda salqin). Bu — qaytish xossasining kundalik hayotdagi tatbiqi.","formulas":["Yorug'lik bir jinsli muhitda to'g'ri chiziq bo'ylab tarqaladi","Qaytish qonuni: α = β (normalga nisbatan)","Normal — sirtga perpendikulyar chiziq","Yonma-yon qaytish → tasvir; sochranki → hamma yo'nalishda ko'rish","Och sirt yaxshi qaytaradi, qora yutadi","Ko'zguda tasvir: buyum masofasi = tasvir masofasi"],"vocab":[{"w":"Nur","m":"yorug'lik tarqalish yo'nalishini ko'rsatuvchi to'g'ri chiziq"},{"w":"Qaytish","m":"yorning sirtga urilib orqaga qaytishi"},{"w":"Normal","m":"sirtga tushish nuqtasida o'tkazilgan perpendikulyar"},{"w":"Sochranki qaytish","m":"yorning har tomonga tarqalib qaytishi"},{"w":"Yonma-yon qaytish","m":"silliq sirtdan bir yo'nalishda qaytish"},{"w":"Yutuqlik","m":"sirtning yorug'likni yutish qobiliyati"}],"quiz":[["Yorug'lik yassi ko'zguga 30° burchak ostida tushsa, qaytish burchagi qancha?",["90°","30°","60°","15°"],1,"Qaytish burchagi tushish burchagiga teng (ikkalasi ham normalga nisbatan)."],["Nega biz kitobni har qanday yo'nalishdan ko'ramiz?",["Yorug'lik sinadi","Sirt yorug'likni sochranki qaytaradi","Kitob nur chiqaradi","Ko'zimiz harakatlanadi"],1,"Sochranki qaytish yorni har tomonga tarqatadi."],["Qora futbolkani quyoshda tutish — nima uchun issiq?",["Mato havo o'tkazmaydi","Qora yorug'likni ko'p yutadi","Qora yorug'likni qaytaradi","Rang haroratni oshiradi"],1,"Yutilgan energiya issiqlikka aylanadi."],["Ko'zgu oldida 1,5 m uzoqda tursangiz, tasvir qancha masofada bo'ladi?",["3 m","Ko'zgu yuzasida","Ko'zgu ortida 1,5 m","0,75 m"],2,"Tasvir ko'zgu ortida buyum masofasiga teng masofada hosil bo'ladi."],["Yorug'lik nima uchun to'g'ri chiziq bo'ylab tarqalishi soyani hosil qiladi?",["Sirt orqasida yorug'lik yetmaydigan soya bo'ladi","Sova havoni yutadi","Sirt issiqlik tarqatadi","Yorug'lik sekinlaydi"],0,"To'g'ri chiziqli tarqalish — to'siq ortida qorong'u maydon sababi."]],"slideQuiz":[["Burchaklar nimaga nisbatan o'lchanadi?",["Yorug'lik manbasiga","Sirt yuzasiga","Normalga (sirtga perpendikulyar chiziqqa)","Ko'zga"],2,"Sirt yuzasiga nisbatan olsak, 60° chiqadi — xato."],["Tungi yo'lda yaltiroq jileyklarning vazifasi nima?",["Yorug'likni yutish","Rangni o'zgartirish","Yorug'likni haydovchi tomon qaytarish","Issiqlik saqlash"],2,"Qaytaruvchi elementlar xavfsizlikni oshiradi."]],"game":[["Hodisani qonuniyat bilan moslashting: ko'zguda tasvir",["Sochranki qaytish","Sinish","Yutulish","Yonma-yon qaytish"],3,"Silliq sirt yorni bir yo'nalishda qaytaradi."],["Qaysi sirt yorug'likni eng yaxshi qaytaradi?",["Qop-qora plastinka","Oq silliq qog'oz","Ko'mir","Qora mato"],1,"Och va silliq — yonma-yon qaytish kuchli."],["Tushish burchagi 45° bo'lsa, tushuvchi va qaytuvchi nurlar orasidagi burchak qancha?",["90°","135°","45°","180°"],0,"α + β = 45° + 45° = 90°."]],"gameQuiz":[["Hodisani qonuniyat bilan moslashting: ko'zguda tasvir",["Sochranki qaytish","Sinish","Yutulish","Yonma-yon qaytish"],3,"Silliq sirt yorni bir yo'nalishda qaytaradi."],["Qaysi sirt yorug'likni eng yaxshi qaytaradi?",["Qop-qora plastinka","Oq silliq qog'oz","Ko'mir","Qora mato"],1,"Och va silliq — yonma-yon qaytish kuchli."],["Tushish burchagi 45° bo'lsa, tushuvchi va qaytuvchi nurlar orasidagi burchak qancha?",["90°","135°","45°","180°"],0,"α + β = 45° + 45° = 90°."]],"task":{"q":"«Yorug'likning qaytishi» — ko'zgu, lazer nuri (yoki qo'l chirog'i + naycha) va transportir bilan 3 ta burchakni (30°, 45°, 60°) o'lchang. Tushish va qaytish burchaklarini yozib, qonuniyatni asoslang.","a":"Har bir holatda qaytish burchagi tushish burchagiga teng (±2° o'lchov xatosi). Grafik — chiziqli bog'lanish: α = β.","why":"O'lchovlarni takrorlash va jadvalga kiritish qonuniyatni tasodifdan ajratishga yordam beradi — bu tadqiqotchilik ko'nikmalarining bevosita tatbiqi.","steps":["Ko'zguni qog'ozning chizilgan chizig'i bo'ylab tik qo'ying","Nurni 30° burchak ostida tushiring va qaytish yo'lini belgilang","Ikkala burchakni transportir bilan o'lchang","45° va 60° da takrorlang; jadvalga kiriting","Xulosa: burchaklar farqi qancha? Xato sabablari nima?"],"jihoz":["Yassi ko'zgu (ushlagichi bilan)","Qo'l chirog'i yoki lazer (past quvvatli)","Transportir, chizg'ich, qalam","Qora fonli qog'oz"],"xavfsizlik":["Lazerni hech qachon ko'zga yoki yuzga qaratmang","Ko'zgu chetlari o'tkir bo'lishi mumkin — ushlagichi bilan tuting","Chiroq isishi mumkin — qo'lqop yoki sochiq bilan ushlang"]},"act":{"type":"lab","name":"yoruglik","mode":"qaytish"},"kitob":{"bobNomi":"Yorug‘likning tarqalishi","bet":98,"oralig":"98–108","kod":"8.1","amaliyIsh":{"kod":"8.1","nomi":"Yorug‘likning qaytishi","bet":88},"boshqotirma":91,"bilimlarXaritasi":92,"takrorlash":93,"mustahkamlash":95},"urinish":{"savollar":["Yorug‘lik yassi ko‘zgudan qanday qaytadi?"],"qism_mavzular":[],"konikmalar":["o‘rganilayotgan obyektlarni kuzatish natijalariga asoslanib tasniflash;","tadqiqot natijalaridagi qonuniyatni bayon etish hamda kutilmagan natijalarni aniqlash;","tadqiqotni yaxshilash yuzasidan taklif berish va uni izohlash;","ishonchli natijalar olish uchun o‘lchashlarni takrorlash zarurligi yuzasidan qaror qabul qilish;","ilmiy hodisani tasvirlash va izohlashda modeldan foydalanish;","ilmiy savol qo‘yish va unga javob topishga yordam beradigan eng yaxshi tadqiqot metodini tanlash;","turli tadqiqot metodlarining o‘ziga xos xususiyatlarini anglash;","nazorat qilinadigan tajriba rejasini tuzish va uch xil o‘zgaruvchini aniqlash."],"tatbiq":["tabiiy fanlar yutuqlaridan kundalik hayotda foydalanilishini bayon etish;","tabiiy fanlarning muayyan sohasida faoliyat yurituvchi kasb egalarini aniqlash va ularning faoliyatini tavsiflash;","fan va texnologiya yutuqlaridan foydalanishning atrof-muhitga ijobiy va salbiy ta’sirini muhokama qilish."]}},{"d":8,"c":2,"kod":"8.2","t":"Yorug‘likning sinishi","chorak":3,"lab":"yoruglik","labMode":"sinish","labTitle":"","theory":"Yorug'lik bir muhitdan ikkinchisiga o'tganda uning tezligi o'zgaradi — shuning uchun nur sinadi. Suyuqlik va shisha havoga qaraganda «sekinroq» muhit, ya'ni optiki zichligi katta.\n\nSinish qonuni: havodan suvga o'tganda nur normalga yaqinlashadi (sinish burchagi kichik); suvdan havoga chiqqanda normaldan chetlanadi (sinish burchagi katta). Bu ikki holatning teskarisi.\n\nNega qolom suvda sinib ko'rinadi? Qolomdan chiqqan nur suvdan havoga chiqqanda yo'nalishini o'zgartiradi va ko'z nurini «to'g'ri chiziq bo'ylab» davom ettirib, tasvirni suv ostida emas, biroz yuqorida ko'rsatadi. Shu xato tufayli suv chuqurligi ham kamroq ko'rinadi.\n\nLinzalar — sinishning amaliy tatbiqi. Yig'uvchi (qavariq) linza nurlarni fokusga yig'adi: lupa, fotoapparat, ko'z kristaligi. Sochranki (botiq) linza nurlarni tarqatadi. Linza fokus masofasi uning qavariqlik darajasi va materialiga bog'liq.\n\nOq yorug'likning prizma orqali ranglarga ajralishi — dispersiya. Har bir rangning sinish ko'rsatkichi boshqacha: binafsha eng kuchli, qizil eng zaif sinadi. Kamalak shu hodisaning tabiatdagi namoyishi (tomchilar prizma vazifasini bajaradi).","formulas":["Sinish — tezlik o'zgarishi natijasi","Havo → suv: normalga yaqinlashadi (β \u003c α)","Suv → havo: normaldan chetlanadi (β > α)","Qavariq linza — yig'uvchi; botiq linza — sochranki","Fokus — parallel nurlar yig'iladigan nuqta","Dispersiya: binafsha kuchli, qizil zaif sinadi"],"vocab":[{"w":"Sinish","m":"yorning bir muhitdan ikkinchisiga o'tganda yo'nalishini o'zgartirishi"},{"w":"Optiki zichlik","m":"muhitning yorug'likni sekinlatish darajasi"},{"w":"Fokus","m":"linza yig'gan parallel nurlar kesishadigan nuqta"},{"w":"Dispersiya","m":"oq yorning ranglarga ajralishi"},{"w":"Yig'uvchi linza","m":"nurlarni fokusga to'playdigan qavariq linza"},{"w":"Sochranki linza","m":"nurlarni tarqatuvchi linza"}],"quiz":[["Nur havodan suvga o'tganda nima bo'ladi?",["Orqaga qaytadi","Yo'nalishi o'zgarmaydi","Normalga yaqinlashadi","Normaldan chetlashadi"],2,"Suv — optiki zichroq muhit, tezlik kamayadi, burchak kichrayadi."],["Qolom suvda sinib ko'rinadi, chunki...",["Suv yorug'likni yutadi","Ko'z xafa bo'ladi","Suvdan havoga chiqqan nur yo'nalishini o'zgartiradi","Qolom egiladi"],2,"Tasvir suv ostida emas, biroz yuqorida ko'rinadi."],["Qavariq linza qanday vazifa bajaradi?",["Yorug'likni yutadi","Nurlarni qaytaradi","Nurlarni fokusga yig'adi","Nurlarni tarqatadi"],2,"Shu xossadan lupa va fotoapparat obyektivi foydalanadi."],["Kamalakning hosil bo'lishi qaysi hodisaga asoslangan?",["D
